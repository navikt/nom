version: '3'

networks:
  kafka-net:
    driver: bridge

services:
  postgres-api:
    image: 'postgres:alpine'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres-api'
  postgres-ressurs:
    image: 'postgres:alpine'
    ports:
      - '5433:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres-ressurs'
  postgres-navident:
    image: 'postgres:alpine'
    ports:
      - '5434:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres-navident'

  zookeeper-server:
    image: 'bitnami/zookeeper:latest'
    networks:
      - kafka-net
    ports:
      - '2181:2181'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
  kafka-server:
    image: 'bitnami/kafka:latest'
    networks:
      - kafka-net
    ports:
      - '9092:9092'
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper-server:2181
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CREATE_TOPICS=aapen-nom-ressurs-v1:1:1:compact, aapen-skjermede-personer-v1:1:1:compact, nav-ident:1:1:delete, nav-ident-rnr:1:1::delete
    depends_on:
      - zookeeper-server
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8089:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  redis-server:
    container_name: redis
    image: 'redis'
    ports:
      - "6379:6379"

volumes:
  pgadmin-data:
