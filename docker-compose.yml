version: '2'

networks:
  kafka-net:
    driver: bridge
services:
  postgres-ressurs:
    image: 'postgres:alpine'
    ports:
     - '5432:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: "postgres-ressurs"
  postgres-skjermet:
    image: 'postgres:alpine'
    ports:
      - '5433:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: "postgres-skjermet"
  zookeeper-server:
    image: 'bitnami/zookeeper:latest'
    networks:
      - kafka-net
    ports:
      - '2181:2181'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
  kafka-server1:
    image: 'bitnami/kafka:latest'
    networks:
      - kafka-net
    ports:
      - '9092:9092'
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper-server:2181
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CREATE_TOPICS=aapen-nom-ressurs-v1:1:2:compact
    depends_on:
      - zookeeper-server