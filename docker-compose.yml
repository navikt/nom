version: '3'

networks:
  kafka-net:
    driver: bridge

services:
  postgres-enheter:
    image: 'postgres:alpine'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres-enheter'
  postgres-ressurs:
    image: 'postgres:alpine'
    ports:
     - '5433:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres-ressurs'
  postgres-skjermet:
    image: 'postgres:alpine'
    ports:
      - '5434:5432'
    environment:
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres-skjermet'
  zookeeper-server:
    image: 'bitnami/zookeeper:latest'
    networks:
      - kafka-net
    ports:
      - '2181:2181'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
  kafka-server:
    image: 'bitnami/kafka:latest'
    networks:
      - kafka-net
    ports:
      - '9092:9092'
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper-server:2181
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CREATE_TOPICS=aapen-nom-ressurs-v1:1:1:compact, aapen-skjermede-personer-v1:1:1:compact
    depends_on:
      - zookeeper-server
  ibm-mq:
    image: 'ibmcom/mq:latest'
    ports:
      - '1414:1414'
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QMTEST
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8089:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgadmin-data:
