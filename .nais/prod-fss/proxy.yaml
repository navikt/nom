apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-proxy
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: prod
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash,k8s,kafka
    - name: DVH_BASE_URL
      value: https://tdv-p.adeo.no
    - name: DVH_BASE_URL_NS
      value: https://tdv-ns.adeo.no:9402
    - name: ACCEPTED_SUBJECTS
      value: 476401e7-5eec-4fd8-8390-a89c6f14cd08, 624438e9-8605-4225-81db-4b47dc629766
    - name: STS_BASEURL
      value: https://security-token-service.nais.adeo.no
    - name: PDL_BASEURL
      value: https://pdl-api.intern.nav.no
    - name: LDAP_URL
      value: ldaps://ldapgw.adeo.no:636
    - name: LDAP_BASE
      value: DC=adeo,DC=no
  envFrom:
    - secret: nom-tdv-cred
    - secret: nom-api-serviceuser
  image: {{image}}
  port: 8080
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
        - application: nom-api-qa
          namespace: nom
          cluster: prod-gcp
  webproxy: true
  ingresses:
    - https://nom-proxy.intern.nav.no
    - https://nom-proxy.prod-fss-pub.nais.io
  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/prod/srvnomad
        mountPath: /var/run/secrets/nais.io/srvnomad
