apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: skjermede-personer
  namespace: default
  labels:
    team: nom
spec:
  env:
    - name: DB_HOST
      value: A01DBVL009.adeo.no
    - name: DB_NAME
      value: skjermede-personer-prod
    - name: DB_ENV
      value: prod-fss
    - name: NOM_RESSURSER_API
      value: https://nom-ressurser.nais.adeo.no/api/v1/ressurs
    - name: FORESPORSEL_API
      value: https://www.nav.no/person/personopplysninger/skjerming-proxy/v1/foresporsel
    - name: AAD_ISSUER_URI
      value: https://login.microsoftonline.com/62366534-1ec3-4962-8869-9b5535279d0b
    - name: AAD_REDIRECT_BASE_URI
      value: https://www.nav.no
    - name: AAD_B2C_DISCOVERYURL
      value: https://login.microsoftonline.com/navnob2c.onmicrosoft.com/v2.0/.well-known/openid-configuration?p=B2C_1A_idporten
    - name: LOGINSERVICE_CLIENTID
      value: 45104d6a-f5bc-4e8c-b352-4bbfc9381f25
    - name: STS_DISCOVERYURL
      value: http://security-token-service.default.svc.nais.local/rest/v1/sts/.well-known/openid-configuration
    - name: STS_AUD_SERVICEUSER
      value: NONE
    - name: TPS_MQ_QUEUE_MANAGER_URL
      value: mq://a01apvl062.adeo.no:1414/MPLSC03
    - name: TPS_MQ_QUEUE_CHANNEL
      value: P_SKJERMET
    - name: TPS_MQ_QUEUE_NAME
      value: QA.P412.SFE_ENDRINGSMELDING
    - name: TPS_MQ_QUEUE_USERNAME
      value: srvappserver
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: a01apvl00145.adeo.no:8443,a01apvl00146.adeo.no:8443,a01apvl00147.adeo.no:8443,a01apvl00148.adeo.no:8443,a01apvl00149.adeo.no:8443,a01apvl00150.adeo.no:8443
    - name: SPRING_KAFKA_TOPIC_RESSURS_NAME
      value: aapen-nom-ressurs-v1
    - name: VAULT_USER_SECRET_PATH
      value: serviceuser/prod/srvnom-skjermet
    - name: STACK
      value: prod
  image: {{image}}
  port: 8080
  ingresses:
    - https://skjermede-personer.nais.adeo.no
  webproxy: true
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  vault:
    enabled: true
    paths:
      - mountPath: /var/run/secrets/nais.io/azuread
        kvPath: /azuread/data/prod/creds/skjermede-personer
  leaderElection: true
  prometheus:
    enabled: true
    path: internal/prometheus
