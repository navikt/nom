apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: skjermede-personer
  namespace: default
  labels:
    team: nom
spec:
  env:
    - name: DB_HOST
      value: A01DBVL009.adeo.no
    - name: DB_NAME
      value: skjermede-personer-prod
    - name: DB_ENV
      value: prod-fss
  image: {{image}}
  port: 8080
  ingresses:
    - https://skjermede-personer.nais.adeo.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  vault:
    enabled: true
  prometheus:
    enabled: true
    path: internal/prometheus
