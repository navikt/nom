apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash,kafka
    - name: PDL_BASEURL
      value: https://pdl-api.prod-fss-pub.nais.io
    - name: PDL_CLIENT_ID
      value: prod-fss.pdl.pdl-api
    - name: NOM_PROXY_BASEURL
      value: https://nom-proxy.prod-fss-pub.nais.io
    - name: NOM_PROXY_CLIENT_ID
      value: prod-fss.nom.nom-proxy
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-api.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui
        - application: team-catalog-backend
          cluster: prod-fss
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
    outbound:
      external:
        - host: nom-proxy.prod-fss-pub.nais.io
