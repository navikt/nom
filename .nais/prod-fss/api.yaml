apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash,kafka
    - name: NOM_DVH_BASEURL
      value: https://nom-dvh.prod-fss-pub.nais.io
    - name: NOM_DVH_CLIENT_ID
      value: 4a4249da-3552-4615-9cec-485a97148fac
    - name: VAULT_USER_SECRET_PATH
      value: serviceuser/prod/srvnom-api
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-api.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui
        - application: team-catalog-backend
          namespace: teamdatajegerne
          cluster: prod-fss
    outbound:
      external:
        - host: nom-dvh.prod-fss-pub.nais.io
