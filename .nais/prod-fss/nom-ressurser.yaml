apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-ressurser
  namespace: default
  labels:
    team: nom
spec:
  env:
    - name: DB_HOST
      value: A01DBVL009.adeo.no
    - name: DB_NAME
      value: nom-ressurser-prod
    - name: DB_ENV
      value: prod-fss
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: a01apvl00145.adeo.no:8443,a01apvl00146.adeo.no:8443,a01apvl00147.adeo.no:8443,a01apvl00148.adeo.no:8443,a01apvl00149.adeo.no:8443,a01apvl00150.adeo.no:8443
    - name: SPRING_KAFKA_TOPIC_RESSURS_NAME
      value: aapen-nom-ressurs-v1
    - name: VAULT_USER_SECRET_PATH
      value: serviceuser/prod/srvnom-ressurser
    - name: STACK
      value: prod
    - name: DVH_ENDPOINT
      value: https://tdv-p.adeo.no:9402/json/Hr/Nom/Nom_Ansatte
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-ressurser.nais.adeo.no
    - https://nom-ressurser.adeo.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  webproxy: true
  leaderElection: true
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  vault:
    enabled: true
  prometheus:
    enabled: true
    path: internal/prometheus
