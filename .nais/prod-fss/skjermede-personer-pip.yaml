apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: skjermede-personer-pip
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: a01apvl00145.adeo.no:8443,a01apvl00146.adeo.no:8443,a01apvl00147.adeo.no:8443,a01apvl00148.adeo.no:8443,a01apvl00149.adeo.no:8443,a01apvl00150.adeo.no:8443
    - name: STACK
      value: prod
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
  image: {{image}}
  port: 8080
  ingresses:
    - https://skjermede-personer-pip.nais.adeo.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 80
    periodSeconds: 5
    timeout: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/prod/srvnom-skjermet
        mountPath: /var/run/secrets/nais.io/srv
  prometheus:
    enabled: true
    path: internal/prometheus
