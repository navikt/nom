apiVersion: "nais.io/v1"
kind: "Alert"
metadata:
  name: skjermede-personer-alerts
  namespace: nom
  labels:
    team: nom
spec:
  receivers:
    slack:
      channel: '#nom-alerts'
      prependText: '<!here> | '
  alerts:
    - alert: applikasjon nede
      expr: up{app="skjermede-personer", job="kubernetes-pods"} == 0
      for: 2m
      description: "{{ $labels.app }} er nede"
      action: "`kubectl describe pod {{ $labels.kubernetes_pod_name }}` for events, og `kubectl logs {{ $labels.kubernetes_pod_name }} -c {{ $labels.app }}` for logger"
    - alert: høy feilrate i logger
      expr: (100 * sum by (log_app, log_namespace) (rate(logd_messages_total{log_app="skjermede-personer",log_level=~"Warning|Error"}[3m])) / sum by (log_app, log_namespace) (rate(logd_messages_total{log_app="skjermede-personer"}[3m]))) > 10
      for: 3m
      action: "Sjekk loggene til app {{ $labels.log_app }}, for å se hvorfor det er så mye feil"
    - alert: mye trafikk mot skjermede-personers sikrede endepunkt
      expr: sum(increase(http_server_requests_seconds_count{app="skjermede-personer", kubernetes_namespace="default", uri=~"/api/v1/(foresporsel|skjerming)(/.*|)$"}[10m])) > 40
      for: 1m
      severity: warning
      description: "Uvanlig mye trafikk mot de sikrede endepunktene i skjermede-personer"
      action: "Sjekk Grafana for å se hvorfor det er så mye trafikk."