apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-ui-qa
  namespace: nom
  labels:
    team: nom
spec:
  image: {{image}}
  port: 8080
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: NOM_API_CLIENT_ID
      value: 8cdd56f3-6ba5-4460-986a-0b3e535baf20
    - name: NOM_API_BASE_URL
      value: http://nom-api-qa
  ingresses:
    - https://nom-ui-qa.intern.nav.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: 1000m
      memory: 320Mi
  prometheus:
    enabled: true
    path: /internal/prometheus
  azure:
    application:
      enabled: true
      replyURLs:
        - https://nom-ui-qa.intern.nav.no/login/oauth2/code/aad
      claims:
        groups:
          - id: "eb3dd903-42c9-4337-b8df-618a45da47cd"
  accessPolicy:
    outbound:
      rules:
        - application: nom-api-qa

