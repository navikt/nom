apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-dvh
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: prod
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash,k8s,kafka
    - name: APP_DVH_BASE_URL
      value: https://tdv-p.adeo.no:9402
    - name: ACCEPTED_SUBJECTS
      value: 476401e7-5eec-4fd8-8390-a89c6f14cd08
  envFrom:
    - secret: nom-tdv-cred
  image: {{image}}
  port: 8080
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
  webproxy: true
  ingresses:
    - https://nom-dvh.intern.nav.no
    - https://nom-dvh.prod-fss-pub.nais.io
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  vault:
    enabled: true
  kafka:
    pool: nav-prod
