apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-dvh
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: prod
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash,k8s,vault
    - name: VAULT_USER_SECRET_PATH
      value: serviceuser/prod/srvnom-dvh
    - name: APP_DVH_BASE_URL
      value: https://tdv-p.adeo.no:9402
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: a01apvl00145.adeo.no:8443,a01apvl00146.adeo.no:8443,a01apvl00147.adeo.no:8443,a01apvl00148.adeo.no:8443,a01apvl00149.adeo.no:8443,a01apvl00150.adeo.no:8443
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-dvh.nais.adeo.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  vault:
    enabled: true
