apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-ident
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: PDL_CLIENT_ID
      value: dev-fss.pdl.pdl-api
    - name: PDL_BASE_URL
      value: https://pdl-api.dev-fss-pub.nais.io
    - name: REDIS_HOST
      value: nav-ident-redis.org.svc.cluster.local
  image: {{image}}
  port: 8080
  ingresses:
    - https://nav-ident.dev.intern.nav.no
  webproxy: true
  leaderElection: false
  replicas:
    min: 2
    max: 3
    cpuThresholdPercentage: 50
  startup:
    path: internal/health/startupState
    initialDelay: 30
    periodSeconds: 15
    failureThreshold: 5
  liveness:
    path: internal/health/liveness
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 5
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  prometheus:
    enabled: true
    path: internal/prometheus

  gcp:
    sqlInstances:
      - type: POSTGRES_14
        databases:
          - name: nav-ident-db
            envVarPrefix: DATABASE

  azure:
    application:
      enabled: true
      claims:
        extra:
          - "idtyp"

  kafka:
    pool: nav-dev
  accessPolicy:
    inbound:
      rules:
        - application: ida
          namespace: traktor
          cluster: prod-fss
        - application: nom-api
          namespace: nom
          cluster: dev-gcp
    outbound:
      rules:
        - application: nav-ident-redis

---

apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  labels:
    team: org
  annotations:
    nais.io/read-only-file-system: "false"
    nais.io/run-as-user: "999"
  name: nav-ident-redis
  namespace: org
spec:
  image: redis:latest
  port: 6379
  replicas: # A single Redis-app doesn't scale
    min: 1
    max: 1 # More replicas doesn't sync
  resources: # you need to monitor the resource usage yourself
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 6379
    protocol: redis
  accessPolicy: # for GCP
    inbound:
      rules:
        - application: nav-ident
