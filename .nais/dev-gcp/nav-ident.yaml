apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-ident
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: PDL_CLIENT_ID
      value: dev-fss.pdl.pdl-api
    - name: PDL_BASE_URL
      value: https://pdl-api.dev-fss-pub.nais.io
  image: {{image}}
  port: 8080
  ingresses:
    - https://nav-ident.dev.intern.nav.no
  webproxy: true
  leaderElection: false
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 50
    liveness:
      path: internal/health/liveness
      initialDelay: 30
      periodSeconds: 5
      failureThreshold: 5
    readiness:
      path: internal/health/readiness
      initialDelay: 30
      periodSeconds: 5
      timeout: 4
      failureThreshold: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  gcp:
    sqlInstances:
      - type: POSTGRES_14
        databases:
          - name: nav-ident-db
            envVarPrefix: DATABASE
  azure:
    application:
      enabled: true
  kafka:
    pool: nav-dev
  accessPolicy:
    inbound:
      rules:
        - application: ida
          namespace: default
          cluster: prod-fss