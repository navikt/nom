apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nom.ressurs-eventsource
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    retentionBytes: -1
    retentionHours: -1
  acl:
    - team: nom
      application: nom-api
      access: readwrite
    - team: org
      application: nom-intern-ressurs-state
      access: read
    - team: org
      application: nom-kafka-api-ressurs-state
      access: read
    - team: org
      application: nom-kafka-api-ressurs-state-v3
      access: read
    - team: org
      application: nom-kafka-api-ressurs-state-v4
      access: read
    - team: org
      application: org-kafka-manager
      access: read
    - team: org
      application: nom-remedy-integrasjon
      access: read
    - team: org
      application: nom-kafka-api-hendelser
      access: read
    - team: org
      application: nom-admin
      access: read
    - team: org
      application: nom-kafka-api-ressurs-hendelser
      access: read

---

apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nom.intern-ressurs-state
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    cleanupPolicy: compact
    maxCompactionLagMs: 7200000  # 1000 * 60 * 60 * 2 = 7200000 = 2 hours
  acl:
    - team: org
      application: nom-intern-ressurs-state
      access: readwrite
    - team: nom
      application: nom-api
      access: read
    - team: org
      application: org-kafka-manager
      access: read
    - team: org
      application: nom-admin
      access: read
    - team: org
      application: nom-remedy-integrasjon
      access: read
    - team: org
      application: nom-sf-integrasjon
      access: read
    - team: org
      application: nom-rdbms-data
      access: read     
    - team: nom
      application: skjermede-personer
      access: read

