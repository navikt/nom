apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nom.ressurs-eventsource
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    retentionBytes: -1
    retentionHours: -1
  acl:
    - team: nom
      application: nom-api
      access: readwrite
    - team: org
      application: nom-intern-ressurs-state
      access: read
    - team: org
      application: nom-kafka-api-ressurs-state
      access: read
    - team: org
      application: org-kafka-manager
      access: read
    - team: org
      application: nom-unit4
      access: read

---

apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nom.intern-ressurs-state
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    cleanupPolicy: compact
  acl:
    - team: org
      application: nom-intern-ressurs-state
      access: readwrite
    - team: nom
      application: nom-api
      access: read
    - team: org
      application: org-kafka-manager
      access: read

