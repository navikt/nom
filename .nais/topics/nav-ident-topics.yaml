apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nav-ident
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    retentionBytes: -1
    retentionHours: -1
  acl:
    - team: org
      application: nav-ident
      access: readwrite

---

apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nav-ident-rnr
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 2
    replication: 3
    retentionBytes: -1
    retentionHours: 5
  acl:
    - team: org
      application: nav-ident
      access: readwrite
