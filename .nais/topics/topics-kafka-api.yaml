apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nom.api-ressurs-state-v2
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    cleanupPolicy: compact
  acl:
    - team: org
      application: nom-kafka-api-ressurs-state
      access: readwrite
    - team: org
      application: org-kafka-manager
      access: read
    - team: pdl
      application: pdl-fullmakt
      access: read


