apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: nom-ressurser
  namespace: org
  labels:
    team: org
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    retentionBytes: -1
    retentionHours: -1
  acl:
    - team: nom
      application: nom-ressurser
      access: readwrite
    - team: org
      application: team-catalog-backend
      access: read
    - team: nom
      application: skjermede-personer
      access: read
    - team: nom
      application: nom-api
      access: read
    - team: org
      application: org-kafka-manager
      access: read
    - team: org
      application: nom-admin
      access: read    
