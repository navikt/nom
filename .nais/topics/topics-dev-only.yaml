apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: event.source.sandbox.v1
  namespace: nom
  labels:
    team: nom
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    retentionBytes: -1
    retentionHours: -1
  acl:
    - team: nom
      application: nom-api-sandbox
      access: readwrite
