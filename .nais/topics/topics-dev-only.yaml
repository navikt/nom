apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: event.source.sandbox.v1
  namespace: nom
  labels:
    team: nom
  annotations:
    kafka.nais.io/removeDataWhenResourceIsDeleted: "true"
spec:
  pool: {{kafka-pool}}
  config:
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 3
    retentionBytes: -1
    retentionHours: -1
  acl:
    - team: nom
      application: nom-sandbox-api
      access: readwrite
