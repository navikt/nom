apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-proxy
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: prod
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
  envFrom:
    - secret: nom-tdv-cred
    - secret: nom-api-serviceuser
  image: {{image}}
  port: 8080
  azure:
    application:
      enabled: true
      allowAllUsers: true
  accessPolicy:
    inbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
        - application: nom-api-qa
          namespace: nom
          cluster: prod-gcp
  webproxy: true
  ingresses:
    - https://nom-proxy.intern.nav.no
    - https://nom-proxy.prod-fss-pub.nais.io
  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/prod/srvnomad
        mountPath: /var/run/secrets/nais.io/srvnomad
