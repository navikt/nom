apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-proxy
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: prod
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: JDK_JAVA_OPTIONS
      value: "-Xms1024m -Xmx4096m -Dhttp.proxyHost=webproxy.nais -Dhttps.proxyHost=webproxy.nais -Dhttp.proxyPort=8088 -Dhttps.proxyPort=8088 -Dhttp.nonProxyHosts=localhost|127.0.0.1|10.254.0.1|*.local|*.adeo.no|*.nav.no|*.aetat.no|*.devillo.no|*.oera.no|*.nais.io|*.aivencloud.com|*.intern.dev.nav.no"
  envFrom:
    - secret: nom-unit4-cred
  image: "{{image}}"
  port: 8080
  azure:
    application:
      enabled: true
      allowAllUsers: true
  accessPolicy:
    inbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
        - application: nom-unit4
          namespace: org
          cluster: prod-gcp
        - application: org-token-tool
          namespace: org
          cluster: prod-gcp
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  webproxy: true
  ingresses:
    - https://nom-proxy.intern.nav.no
    - https://nom-proxy.prod-fss-pub.nais.io
  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      memory: 5120Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/prod/srvnomad
        mountPath: /var/run/secrets/nais.io/srvnomad
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic