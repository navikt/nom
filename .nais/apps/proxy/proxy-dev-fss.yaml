apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-proxy
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: preprod
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
  envFrom:
    - secret: nom-tdv-cred
    - secret: nom-api-serviceuser
    - secret: nom-unit4-cred
  image: {{image}}
  port: 8080
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
  accessPolicy:
    inbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: dev-gcp
        - application: nom-sandbox-api
          namespace: nom
          cluster: dev-gcp
        - application: ida
          namespace: traktor
          cluster: prod-fss
        - application: nom-unit4
          namespace: org
          cluster: dev-gcp
  webproxy: true
  ingresses:
    - https://nom-proxy.dev.intern.nav.no
    - https://nom-proxy.dev-fss-pub.nais.io
  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/dev/srvnomad
        mountPath: /var/run/secrets/nais.io/srvnomad

