apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-paarorende
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://paarorende.intern.dev.nav.no
  env:
    - name: NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api/.default
    - name: NOM_ADMIN_GROUP
      value: 9e0e2958-df7a-4376-83f3-9bcbec1f2650
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  resources:
    requests:
      cpu: 300m
      memory: 500Mi
    limits:
      memory: 1Gi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  secureLogs:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: 9e0e2958-df7a-4376-83f3-9bcbec1f2650
        extra:
          - NAVident
  gcp:
    sqlInstances:
      - name: paarorende-v2
        type: POSTGRES_16
        tier: db-custom-1-3840
        databases:
          - name: paarorende
            envVarPrefix: DATABASE
  accessPolicy:
    inbound:
      rules:
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
        - application: nom-ui2
          namespace: org
          cluster: dev-gcp
        - application: nom-api
          namespace: nom
          cluster: dev-gcp
    outbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: dev-gcp
