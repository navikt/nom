# Kopiert fra .nais/apps/paarorende/paarorende-dev.yml (commit: 34e66b74740f39ba761c00f35f39416e7302e93c)
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-paarorende-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
  namespace: org
  labels:
    team: org
spec:
  tokenx:
    enabled: true
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://paarorende-sf-test.intern.dev.nav.no # Auto-utfylt av 'create_additional_dev_deployment.py'
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev,sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
    - name: NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api-sf-test/.default # Auto-utfylt av 'create_additional_dev_deployment.py'
    - name: NOM_ADMIN_GROUP
      value: 9e0e2958-df7a-4376-83f3-9bcbec1f2650
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  resources:
    requests:
      cpu: 300m
      memory: 500Mi
    limits:
      memory: 1Gi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  azure:
    application: # KONTROLLER MANUELT - Kontroller verdi og tilgang før deploy - 'create_additional_dev_deployment.py': Azure-klient, grupper, redirect og azp må vurderes
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: 9e0e2958-df7a-4376-83f3-9bcbec1f2650
        extra:
          - NAVident
  gcp:
    sqlInstances:
      - name: nom-paarorende-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
        type: POSTGRES_18
        tier: db-custom-1-3840
        databases:
          - name: nom-paarorende-sf-test-db # Auto-utfylt av 'create_additional_dev_deployment.py'
            envVarPrefix: DATABASE
  accessPolicy:
    inbound:
      rules:
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
        - application: nom-ui2-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
          namespace: org
          cluster: dev-gcp
        - application: nom-api-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
          namespace: nom
          cluster: dev-gcp
    outbound:
      rules:
        - application: nom-api-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
          namespace: nom
          cluster: dev-gcp
      external:
        - host: org-unleash-api.nav.cloud.nais.io
