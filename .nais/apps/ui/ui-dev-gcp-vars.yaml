name: nom-ui2
ingresses:
  - https://nom-ui2.dev.intern.nav.no
  - https://nom.dev.nav.no
env:
  - name: NOM_API_URL
    value: https://nom-api.dev.intern.nav.no
  - name: NOM_API_SCOPE
    value: api://dev-gcp.nom.nom-api/.default
  - name: TEAM_CATALOG_API_URL
    value: https://teamkatalog-api.dev-fss-pub.nais.io
  - name: TEAM_CATALOG_SCOPE
    value: api://dev-fss.nom.team-catalog-backend/.default
  - name: DEFAULT_BASE_URL
    value: https://nom.dev.nav.no
  - name: NODE_ENV
    value: production
azure:
  application:
    tenant: trygdeetaten.no
    replyURLs:
      - https://nom.dev.nav.no/login/aad/callback
      - https://nom-ui2.dev.intern.nav.no/login/aad/callback
      - http://localhost:3000/login/aad/callback
      - http://localhost:8080/login/aad/callback
accessPolicy:
  outbound:
    rules:
    - application: nom-api
      namespace: nom
      cluster: dev-gcp