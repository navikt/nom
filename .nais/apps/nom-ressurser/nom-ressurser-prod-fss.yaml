apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-ressurser
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: prod
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-ressurser.nais.adeo.no
  azure:
    application:
      enabled: true
  kafka:
    pool: nav-prod
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  webproxy: true
  leaderElection: true
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/prod/srvnom-ressurser
        mountPath: /var/run/secrets/nais.io/srv
  prometheus:
    enabled: true
    path: internal/prometheus
