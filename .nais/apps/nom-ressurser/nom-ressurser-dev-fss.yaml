apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-ressurser
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: ENV
      value: dev
    - name: DB_HOST
      value: b27dbvl009.preprod.local
    - name: DB_NAME
      value: nom-ressurser-dev
    - name: DB_ENV
      value: preprod-fss
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: b27apvl00045.preprod.local:8443,b27apvl00046.preprod.local:8443,b27apvl00047.preprod.local:8443
    - name: SPRING_KAFKA_TOPIC_RESSURS_NAME
      value: aapen-nom-ressurs-v1
    - name: STACK
      value: preprod
    - name: DVH_ENDPOINT
      value: https://tdv-u.adeo.no/json/Hr/Nom/NOM_ANSATTE
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-ressurser.nais.preprod.local
    - https://nom-ressurser.dev.adeo.no
  azure:
    application:
      enabled: true
      tennant: trygdeetaten.no
  webproxy: true
  leaderElection: true
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 1000m
      memory: 4096Mi
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/dev/srvnom-ressurser
        mountPath: /var/run/secrets/nais.io/srv
  prometheus:
    enabled: true
    path: internal/prometheus
