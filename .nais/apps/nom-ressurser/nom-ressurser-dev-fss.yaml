apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-ressurser
  namespace: nom
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: nom
spec:
  env:
    - name: STACK # What does this do?
      value: preprod
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-ressurser.nais.preprod.local
    - https://nom-ressurser.dev.adeo.no
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
  kafka:
    pool: nav-dev
  webproxy: true
  leaderElection: true
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 1000m
      memory: 4096Mi
  vault:
    enabled: true
    paths:
      - kvPath: /serviceuser/data/dev/srvnom-ressurser
        mountPath: /var/run/secrets/nais.io/srv
  prometheus:
    enabled: true
    path: internal/prometheus
