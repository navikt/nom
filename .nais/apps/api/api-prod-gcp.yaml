apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: JAVA_OPTS
      value: "-Xms512m -Xmx1024m"
  envFrom:
    - secret: nom-sluttdato-override-json
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-api.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 300m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "1334a91a-c4e0-409e-a497-3c4453869874"
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: prod-gcp
        - application: team-catalog-frackend
          namespace: org
        - application: team-catalog-backend
          cluster: prod-fss
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
        - application: journalforing-frontend
          namespace: isa
          cluster: prod-fss
        - application: henvendelse-migrering # midlertidig behov ifm en-gangs migrering
          namespace: oppgavehandtering
          cluster: prod-fss
        - application: sparkel-vilkarsproving
          namespace: tbd
          cluster: prod-fss
        - application: amt-tiltak
          namespace: amt
          cluster: prod-gcp
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: prod-fss
        - application: modia-robot-api
          namespace: personoversikt
          cluster: prod-fss
        - application: pdl-fullmakt
          namespace: pdl
          cluster: prod-fss
        - application: oppgavestatistikk
          namespace: oppgavehandtering
          cluster: prod-fss
        - application: remedy-identrutina
          namespace: idm
          cluster: prod-fss
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
        - application: fullmaktsregister-api
          namespace: team-nof
          cluster: prod-gcp
        - application: fullmaktsregister-web
          namespace: team-nof
          cluster: prod-gcp
        - application: org-token-tool
          namespace: org
          cluster: prod-gcp
        - application: oh-ressurs-behandler
          namespace: oppgavehandtering
          cluster: prod-gcp
    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: prod-gcp
      external:
        - host: nom-proxy.prod-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_12
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
