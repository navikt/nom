apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: nom
spec:
  tokenx:
    enabled: true
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: JDK_JAVA_OPTIONS
      value: "-Xms4g -Xmx12g"
    - name: OTEL_JAVAAGENT_LOGGING  # Bli kvitt Otel loggingen https://opentelemetry.io/docs/zero-code/java/agent/configuration/#java-agent-logging-output
      value: none
  envFrom:
    - secret: nom-api-unleash-api-token
    - secret: dvh-ords-secret
    - secret: nom-epost-varsel-recipient
    - secret: nom-mainmanager-secret
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-api.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  startup:
    path: internal/health/startupState
    initialDelay: 15
    periodSeconds: 10
    failureThreshold: 50 # 18*10sec = 3min
  resources:
    requests:
      cpu: 300m
      memory: 12Gi
    limits:
      memory: 20Gi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "1334a91a-c4e0-409e-a497-3c4453869874" # nom-write
          - id: "2d91b26c-d412-440b-9122-0fafc594db89" # nom-admin
          - id: "b32023b5-4644-4b52-b6fc-bbb7723b8fbf" # 0000-GA-NOM-WRITE-DELEGERT
          - id: "f267e0a5-1ef6-4ef1-9303-4543b34f3b05" # 0000-GA-NOM-WRITE-LEDER
          - id: "e219ba08-0685-40b5-95e6-5fd82ec7414a" # NOM-PILOT
          - id: "9b3bcb75-12ae-4af7-aecf-fcd8f5b27dc5" # 0000-CA-NOM-Write-Utl-Konsulent
          - id: "220b7326-c379-4611-b1ad-57c29dd60914" # 0000-CA-NOM-Write-Vikafossen
          - id: "ea2cd5fb-b0c0-4ffa-98ea-c5439dfcc3a9" # 0000-CA-NOM-Write-Robot
          - id: "9a608366-69eb-42a9-a787-3469359ce322" # 0000-CA-NOM-ADMIN-Lesetilgang
          - id: "cea028e1-811f-4cd6-aa67-d0130207fd7a" # 0000-CA-NOM-ADMIN-Utvidet-Lesetilgang
          - id: "818ec344-1c3b-48e5-8a62-68bb9eeb2a09" # orgenhet-kostnadssted-mapping-admin
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: shout-out-api
          namespace: shout-out
          cluster: prod-gcp
        - application: nom-ui2
          namespace: org
          cluster: prod-gcp
        - application: nom-admin-web
          namespace: org
          cluster: prod-gcp
        - application: nom-admin
          namespace: org
          cluster: prod-gcp
        - application: team-catalog-frackend
          namespace: org
        - application: org-ekstern-proxy
          namespace: org
        - application: team-catalog-backend
          cluster: prod-gcp
          namespace: org
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
        - application: veilarbveileder
          namespace: obo
          cluster: prod-gcp
        - application: journalforing-frontend
          namespace: isa
          cluster: prod-fss
        - application: opprett-oppgave-frontend
          namespace: isa
          cluster: prod-gcp
        - application: henvendelse-migrering # midlertidig behov ifm en-gangs migrering
          namespace: oppgavehandtering
          cluster: prod-fss
        - application: sparkel-egenansatt
          namespace: tbd
          cluster: prod-gcp
        - application: amt-person-service
          namespace: amt
          cluster: prod-gcp
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: prod-fss
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: prod-gcp
        - application: modia-robot-api
          namespace: personoversikt
          cluster: prod-fss
        - application: modiacontextholder
          namespace: personoversikt
          cluster: prod-gcp
        - application: modiacontextholder
          namespace: personoversikt
          cluster: prod-fss
        - application: repr-fullmakt
          namespace: repr
          cluster: prod-fss
        - application: oppgavestyring-ressurs-synkronisering
          namespace: oppgavehandtering
          cluster: prod-gcp
        - application: remedy-identrutina
          namespace: idm
          cluster: prod-fss
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
        - application: fullmaktsregister-api
          namespace: team-nof
          cluster: prod-gcp
        - application: fullmaktsregister-web
          namespace: team-nof
          cluster: prod-gcp
        - application: org-token-tool
          namespace: org
          cluster: prod-gcp
        - application: nks-statistikk
          namespace: nks-statistikk
          cluster: knada
        - application: melosys
          namespace: teammelosys
          cluster: prod-fss
        - application: kabal-innstillinger
          namespace: klage
          cluster: prod-gcp
        - application: kabal-api
          namespace: klage
          cluster: prod-gcp
        - application: etterlevelse-backend
          namespace: teamdatajegerne
          cluster: prod-gcp
        - application: toi-veileder
          namespace: toi
          cluster: prod-gcp
        - application: nom-remedy-integrasjon
          namespace: org
          cluster: prod-fss
        - application: saas-proxy
          namespace: platforce
          cluster: prod-gcp
        - application: salesforce
          namespace: teamcrm
          cluster: prod-external
        - application: orgenhet-kostnadssted-mapping-api
          namespace: team-nof
          cluster: prod-gcp
        - application: orgenhet-kostnadssted-mapping-web
          namespace: team-nof
          cluster: prod-gcp
        - application: kodeverk-web
          namespace: team-rocket
          cluster: prod-gcp
        - application: spre-styringsinfo
          namespace: tbd
          cluster: prod-gcp
        - application: idm-kafka-omada-integration
