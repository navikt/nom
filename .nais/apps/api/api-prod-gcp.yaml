          cluster: prod-gcp
        - application: nom-paarorende
          namespace: org
          cluster: prod-gcp
        - application: tilgang
          namespace: aap
          cluster: prod-gcp
        - application: brev
          namespace: aap
          cluster: prod-gcp
        - application: eux-neessi
          namespace: eessibasis
          cluster: prod-gcp
        - application: behandlingsflyt
