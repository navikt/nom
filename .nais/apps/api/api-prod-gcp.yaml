        - application: vaktor-plan
          namespace: vaktor
          cluster: prod-gcp
    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: prod-gcp
        - application: nom-paarorende
          namespace: org
          cluster: prod-gcp
        - application: logging
          namespace: nais-system
      external:
        - host: org-unleash-api.nav.cloud.nais.io
        - host: nom-proxy.prod-fss-pub.nais.io
        - host: pdl-api.prod-fss-pub.nais.io
        - host: nom-remedy-integrasjon.prod-fss-pub.nais.io
        - host: dvh.adeo.no
        - host: nav.mainmanager.no
  gcp:
    sqlInstances:
      - name: nom-api-v2
        type: POSTGRES_16
        tier: db-custom-1-3840
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE
    buckets:
      - name: no-nav-org-prod-missing-orgtilnytninger-storage-bucket
        lifecycleCondition:
          age: 14