apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: JAVA_OPTS
      value: "-Xms2048m -Xmx8192m"
  envFrom:
    - secret: nom-sluttdato-override-json
    - secret: nom-api-unleash-api-token
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-api.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  startup:
    path: internal/health/startupState
    initialDelay: 15
    periodSeconds: 10
    failureThreshold: 18 # 18*10sec = 3min
  resources:
    requests:
      cpu: 300m
      memory: 2048Mi
    limits:
      memory: 10240Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: nav-prod
  secureLogs:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "1334a91a-c4e0-409e-a497-3c4453869874"
          - id: "2d91b26c-d412-440b-9122-0fafc594db89"
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: prod-gcp
        - application: team-catalog-frackend
          namespace: org
        - application: org-ekstern-proxy
          namespace: org
        - application: team-catalog-backend
          cluster: prod-gcp
          namespace: org
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
        - application: journalforing-frontend
          namespace: isa
          cluster: prod-fss
        - application: henvendelse-migrering # midlertidig behov ifm en-gangs migrering
          namespace: oppgavehandtering
          cluster: prod-fss
        - application: sparkel-vilkarsproving
          namespace: tbd
          cluster: prod-fss
        - application: amt-person-service
          namespace: amt
          cluster: prod-gcp
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: prod-fss
        - application: modia-robot-api
          namespace: personoversikt
          cluster: prod-fss
        - application: pdl-fullmakt
          namespace: pdl
          cluster: prod-fss
        - application: oppgavestyring-ressurs-synkronisering
          namespace: oppgavehandtering
          cluster: prod-gcp
        - application: remedy-identrutina
          namespace: idm
          cluster: prod-fss
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
        - application: fullmaktsregister-api
          namespace: team-nof
          cluster: prod-gcp
        - application: fullmaktsregister-web
          namespace: team-nof
          cluster: prod-gcp
        - application: org-token-tool
          namespace: org
          cluster: prod-gcp
        - application: oh-ressurs-behandler
          namespace: oppgavehandtering
          cluster: prod-gcp
        - application: nks-statistikk
          namespace: nks-statistikk
          cluster: knada
        - application: melosys
          namespace: teammelosys
          cluster: prod-fss
        - application: kabal-innstillinger
          namespace: klage
          cluster: prod-gcp
        - application: kabal-api
          namespace: klage
          cluster: prod-gcp
        - application: etterlevelse-backend
          namespace: teamdatajegerne
          cluster: prod-gcp
        - application: toi-veileder
          namespace: toi
          cluster: prod-gcp
        - application: nom-remedy-integrasjon
          namespace: org
          cluster: prod-fss
        - application: oppgavebehandling-api
          namespace: oppgavehandtering
          cluster: prod-gcp
        - application: saas-proxy
          namespace: teamcrm
          cluster: prod-gcp
        - application: salesforce
          namespace: teamcrm
          cluster: prod-external
    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: prod-gcp
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io
        - host: nom-proxy.prod-fss-pub.nais.io
        - host: pdl-api.prod-fss-pub.nais.io
        - host: nom-remedy-integrasjon.prod-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_12
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
