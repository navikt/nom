apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: NIK_BASEURL
      value: https://nav-ident.intern.nav.no
    - name: NIK_CLIENT_ID
      value: prod-gcp.org.nav-ident
    - name: PDL_BASEURL
      value: https://pdl-api.prod-fss-pub.nais.io
    - name: PDL_CLIENT_ID
      value: prod-fss.pdl.pdl-api
    - name: NOM_PROXY_BASEURL
      value: https://nom-proxy.prod-fss-pub.nais.io
    - name: NOM_PROXY_CLIENT_ID
      value: prod-fss.nom.nom-proxy
    - name: GRAPHQL_PREAUTH_QUERY_PERSON
      value: 78847351-6ee0-43cc-9c17-b92bc1eb076d, 407c569a-a2e9-4530-9d9d-0270f4db8cf3
    - name: GRAPHQL_PREAUTH_MUTATION_RESSURS
      value: noone
    - name: NOM_WRITE_GROUPID
      value: "1334a91a-c4e0-409e-a497-3c4453869874"
  envFrom:
    - secret: nom-sluttdato-override-json
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-api.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 2048Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "1334a91a-c4e0-409e-a497-3c4453869874"
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: prod-gcp
        - application: team-catalog-frackend
          namespace: org
        - application: team-catalog-backend
          cluster: prod-fss
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
        - application: journalforing-frontend
          namespace: isa
          cluster: prod-fss
        - application: henvendelse-migrering # midlertidig behov ifm en-gangs migrering
          namespace: oppgavehandtering
          cluster: prod-fss
        - application: sparkel-vilkarsproving
          namespace: tbd
          cluster: prod-fss
        - application: amt-tiltak
          namespace: amt
          cluster: prod-gcp
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: prod-fss
        - application: modia-robot-api
          namespace: personoversikt
          cluster: prod-fss
        - application: pdl-fullmakt
          namespace: pdl
          cluster: prod-fss
        - application: oppgavestatistikk
          namespace: oppgavehandtering
          cluster: prod-fss
        - application: remedy-identrutina
          namespace: idm
          cluster: prod-fss
        - application: veilarbveileder
          namespace: pto
          cluster: prod-fss
    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: prod-gcp
      external:
        - host: nom-proxy.prod-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_12
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
