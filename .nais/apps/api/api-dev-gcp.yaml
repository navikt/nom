apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: JDK_JAVA_OPTIONS
      value: "-XX:+UseZGC -XX:+ZGenerational -XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=4" # Ref https://nav-it.slack.com/archives/C5KUST8N6/p1714054537557279 og https://nav-it.slack.com/archives/C60FFACN5/p1728888091610999
    - name: OTEL_JAVAAGENT_LOGGING  # Bli kvitt Otel loggingen https://opentelemetry.io/docs/zero-code/java/agent/configuration/#java-agent-logging-output
      value: none
  envFrom:
    - secret: nom-api-unleash-api-token
    - secret: dvh-ords-secret
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-api.intern.dev.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  startup:
    path: internal/health/startupState
    initialDelay: 15
    periodSeconds: 10
    failureThreshold: 36 # 36*10sec = 6min
  resources:
    requests:
      cpu: 300m
      memory: 4Gi
    limits:
      memory: 20Gi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  kafka:
    pool: nav-dev
  secureLogs:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: "c5752f26-105a-460f-a538-1859273f5057" # nom-write
          - id: "9e0e2958-df7a-4376-83f3-9bcbec1f2650" # nom-admin
          - id: "e9cd9267-9baf-4078-abb8-7251c4313d32" # 0000-GA-NOM-WRITE-LEDER
          - id: "42d11885-1e29-4fc4-9eed-1b339c2c8e36" # 0000-GA-NOM-WRITE-DELEGERT
          - id: "087625aa-d658-4b00-9d71-8538b1a8fd15" # NOM-PILOT
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: dev-gcp
        - application: nom-admin-web
          namespace: org
          cluster: dev-gcp
        - application: nom-ui2-pr-deploy
          namespace: org
          cluster: dev-gcp
        - application: team-catalog-frackend
          namespace: org
        - application: org-ekstern-proxy
          namespace: org
        - application: azure-token-generator  # For test tokens i dev-gcp laget via https://doc.nais.io/security/auth/azure-ad/usage/#token-generator
          namespace: aura
          cluster: dev-gcp
        - application: team-catalog-backend
          cluster: dev-gcp
          namespace: org
        - application: veilarbveileder
          namespace: obo
          cluster: dev-gcp
        - application: saas-proxy
          namespace: teamcrm
          cluster: dev-gcp
        - application: salesforce
          namespace: teamcrm
          cluster: dev-external
        - application: saas-proxy-test
          namespace: teamcrm
          cluster: dev-gcp
        - application: itestapp
          namespace: teamcrm
          cluster: dev-gcp
        - application: journalforing-frontend-q1
          namespace: isa
          cluster: dev-fss
        - application: journalforing-frontend
          namespace: isa
          cluster: dev-fss
        - application: amt-person-service
          namespace: amt
          cluster: dev-gcp
        - application: remedy-identrutina
          namespace: default
          cluster: dev-fss
        - application: ida
          namespace: traktor
          cluster: prod-fss
        - application: jfr-arena-q2
          namespace: isa
          cluster: dev-fss
        - application: oppgavestyring-backend
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: sparkel-egenansatt
          namespace: tbd
          cluster: dev-gcp
        - application: modiapersonoversikt-api-q0
          namespace: personoversikt
          cluster: dev-fss
        - application: modiapersonoversikt-api-q1
          namespace: personoversikt
          cluster: dev-fss
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: dev-gcp
        - application: modia-robot-api
          namespace: personoversikt
          cluster: dev-fss
        - application: modiacontextholder
          namespace: personoversikt
          cluster: dev-gcp
        - application: modiacontextholder-next
          namespace: personoversikt
          cluster: dev-gcp
        - application: modiacontextholder
          namespace: personoversikt
          cluster: dev-fss
        - application: testnav-nom-proxy-trygdeetaten
          namespace: dolly
          cluster: dev-fss
        - application: pdl-fullmakt
          namespace: pdl
          cluster: dev-fss
        - application: repr-fullmakt
          namespace: repr
          cluster: dev-fss
        - application: oppgavestyring-ressurs-synkronisering
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: abac-test
          namespace: teamabac
          cluster: dev-fss
        - application: fullmaktsregister-web
          namespace: team-nof
          cluster: dev-gcp
        - application: fullmaktsregister-api
          namespace: team-nof
          cluster: dev-gcp
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
        - application: oh-ressurs-behandler
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: oppgavebehandling-api
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: melosys
          namespace: teammelosys
          cluster: dev-fss
        - application: melosys-q1
          namespace: teammelosys
          cluster: dev-fss
        - application: kabal-innstillinger
          namespace: klage
          cluster: dev-gcp
        - application: kabal-api
          namespace: klage
          cluster: dev-gcp
        - application: etterlevelse-backend
          namespace: teamdatajegerne
          cluster: dev-gcp
        - application: toi-veileder
