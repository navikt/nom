apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: JAVA_OPTS
      value: "-Xms1024m -Xmx8192m"
  envFrom:
    - secret: nom-api-unleash-api-token
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-api.intern.dev.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  startup:
    path: internal/health/startupState
    initialDelay: 15
    periodSeconds: 10
    failureThreshold: 18 # 18*10sec = 3min
  resources:
    requests:
      cpu: 300m
      memory: 1024Mi
    limits:
      memory: 10240Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: nav-dev
  secureLogs:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: "c5752f26-105a-460f-a538-1859273f5057"
          - id: "9e0e2958-df7a-4376-83f3-9bcbec1f2650"
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: dev-gcp
        - application: team-catalog-frackend
          namespace: org
        - application: org-ekstern-proxy
          namespace: org
        - application: azure-token-generator  # For test tokens i dev-gcp laget via https://doc.nais.io/security/auth/azure-ad/usage/#token-generator
          namespace: aura
          cluster: dev-gcp
        - application: team-catalog-backend
          cluster: dev-gcp
          namespace: org
        - application: veilarbveileder
          namespace: pto
          cluster: dev-fss
        - application: saas-proxy
          namespace: teamcrm
          cluster: dev-gcp
        - application: salesforce
          namespace: teamcrm
          cluster: dev-external
        - application: journalforing-frontend-q1
          namespace: isa
          cluster: dev-fss
        - application: journalforing-frontend
          namespace: isa
          cluster: dev-fss
        - application: amt-person-service
          namespace: amt
          cluster: dev-gcp
        - application: remedy-identrutina
          namespace: default
          cluster: dev-fss
        - application: ida
          namespace: traktor
          cluster: prod-fss
        - application: jfr-arena-q2
          namespace: isa
          cluster: dev-fss
        - application: oppgavestyring-backend
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: sparkel-egenansatt
          namespace: tbd
          cluster: dev-gcp
        - application: modiapersonoversikt-api-q0
          namespace: personoversikt
          cluster: dev-fss
        - application: modiapersonoversikt-api-q1
          namespace: personoversikt
          cluster: dev-fss
        - application: modia-robot-api
          namespace: personoversikt
          cluster: dev-fss
        - application: testnav-nom-proxy-trygdeetaten
          namespace: dolly
          cluster: dev-fss
        - application: pdl-fullmakt
          namespace: pdl
          cluster: dev-fss
        - application: oppgavestyring-ressurs-synkronisering
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: abac-test
          namespace: teamabac
          cluster: dev-fss
        - application: fullmaktsregister-web
          namespace: team-nof
          cluster: dev-gcp
        - application: fullmaktsregister-api
          namespace: team-nof
          cluster: dev-gcp
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
        - application: oh-ressurs-behandler
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: oppgavebehandling-api
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: melosys
          namespace: teammelosys
          cluster: dev-fss
        - application: melosys-q1
          namespace: teammelosys
          cluster: dev-fss
        - application: kabal-innstillinger
          namespace: klage
          cluster: dev-gcp
        - application: kabal-api
          namespace: klage
          cluster: dev-gcp
        - application: etterlevelse-backend
          namespace: teamdatajegerne
          cluster: dev-gcp
        - application: toi-veileder
          namespace: toi
          cluster: dev-gcp
        - application: nom-remedy-integrasjon
          namespace: org
          cluster: dev-fss
    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: dev-gcp
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io
        - host: nom-proxy.dev-fss-pub.nais.io
        - host: pdl-api.dev-fss-pub.nais.io
        - host: nom-remedy-integrasjon.dev-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_12
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE
