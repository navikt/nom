          cluster: dev-gcp
        - application: orgenhet-kostnadssted-mapping-web
          namespace: team-nof
          cluster: dev-gcp
        - application: kodeverk-web
          namespace: team-rocket
          cluster: dev-gcp
        - application: spre-styringsinfo
          namespace: tbd
          cluster: dev-gcp
        - application: prim-brukerstyring
          namespace: pim
          cluster: dev-gcp
        - application: prim-brukerstyring-test
          namespace: pim
          cluster: dev-gcp
        - application: idm-kafka-omada-integration
          namespace: idm
          cluster: dev-gcp
        - application: shout-out-api
          namespace: shout-out
          cluster: dev-gcp
        - application: shout-out-sync-service
          namespace: shout-out
          cluster: dev-gcp
        - application: brev-administrasjon-q2
          namespace: isa
          cluster: dev-gcp
        - application: gosys-oppgavebehandling-api
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: gosys-oppgavebehandling-api-q1
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: kabin-api
          namespace: klage
          cluster: dev-gcp
        - application: modia-robot-api
          namespace: personoversikt
          cluster: dev-gcp
        - application: tilgang
          namespace: aap
          cluster: dev-gcp

    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: dev-gcp
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io
        - host: nom-proxy.dev-fss-pub.nais.io
        - host: pdl-api.dev-fss-pub.nais.io
        - host: nom-remedy-integrasjon.dev-fss-pub.nais.io
        - host: dvh.adeo.no
  gcp:
    sqlInstances:
      - type: POSTGRES_12
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
    buckets:
      - name: no-nav-org-dev-missing-orgtilnytninger-storage-bucket
        lifecycleCondition:
          age: 14        
