apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: NIK_BASEURL
      value: https://nav-ident.dev.intern.nav.no
    - name: NIK_CLIENT_ID
      value: dev-gcp.org.nav-ident
    - name: PDL_BASEURL
      value: https://pdl-api.dev-fss-pub.nais.io
    - name: PDL_CLIENT_ID
      value: dev-fss.pdl.pdl-api
    - name: NOM_PROXY_BASEURL
      value: https://nom-proxy.dev-fss-pub.nais.io
    - name: NOM_PROXY_CLIENT_ID
      value: dev-fss.nom.nom-proxy

      # 6f1992.. er fullmaktsregister-web, for å muliggjøre lokalutvikling for team-nøf
    - name: GRAPHQL_PREAUTH_QUERY_PERSON
      value: 92ab93bd-0782-40c0-902b-7758c8878cb4, af2f9386-07cf-4fb9-8612-c4724335a43c, 6f1992f0-f425-4512-b1f6-97a7e840414c
    - name: GRAPHQL_PREAUTH_MUTATION_RESSURS
      value: 744e4092-4215-4e02-87df-a61aaf1b95b5, b54ec20c-ab8a-4e3f-bc34-aa452ddf0f3b, af2f9386-07cf-4fb9-8612-c4724335a43c
    - name: NOM_WRITE_GROUPID
      value: "c5752f26-105a-460f-a538-1859273f5057"
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-api.dev.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  startup:
    path: internal/health/readiness
    initialDelay: 30
    failureThreshold: 30
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: "c5752f26-105a-460f-a538-1859273f5057"
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: dev-gcp
        - application: team-catalog-frackend
          namespace: org
        - application: team-catalog-backend
          cluster: dev-fss
        - application: veilarbveileder
          namespace: pto
          cluster: dev-fss
        - application: salesforce
          namespace: teamcrm
          cluster: dev-external
        - application: journalforing-frontend-q1
          namespace: isa
          cluster: dev-fss
        - application: journalforing-frontend
          namespace: isa
          cluster: dev-fss
        - application: amt-tiltak
          namespace: amt
          cluster: dev-gcp
        - application: remedy-identrutina
          namespace: default
          cluster: dev-fss
        - application: ida
          namespace: traktor
          cluster: prod-fss
        - application: jfr-arena-q2
          namespace: isa
          cluster: dev-fss
        - application: henvendelse-migrering
          namespace: oppgavehandtering
          cluster: dev-fss
        - application: oppgavestyring-backend
          namespace: oppgavehandtering
          cluster: dev-gcp
        - application: sparkel-vilkarsproving
          namespace: tbd
          cluster: dev-fss
        - application: modiapersonoversikt-api-q0
          namespace: personoversikt
          cluster: dev-fss
        - application: modiapersonoversikt-api-q1
          namespace: personoversikt
          cluster: dev-fss
        - application: modia-robot-api
          namespace: personoversikt
          cluster: dev-fss
        - application: testnav-nom-proxy-trygdeetaten
          namespace: dolly
          cluster: dev-fss
        - application: pdl-fullmakt
          namespace: pdl
          cluster: dev-fss
        - application: oppgavestatistikk
          namespace: oppgavehandtering
          cluster: dev-fss
        - application: abac-test
          namespace: teamabac
          cluster: dev-fss
        - application: fullmaktsregister-web
          namespace: team-nof
          cluster: dev-gcp
    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: dev-gcp
      external:
        - host: nom-proxy.dev-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_12
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE
