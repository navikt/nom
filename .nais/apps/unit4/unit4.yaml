apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: nom-unit4
  namespace: org
  labels:
    team: org
spec:
  image: {{image}}
  port: 8080
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      memory: 512Mi
  liveness:
    path: internal/health/liveness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: internal/health/readiness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  azure:
    application:
      enabled: true
  kafka:
    pool: {{kafka-pool}}
  envFrom:
    - secret: nom-unit4-api-credentials
  env:
  {{#each env}}
    - name: {{this.name}}
      value: {{this.value}}
  {{/each}}
  secureLogs:
    enabled: true
  accessPolicy:
    inbound:
      rules:
      {{#each inbound-rules}}
        - application: {{application}}
          namespace: {{namespace}}
          cluster: {{cluster}}
      {{/each}}
    outbound:
      external:
      {{#each outbound-external}}
        - host: {{host}}
      {{/each}}
  azure:
    application:
      enabled: true
      allowAllUsers: true