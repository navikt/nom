apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-unit4
  namespace: org
  labels:
    team: org
spec:
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-unit4.intern.dev.nav.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 512Mi
  liveness:
    path: internal/health/liveness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: internal/health/readiness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  azure:
    application:
      enabled: true
      allowAllUsers: true
  kafka:
    pool: nav-dev
  prometheus:
    enabled: true
    path: internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  envFrom:
    - secret: nom-unit4-api-credentials
    - secret: nom-unit4-unleash-api-token
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: UNIT4_BASEURL
      value: https://agresso.test.local
    - name: UNIT4_EMPLOYEES_PATH
      value: '/agrt01-web-api/v1/employees'
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: NOM_PROXY_BASEURL
      value: https://nom-proxy.dev-fss-pub.nais.io
    - name: NOM_PROXY_CLIENT_ID
      value: dev-fss.nom.nom-proxy
  accessPolicy:
    inbound:
      rules:
        - application: ida
          namespace: traktor
          cluster: prod-fss
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io
        - host: nom-proxy.dev-fss-pub.nais.io