apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: nom-ui2
  namespace: org
  labels:
    team: org
spec:
  image: "{{image}}"
  port: 8080
  azure:
    application:
      enabled: true
      allowAllUsers: true
      singlePageApplication: true
      claims:
        extra:
          - NAVident
          - azp_name
      tenant: trygdeetaten.no
      replyURLs:
        - http://localhost:8080/oauth2/callback
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - "/frackend/*"
  accessPolicy:
    outbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: dev-gcp
        - application: team-catalog-backend
          namespace: org
          cluster: dev-gcp
        - application: nom-paarorende
          namespace: org
          cluster: dev-gcp
        - application: nom-azure
          namespace: org
          cluster: dev-gcp
      external:
        - host: unpkg.com
        - host: nom-remedy-integrasjon.dev-fss-pub.nais.io
        - host: static.hotjar.com
        - host: org-unleash-api.nav.cloud.nais.io
        - host: cdn.nav.no
    inbound:
      rules:
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
  ingresses:
    - https://nom-ui2.intern.dev.nav.no
    - https://nom.ekstern.dev.nav.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      memory: 512Mi
  liveness:
    path: /internal/health/liveness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/health/readiness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  prometheus:
    enabled: true
    path: internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
        - id: elastic
  env:
    - name: NODE_ENV
      value: "production"
    - name: EXPRESS_HOST
      value: "::"
    - name: EXPRESS_PORT
      value: "8080"
    - name: NOM_API_URL
      value: http://nom-api.nom.svc.cluster.local
    - name: NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api/.default
    - name: NOM_AZURE_URL
      value: http://nom-azure.org.svc.cluster.local
    - name: NOM_AZURE_SCOPE
      value: api://dev-gcp.org.nom-azure/.default
    - name: TEAM_CATALOG_API_URL
      value: http://team-catalog-backend.org.svc.cluster.local
    - name: TEAM_CATALOG_SCOPE
      value: api://dev-gcp.org.team-catalog-backend/.default
    - name: NOM_REMEDY_INTEGRASJON_API_URL
      value: https://nom-remedy-integrasjon.dev-fss-pub.nais.io
    - name: NOM_REMEDY_INTEGRASJON_API_SCOPE
      value: api://dev-fss.org.nom-remedy-integrasjon/.default
    - name: PAARORENDE_API_URL
      value: http://nom-paarorende.org.svc.cluster.local
    - name: PAARORENDE_API_SCOPE
      value: api://dev-gcp.org.nom-paarorende/.default
    - name: ENABLE_CDN_BUNDLES
      value: "true"
  envFrom:
    - secret: nom-ui2-unleash-api-token
