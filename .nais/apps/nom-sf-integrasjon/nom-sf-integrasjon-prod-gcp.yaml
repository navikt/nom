apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-sf-integrasjon
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-sf-integrasjon.intern.nav.no
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: OTEL_JAVAAGENT_LOGGING
      value: none
    - name: NOM_API_URL
      value: http://nom-api.nom
    - name: NOM_API_SCOPE
      value: api://prod-gcp.nom.nom-api/.default
  envFrom:
    - secret: nom-sf-integrasjon-unleash-api-token
    - secret: sap-sf-credentials
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  leaderElection: true
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        databases:
          - name: nom-sf-integrasjon-db
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: false
      claims:
        groups:
          - id: "2d91b26c-d412-440b-9122-0fafc594db89" # NOM_ADMIN_GROUP_ID prod
        extra:
          - NAVident
          - azp_name
  accessPolicy:
    inbound:
      rules:
        - application: nom-admin
          namespace: org
          cluster: prod-gcp
        - application: nom-admin-web
          namespace: org
          cluster: prod-gcp
        - application: org-token-tool
          namespace: org
          cluster: prod-gcp
        - application: org-ekstern-proxy
          namespace: org
          cluster: prod-gcp
    outbound:
      rules:
        - application: nav-ident
          namespace: org
          cluster: prod-gcp
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
      external:
        - host: org-unleash-api.nav.cloud.nais.io
        - host: api55.sapsf.eu # SAP SF API server
        - host: cloud-platform-integration-test-02d6jg6h.authentication.eu20.hana.ondemand.com # CPI Oauth server
        - host: cloud-platform-integration-test-02d6jg6h.it-cpi050-rt.cfapps.eu20-002.hana.ondemand.com # Zalaris SF CPI endepunkt server
