# Kopiert fra .nais/apps/nom-sf-integrasjon/nom-sf-integrasjon-dev-gcp.yaml (commit: 34e66b74740f39ba761c00f35f39416e7302e93c)
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-sf-integrasjon-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
  namespace: org
  labels:
    team: org
spec:
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-sf-integrasjon-sf-test.intern.dev.nav.no # Auto-utfylt av 'create_additional_dev_deployment.py'
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev,sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: OTEL_JAVAAGENT_LOGGING
      value: none
    - name: NOM_API_URL
      value: http://nom-api-sf-test.nom # Auto-utfylt av 'create_additional_dev_deployment.py'
    - name: NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api-sf-test/.default # Auto-utfylt av 'create_additional_dev_deployment.py'
  envFrom:
    - secret: nom-sf-integrasjon-unleash-api-token
    - secret: sap-sf-credentials # KONTROLLER MANUELT - Kontroller verdi og tilgang før deploy - 'create_additional_dev_deployment.py': hemmelighet må godkjennes for varianten
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  liveness:
    path: internal/health/liveness
    initialDelay: 15
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  leaderElection: true
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - name: nom-sf-integrasjon-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
        type: POSTGRES_18
        databases:
          - name: nom-sf-integrasjon-sf-test-db # Auto-utfylt av 'create_additional_dev_deployment.py'
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
  azure:
    application: # KONTROLLER MANUELT - Kontroller verdi og tilgang før deploy - 'create_additional_dev_deployment.py': Azure-klient, grupper, redirect og azp må vurderes
      enabled: true
      tenant: trygdeetaten.no
      allowAllUsers: false
      claims:
        groups:
          - id: "9e0e2958-df7a-4376-83f3-9bcbec1f2650" # NOM_ADMIN_GROUP_ID dev
        extra:
          - NAVident
          - azp_name
  accessPolicy:
    inbound:
      rules:
        - application: nom-admin-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
          namespace: org
          cluster: dev-gcp
        - application: nom-admin-web-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
          namespace: org
          cluster: dev-gcp
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
        - application: org-ekstern-proxy
          namespace: org
          cluster: dev-gcp
    outbound:
      rules:
        - application: nav-ident-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
          namespace: org
          cluster: dev-gcp
        - application: nom-api-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
          namespace: nom
          cluster: dev-gcp
      external:
        - host: org-unleash-api.nav.cloud.nais.io
        - host: api55.sapsf.eu # SAP SF API server # KONTROLLER MANUELT - Kontroller verdi og tilgang før deploy - 'create_additional_dev_deployment.py': ekstern host må vurderes
        - host: cloud-platform-integration-test-02d6jg6h.authentication.eu20.hana.ondemand.com # CPI Oauth server # KONTROLLER MANUELT - Kontroller verdi og tilgang før deploy - 'create_additional_dev_deployment.py': ekstern host må vurderes
        - host: cloud-platform-integration-test-02d6jg6h.it-cpi050-rt.cfapps.eu20-002.hana.ondemand.com # Zalaris SF CPI endepunkt server # KONTROLLER MANUELT - Kontroller verdi og tilgang før deploy - 'create_additional_dev_deployment.py': ekstern host må vurderes
