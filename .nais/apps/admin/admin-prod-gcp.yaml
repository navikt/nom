apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-admin
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback.xml'
    - name: JDK_JAVA_OPTIONS
      value: "-Xms2g -Xmx8g"
  envFrom:
    - secret: nom-api-unleash-api-token      
  image: "{{image}}"
  port: 8080
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 15
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
#  startup:
#    path: internal/health/startupState
#    initialDelay: 10
#    periodSeconds: 5
#    failureThreshold: 36 # 36*5sec = 3min
  resources:
    requests:
      cpu: 100m
      memory: 3Gi
    limits:
      memory: 10Gi
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  kafka:
    pool: nav-prod
  secureLogs:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "c5752f26-105a-460f-a538-1859273f5057"
          - id: "9e0e2958-df7a-4376-83f3-9bcbec1f2650"
          - id: "e9cd9267-9baf-4078-abb8-7251c4313d32"
          - id: "42d11885-1e29-4fc4-9eed-1b339c2c8e36"
        extra:
          - azp_name
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: nom-admin-web
          namespace: org
          cluster: prod-gcp
    outbound:
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io