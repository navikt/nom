apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-admin
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: NOM_API_URL
      value: http://nom-api.nom
    - name: NOM_API_SCOPE
      value: api://prod-gcp.nom.nom-api/.default
    - name: LOGGING_CONFIG
      value: 'classpath:logback.xml'
    - name: JDK_JAVA_OPTIONS
      value: "-Xms2g -Xmx8g"
    - name: OTEL_JAVAAGENT_LOGGING  # Bli kvitt Otel loggingen https://opentelemetry.io/docs/zero-code/java/agent/configuration/#java-agent-logging-output
      value: none
  envFrom:
    - secret: nom-admin-unleash-api-token
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-admin-api.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  liveness:
    path: internal/health/liveness
    initialDelay: 15
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
#  startup:
#    path: internal/health/startupState
#    initialDelay: 10
#    periodSeconds: 5
#    failureThreshold: 36 # 36*5sec = 3min
  resources:
    requests:
      cpu: 100m
      memory: 3Gi
    limits:
      memory: 10Gi
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  kafka:
    pool: nav-prod
  secureLogs:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "2d91b26c-d412-440b-9122-0fafc594db89" # nom-admin
          - id: "9aa86116-5e76-4c10-a124-5bdfcd38377e" # 0000-CA-NOM-Nom-Admin-Brukerstotte            
        extra:
          - azp_name
          - NAVident
  gcp:
    buckets:
      - name: no-nav-org-prod-nom-admin-storage-bucket
        lifecycleCondition:
          age: 14
  accessPolicy:
    inbound:
      rules:
        - application: nom-admin-web
          namespace: org
          cluster: prod-gcp
    outbound:
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io