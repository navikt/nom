apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-admin
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: NOM_API_URL
      value: http://nom-api.nom
    - name: NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api/.default
    - name: NOM_REMEDY_INTEGRASJON_BASE_URL
      value: https://nom-remedy-integrasjon.dev-fss-pub.nais.io
    - name: NOM_REMEDY_API_SCOPE
      value: api://dev-fss.org.nom-remedy-integrasjon/.default
    - name: LOGGING_CONFIG
      value: 'classpath:logback.xml'
    - name: JDK_JAVA_OPTIONS
      value: "-XX:+UseZGC -XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=4" # Ref https://nav-it.slack.com/archives/C5KUST8N6/p1714054537557279 og https://nav-it.slack.com/archives/C60FFACN5/p1728888091610999
    - name: OTEL_JAVAAGENT_LOGGING  # Bli kvitt Otel loggingen https://opentelemetry.io/docs/zero-code/java/agent/configuration/#java-agent-logging-output
      value: none
  envFrom:
    - secret: nom-admin-unleash-api-token
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-admin-api.intern.dev.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  liveness:
    path: internal/health/liveness
    initialDelay: 15
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
#  startup:
#    path: internal/health/startupState
#    initialDelay: 10
#    periodSeconds: 5
#    failureThreshold: 36 # 36*5sec = 3min
  resources:
    requests:
      cpu: 100m
      memory: 12Gi
    limits:
      memory: 20Gi
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  kafka:
    pool: nav-dev
  azure:
    application:
      enabled: true
      allowAllUsers: false
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: "9e0e2958-df7a-4376-83f3-9bcbec1f2650" # nom-admin
          - id: "76611d10-876b-4df1-8425-dfe61e6990d1" # 0000-CA-NOM-ADMIN-Lesetilgang
          - id: "a0c8eddc-2435-4fea-a642-58b2b16dd8e0" # 0000-CA-NOM-ADMIN-Utvidet-Lesetilgang
        extra:
          - azp_name
          - NAVident
  gcp:
    buckets:
      - name: no-nav-org-dev-nom-admin-storage-bucket
        lifecycleCondition:
          age: 14
  accessPolicy:
    inbound:
      rules:
        - application: nom-admin-web
          namespace: org
          cluster: dev-gcp
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
        - application: azure-token-generator
          namespace: nais
          cluster: dev-gcp          
    outbound:
      rules:
        - application: nom-api
          namespace: nom
      external:
        - host: nom-remedy-integrasjon.dev-fss-pub.nais.io
        - host: org-unleash-api.nav.cloud.nais.io
