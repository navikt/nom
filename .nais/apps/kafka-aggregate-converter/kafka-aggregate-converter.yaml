apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: kafka-aggregate-converter
  namespace: nom
  labels:
    team: nom
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: {{kafka-pool}}
    streams: true
