apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-admin-web
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: NODE_ENV
      value: "production"
    - name: EXPRESS_HOST
      value: "::"
    - name: EXPRESS_PORT
      value: "8080"
    - name: NOM_ADMIN_API_URL
      value: http://nom-admin.org
    - name: NOM_ADMIN_API_SCOPE
      value: api://prod-gcp.org.nom-admin/.default
    - name: NOM_API_URL
      value: http://nom-api.nom
    - name: NOM_API_SCOPE
      value: api://prod-gcp.nom.nom-api/.default
    - name: NOM_REMEDY_INTEGRASJON_API_URL
      value: https://nom-remedy-integrasjon.prod-fss-pub.nais.io
    - name: NOM_REMEDY_INTEGRASJON_API_SCOPE
      value: api://prod-fss.org.nom-remedy-integrasjon/.default
    - name: NOM_SF_INTEGRASJON_API_URL
      value: http://nom-sf-integrasjon.org
    - name: NOM_SF_INTEGRASJON_API_SCOPE
      value: api://prod-gcp.org.nom-sf-integrasjon/.default
  image: "{{image}}"
  port: 8080
  azure:
    application:
      enabled: true
      allowAllUsers: false
      singlePageApplication: true
      claims:
        groups:
          - id: "2d91b26c-d412-440b-9122-0fafc594db89" # AD gruppe NOM-ADMIN
          - id: "9a608366-69eb-42a9-a787-3469359ce322" # 0000-CA-NOM-ADMIN-Lesetilgang
          - id: "cea028e1-811f-4cd6-aa67-d0130207fd7a" # 0000-CA-NOM-ADMIN-Utvidet-Lesetilgang
        extra:
          - NAVident
          - azp_name
      tenant: nav.no
      replyURLs:
        - http://localhost:8080/oauth2/callback
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - "/frackend/*"
  accessPolicy:
    outbound:
      rules:
        - application: nom-admin
          namespace: org
          cluster: prod-gcp
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
        - application: nom-sf-integrasjon
          namespace: org
          cluster: prod-gcp
      external:
        - host: nom-remedy-integrasjon.prod-fss-pub.nais.io
  ingresses:
    - https://nom-admin.ansatt.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      memory: 512Mi
  liveness:
    path: /internal/health/liveness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/health/readiness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  prometheus:
    enabled: true
    path: internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
        - id: elastic
