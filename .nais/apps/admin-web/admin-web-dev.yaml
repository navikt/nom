apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "nom-admin-web"
  namespace: "org"
  labels:
    team: "org"
spec:
  image: "{{image}}"
  port: 8080
  azure:
    application:
      enabled: true
      allowAllUsers: false
      singlePageApplication: true
      claims:
        groups:
          - id: "9e0e2958-df7a-4376-83f3-9bcbec1f2650" # AD gruppe NOM-ADMIN
          - id: "76611d10-876b-4df1-8425-dfe61e6990d1" # 0000-CA-NOM-ADMIN-Lesetilgang
          - id: "a0c8eddc-2435-4fea-a642-58b2b16dd8e0" # 0000-CA-NOM-ADMIN-Utvidet-Lesetilgang
        extra:
          - NAVident
          - azp_name
      tenant: trygdeetaten.no
      replyURLs:
        - http://localhost:8080/oauth2/callback
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - "/frackend/*"
  accessPolicy:
    outbound:
      rules:
        - application: nom-admin
          namespace: org
          cluster: dev-gcp
        - application: nom-api
          namespace: nom
          cluster: dev-gcp
      external:
        - host: nom-remedy-integrasjon.dev-fss-pub.nais.io
  ingresses:
    - https://nom-admin.ansatt.dev.nav.no
    - https://nom-admin.intern.dev.nav.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      memory: 512Mi
  liveness:
    path: /internal/health/liveness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/health/readiness
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  prometheus:
    enabled: true
    path: internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
        - id: elastic
  env:
    - name: NODE_ENV
      value: "production"
    - name: EXPRESS_HOST
      value: "::"
    - name: EXPRESS_PORT
      value: "8080"
    - name: NOM_ADMIN_API_URL
      value: http://nom-admin.org.svc.cluster.local
    - name: NOM_ADMIN_API_SCOPE
      value: api://dev-gcp.org.nom-admin/.default
    - name: NOM_API_URL
      value: http://nom-api.nom.svc.cluster.local
    - name: NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api/.default
    - name: NOM_REMEDY_INTEGRASJON_API_URL
      value: https://nom-remedy-integrasjon.dev-fss-pub.nais.io
    - name: NOM_REMEDY_INTEGRASJON_API_SCOPE
      value: api://dev-fss.org.nom-remedy-integrasjon/.default

