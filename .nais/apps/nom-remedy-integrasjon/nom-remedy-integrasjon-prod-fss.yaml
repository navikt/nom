apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-remedy-integrasjon
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nom-remedy-integrasjon.prod-fss-pub.nais.io
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: REMEDY_DATASOURCE_URL
      value: jdbc:oracle:thin:@//a01dbfl050.adeo.no:1521/remedyp
    - name: NOM_API_URL
      value: https://nom-api.intern.nav.no/
    - name: NOM_API_SCOPE
      value: api://prod-gcp.nom.nom-api/.default
    - name: NOM_ADMIN_GROUP_ID
      value: 2d91b26c-d412-440b-9122-0fafc594db89
    - name: JDK_JAVA_OPTIONS
      value: "-Xms4g -Xmx12g -Dhttp.proxyHost=webproxy.nais -Dhttps.proxyHost=webproxy.nais -Dhttp.proxyPort=8088 -Dhttps.proxyPort=8088 -Dhttp.nonProxyHosts=localhost|127.0.0.1|10.254.0.1|*.local|*.adeo.no|*.nav.no|*.aetat.no|*.devillo.no|*.oera.no|*.nais.io|*.aivencloud.com|*.intern.dev.nav.no"
  envFrom:
    - secret: nom-remedy-integrasjon-unleash-api-token
    - secret: remedy-db-credentials
  resources:
    requests:
      memory: 4Gi
    limits:
      memory: 20Gi
  replicas:
    min: 1
    max: 1
  webproxy: true
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      claims:
        groups:
          - id: "2d91b26c-d412-440b-9122-0fafc594db89"
        extra:
          - azp_name
          - NAVident
  leaderElection: true
  liveness:
    path: /internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  kafka:
    pool: nav-prod
  prometheus:
    enabled: true
    path: /internal/prometheus
  vault:
    enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: prod-gcp
        - application: org-token-tool
          namespace: org
          cluster: prod-gcp
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
    outbound:
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io
        - host: nom-api.intern.nav.no