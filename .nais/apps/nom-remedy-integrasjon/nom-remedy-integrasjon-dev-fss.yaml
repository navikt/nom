apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-remedy-integrasjon
  namespace: org
  labels:
    team: org
spec:
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-remedy-integrasjon.dev-fss-pub.nais.io
  env:
    - name: REMEDY_DATASOURCE_URL
      value: jdbc:oracle:thin:@//d26dbfl022.test.local:1521/remedy_u2
    - name: NOM_API_URL
      value: https://nom-api.intern.dev.nav.no
    - name: NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api/.default
  envFrom:
    - secret: nom-remedy-integrasjon-unleash-api-token
  vault:
    enabled: true
  webproxy: true
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
      allowAllUsers: true
  liveness:
    path: /internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  kafka:
    pool: nav-dev
  prometheus:
    enabled: true
    path: /internal/prometheus
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: dev-gcp
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
    outbound:
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io
        - host: nom-api.intern.dev.nav.no