apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-remedy-integrasjon
  namespace: org
  labels:
    team: org
spec:
  image: {{image}}
  port: 8080
  env:
    - name: REMEDY_DATASOURCE_URL
      value: jdbc:oracle:thin:@//a01dbfl042.adeo.no:1521/remedy_q2
  liveness:
    path: /internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  prometheus:
    enabled: true
    path: /internal/prometheus