apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-ident
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: GROUP_ID_NOM_WRITE
      value: '1334a91a-c4e0-409e-a497-3c4453869874'
    - name: NAVIDENT_SEQUENCE
      value: '168000'
  envFrom:
    - secret: nav-ident-unleash-api-token
  secureLogs:
    enabled: true
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nav-ident.intern.nav.no
  webproxy: true
  leaderElection: false
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  startup:
    path: internal/health/startupState
    initialDelay: 60
    periodSeconds: 15
    failureThreshold: 20
  liveness:
    path: internal/health/liveness
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  prometheus:
    enabled: true
    path: internal/prometheus
  observability:
    autoInstrument:
      enabled: true
      runtime: java
  gcp:
    sqlInstances:
      - type: POSTGRES_14
        tier: db-custom-1-3840
        databases:
          - name: nav-ident-db
            envVarPrefix: DATABASE
    buckets:
      - name: no-nav-org-prod-nav-ident-storage-bucket   #Bucket names er globally unique across all google.
        lifecycleCondition:
          age: 14

  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          # AD gruppe NOM-WRITE
          - id: "1334a91a-c4e0-409e-a497-3c4453869874"

  kafka:
    pool: nav-prod
  accessPolicy:
    inbound:
      rules:
        - application: nom-api
          namespace: nom
          cluster: prod-gcp
        - application: org-token-tool
          namespace: org
          cluster: prod-gcp
    outbound:
      rules:
        - application: nav-ident-redis
      external:
        - host: pdl-api.prod-fss-pub.nais.io
        - host: teamorg-unleash-api.nav.cloud.nais.io

---

apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  labels:
    team: org
  annotations:
    nais.io/read-only-file-system: "false"
    nais.io/run-as-user: "999"
  name: nav-ident-redis
  namespace: org
spec:
  image: redis:latest
  port: 6379
  replicas: # A single Redis-app doesn't scale
    min: 1
    max: 1 # More replicas doesn't sync
  resources: # you need to monitor the resource usage yourself
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 6379
    protocol: redis
  accessPolicy: # for GCP
    inbound:
      rules:
        - application: nav-ident
