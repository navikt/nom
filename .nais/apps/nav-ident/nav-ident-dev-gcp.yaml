apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-ident
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
    - name: GROUP_ID_NOM_WRITE
      value: 'c5752f26-105a-460f-a538-1859273f5057'
  secureLogs:
    enabled: true
  image: "{{image}}"
  port: 8080
  ingresses:
    - https://nav-ident.intern.dev.nav.no
  webproxy: true
  leaderElection: false
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  startup:
    path: internal/health/startupState
    initialDelay: 60
    periodSeconds: 15
    failureThreshold: 20
  liveness:
    path: internal/health/liveness
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  prometheus:
    enabled: true
    path: internal/prometheus

  gcp:
    sqlInstances:
      - type: POSTGRES_14
        databases:
          - name: nav-ident-db
            envVarPrefix: DATABASE
    buckets:
      - name: no-nav-org-dev-nav-ident-storage-bucket   #Bucket names er globally unique across all google.
        lifecycleCondition:
          age: 14

  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          # AD gruppe NOM-WRITE
          - id: "c5752f26-105a-460f-a538-1859273f5057"

  kafka:
    pool: nav-dev
  accessPolicy:
    inbound:
      rules:
        - application: ida
          namespace: traktor
          cluster: prod-fss
        - application: nom-api
          namespace: nom
          cluster: dev-gcp
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
    outbound:
      rules:
        - application: nav-ident-redis
      external:
        - host: pdl-api.dev-fss-pub.nais.io
---

apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  labels:
    team: org
  annotations:
    nais.io/read-only-file-system: "false"
    nais.io/run-as-user: "999"
  name: nav-ident-redis
  namespace: org
spec:
  image: redis:latest
  port: 6379
  replicas: # A single Redis-app doesn't scale
    min: 1
    max: 1 # More replicas doesn't sync
  resources: # you need to monitor the resource usage yourself
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 6379
    protocol: redis
  accessPolicy: # for GCP
    inbound:
      rules:
        - application: nav-ident
