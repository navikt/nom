apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-rdbms-data
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: LOGGING_CONFIG
      value: 'classpath:logback.xml'
    - name: JDK_JAVA_OPTIONS
      value: "-Xms1g -Xmx2g"
    - name: OTEL_JAVAAGENT_LOGGING  # Bli kvitt Otel loggingen https://opentelemetry.io/docs/zero-code/java/agent/configuration/#java-agent-logging-output
      value: none
  envFrom:
    - secret: nom-rdbms-data-unleash-api-token
  image: "{{image}}"
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: internal/health/liveness
    initialDelay: 15
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  resources:
    limits:
      memory: 3Gi
    requests:
      cpu: 200m
      memory: 1Gi
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_16
        databases:
          - name: nom-rdbms-data-db
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
  accessPolicy:
    outbound:
      external:
        - host: org-unleash-api.nav.cloud.nais.io
