# Kopiert fra .nais/apps/nom-rdbms-data/nom-rdbms-data-dev-gcp.yaml (commit: 34e66b74740f39ba761c00f35f39416e7302e93c)
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-rdbms-data-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev,sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
    - name: LOGGING_CONFIG
      value: 'classpath:logback.xml'
    - name: OTEL_JAVAAGENT_LOGGING  # Bli kvitt Otel loggingen https://opentelemetry.io/docs/zero-code/java/agent/configuration/#java-agent-logging-output
      value: none
  envFrom:
    - secret: nom-rdbms-data-unleash-api-token
  image: "{{image}}"
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: internal/health/liveness
    initialDelay: 15
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  resources:
    limits:
      memory: 3Gi
    requests:
      cpu: 200m
      memory: 1Gi
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - name: nom-rdbms-data-sf-test # Auto-utfylt av 'create_additional_dev_deployment.py'
        type: POSTGRES_18
        databases:
          - name: nom-rdbms-data-sf-test-db # Auto-utfylt av 'create_additional_dev_deployment.py'
            envVarPrefix: DATABASE
        tier: db-custom-1-3840
  accessPolicy:
    outbound:
      external:
        - host: org-unleash-api.nav.cloud.nais.io
