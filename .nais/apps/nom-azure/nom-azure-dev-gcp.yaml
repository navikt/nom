apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-azure
  namespace: org
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
    - name: LOGGING_CONFIG
      value: 'classpath:logback.xml'
    - name: OTEL_JAVAAGENT_LOGGING  # Bli kvitt Otel loggingen https://opentelemetry.io/docs/zero-code/java/agent/configuration/#java-agent-logging-output
      value: none
  envFrom:
    - secret: nom-azure-unleash-api-token
  image: "{{image}}"
  port: 8080
  ingresses: [] # Kan gå via service-discovery
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
  liveness:
    path: internal/health/liveness
    initialDelay: 15
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 15
    periodSeconds: 3
    timeout: 4
    failureThreshold: 2
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      memory: 4Gi
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no
  valkey:
    - instance: nom-azure-cache
      access: readwrite
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui2
          namespace: org
          cluster: dev-gcp
        - application: org-token-tool
          namespace: org
          cluster: dev-gcp
        - application: azure-token-generator
          namespace: nais
          cluster: dev-gcp
        - application: team-catalog-frackend
          namespace: org
          cluster: dev-gcp
        - application: etterlevelse-backend
          namespace: teamdatajegerne
          cluster: dev-gcp
    outbound:
      external:
        - host: teamorg-unleash-api.nav.cloud.nais.io
