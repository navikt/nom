apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-ident
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
  image: {{image}}
  port: 8080
  ingresses:
    - https://nav-ident.intern.nav.no
  webproxy: true
  leaderElection: false
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 50
    liveness:
      path: internal/health/liveness
      initialDelay: 30
      periodSeconds: 5
      failureThreshold: 5
    readiness:
      path: internal/health/readiness
      initialDelay: 30
      periodSeconds: 5
      timeout: 4
      failureThreshold: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  gcp:
    sqlInstances:
      - type: POSTGRES_14
        databases:
          - name: nav-ident-db
            envVarPrefix: DATABASE