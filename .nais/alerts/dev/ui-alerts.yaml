apiVersion: "nais.io/v1"
kind: "Alert"
metadata:
  name: nom-ui
  namespace: nom
  labels:
    team: nom
spec:
  receivers:
    slack:
      channel: '#org-prod-alerts'
  alerts:
    - alert: NOM-UI applikasjon nede
      expr: up{app="nom-ui", job="kubernetes-pods"} == 0
      for: 3m
      description: "{{ $labels.app }} er nede"
      action: "`kubectl describe pod {{ $labels.kubernetes_pod_name }}` for events, og `kubectl logs {{ $labels.kubernetes_pod_name }} -c {{ $labels.app }}` for logger"
    - alert: høy feilrate i logger
      expr: (100 * sum by (log_app, log_namespace) (rate(logd_messages_total{log_app="nom-ui",log_level=~"Warning|Error"}[3m])) / sum by (log_app, log_namespace) (rate(logd_messages_total{log_app="nom-ui"}[3m]))) > 10
      for: 3m
      action: "Sjekk loggene til app {{ $labels.log_app }}, for å se hvorfor det er så mye feil"