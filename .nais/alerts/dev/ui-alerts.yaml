apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-ui-alerts
  namespace: org
  labels:
    team: org
spec:
  groups:
    - name: nom-ui_down
      rules:
        - alert: NOM-UI applikasjon nede
          expr: kube_deployment_status_replicas_unavailable{deployment="nom-ui2"} > 0
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: org
            severity: critical
    - name: nom-ui_high_failrate
      rules:
        - alert: NOM-UI høy feilrate i logger
          expr: (100 * sum by (log_app, log_namespace) (rate(log_messages_total{log_app="nom-ui2",log_team="nom",log_level=~"Warning|Error"}[3m])) / sum by (log_app, log_namespace) (rate(log_messages_total{log_app="nom-ui2",log_team="nom"}[3m]))) > 10
          for: 3m
          annotations:
            action: "Sjekk loggene til app {{ $labels.app }}, for å se hvorfor det er så mye feil"
          labels:
            namespace: org
            severity: warning
