apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-ressurser-alerts
  namespace: nom
  labels:
    team: nom
spec:
  groups:
    - name: nom-ressurser_down
      rules:
        - alert: NOM-RESSURSER applikasjon nede
          expr: 'kube_deployment_status_replicas_unavailable{deployment="nom-ressurser"} > 0'
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: nom
            severity: critical
    - name: nom-ressurser_high_failrate
      rules:
        - alert: NOM-RESSURSER høy feilrate i logger
          expr: (sum by (app, namespace) (rate(log_messages_errors{app="nom-ressurser",namespace="nom"}[6m]))) > 4
          for: 6m
          annotations:
            action: "Sjekk loggene til app {{ $labels.app }}, for å se hvorfor det er så mye feil"
          labels:
            namespace: nom
            severity: warning