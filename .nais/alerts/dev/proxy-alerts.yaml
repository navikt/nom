apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-proxy-alerts
  namespace: nom
  labels:
    team: nom
spec:
  groups:
    - name: nom-proxy_down
      rules:
        - alert: NOM-PROXY applikasjon nede
          expr: 'kube_deployment_status_replicas_unavailable{deployment="nom-proxy"} > 0'
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: nom
            severity: critical
    - name: nom-proxy_high_failrate
      rules:
        - alert: høy feilrate i logger
          expr: (100 * sum by (app, namespace) (rate(log_messages_errors{app="nom-proxy",namespace="nom"}[3m])) / sum by (app, namespace) (rate(log_messages_total{app="nom-proxy",namespace="nom"}[3m]))) > 10
          for: 3m
          annotations:
            action: "Sjekk loggene til app {{ $labels.app }}, for å se hvorfor det er så mye feil"
          labels:
            namespace: nom
            severity: warning