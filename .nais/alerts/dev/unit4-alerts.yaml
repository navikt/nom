apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-unit4-alerts
  namespace: org
  labels:
    team: org
spec:
  groups:
    - name: nom-unit4_down
      rules:
        - alert: NOM-UNIT4 pod nede
          expr: 'kube_deployment_status_replicas_unavailable{deployment="nom-unit4"} > 0'
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: org
            severity: critical
    - name: nom-unit4_high_failrate
      rules:
        - alert: NOM-UNIT4 høy feilrate i logger
          expr: (sum(loki:service:loglevel:count1m{service_name="nom-unit4", detected_level="error"}) / sum(loki:service:loglevel:count1m{service_name="nom-unit4"})) > 0.05
          for: 3m
          annotations:
            action: "{{ $labels.service_name }} har {{ $value | humanizePercentage }} feilmeldinger i loggene i løpet av de siste 10 minuttene."
          labels:
            namespace: org
            severity: warning
    - name: nom-unit4_error_last_5min
      rules:
        - alert: Error log på nom-unit4 de siste 5 min
          expr: 'sum(loki:service:loglevel:count1m{service_name="nom-unit4", detected_level="error"}) > 0'
          for: 1m
          annotations:
            action: "Sjekk logger til {{ $labels.service_name }}."
          labels:
            namespace: org
            severity: notice