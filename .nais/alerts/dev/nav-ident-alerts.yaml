apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nav-ident-alerts
  namespace: org
  labels:
    team: org
spec:
  groups:
    - name: nav-ident_replica_unavailable
      rules:
        - alert: NAV-IDENT replica(s) unavailable over tid
          expr: 'kube_deployment_status_replicas_unavailable{deployment="nav-ident"} > 0'
          for: 6m # Merk litt treg deploy på nav-ident (+2min)
          annotations:
            consequence: (re)Deployment av pod ser ut til å feile
            action: "`kubectl describe pod -l app={{ $labels.deployment }} -n {{ $labels.namespace }}` for events,\n\
        \ og `kubectl logs -l app={{ $labels.deployment }} -n {{ $labels.namespace }}` for logger.\n\
        \ Og/eller sjekke på Kibana: https://logs.adeo.no/app/r/s/k6roX"
            summary: "{{ $labels.deployment }} har deployment replicas som er utilgjengelige"
          labels:
            namespace: org
            severity: warning
    - name: nav-ident_down
      rules:
        - alert: NAV-IDENT nede - Ingen available replica
          expr: 'kube_deployment_status_replicas_available{deployment="nav-ident"} == 0'
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod -l app={{ $labels.deployment }} -n {{ $labels.namespace }}` for events,\n\
        \ og `kubectl logs -l app={{ $labels.deployment }} -n {{ $labels.namespace }}` for logger.\n\
        \ Og/eller sjekke på Kibana: https://logs.adeo.no/app/r/s/k6roX"
            summary: "{{ $labels.deployment }} er nede"
          labels:
            namespace: org
            severity: critical
    - name: nav-ident_errors_logged
      rules: NAV-IDENT logger errors
      expr: sum by (container, pod, namespace) (floor(increase(logback_events_total{app="nav-ident", level="error"} [3m]))) > 0
      for: 3m
      annotations:
        summary: "Det logges på error-nivå i nav-ident"
        action: "Sjekk loggene i Kibana: https://logs.adeo.no/app/r/s/2YlI4 \n\\
        eller Kubernetes: `kubectl logs {{ $labels.pod }} -c {{ $labels.container }} -n {{ $labels.namespace }}`"
      labels:
        namespace: org
        severity: error
    - name: nav-ident_warnings_logged
      rules: NAV-IDENT logger warnings
      expr: sum by (container, pod, namespace) (floor(increase(logback_events_total{app="nav-ident", level="warning"} [3m]))) > 0
      for: 3m
      annotations:
        summary: "Det logges på warning-nivå i nav-ident"
        action: "Sjekk loggene i Kibana: https://logs.adeo.no/app/r/s/2YlI4 \n\\
        eller Kubernetes: `kubectl logs {{ $labels.pod }} -c {{ $labels.container }} -n {{ $labels.namespace }}`"
      labels:
        namespace: org
        severity: warning