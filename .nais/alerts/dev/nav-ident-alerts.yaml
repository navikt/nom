apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nav-ident-alerts
  namespace: org
  labels:
    team: org
spec:
  groups:
    - name: nav-ident_down
      rules:
        - alert: NAV-IDENT pod nede
          expr: 'kube_deployment_status_replicas_unavailable{deployment="nav-ident"} > 0'
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "kubectl describe pod {{ $labels.kubernetes_pod_name }} -n {{ $labels.kubernetes_namespace\
        \ }}` for events, og `kubectl logs {{ $labels.kubernetes_pod_name }} -n {{\
        \ $labels.kubernetes_namespace }}` for logger\n\
        \ Og/eller sjekke på Kibana: https://logs.adeo.no/app/r/s/k6roX"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: org
            severity: critical
    - name: nav-ident_high_failrate
      rules:
        - alert: NAV-IDENT høy feilrate i logger
          expr: (100 * sum by (app, namespace) (rate(log_messages_errors{app="nav-ident",namespace="org"}[3m])) / sum by (app, namespace) (rate(log_messages_total{app="nav-ident",namespace="org"}[3m]))) > 10
          for: 3m
          annotations:
            action: "Sjekk loggene til app {{ $labels.app }}, for å se hvorfor det er så mye feil. https://logs.adeo.no/app/r/s/k6roX"
          labels:
            namespace: org
            severity: warning
