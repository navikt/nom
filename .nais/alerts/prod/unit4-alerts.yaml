apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-unit4-alerts
  namespace: org
  labels:
    team: org
spec:
  groups:
    - name: nom-unit4_down
      rules:
        - alert: NOM-UNIT4 pod nede
          expr: 'kube_deployment_status_replicas_unavailable{deployment="nom-unit4"} > 0'
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: org
            severity: critical
    - name: nom-unit4_high_failrate
      rules:
        - alert: høy feilrate i logger
          expr: (100 * sum by (log_app, log_namespace) (rate(logd_messages_total{log_app="nom-unit4",log_team="org",log_level=~"Warning|Error"}[3m])) / sum by (log_app, log_namespace) (rate(logd_messages_total{log_app="nom-unit4",log_team="org"}[3m]))) > 10
          for: 3m
          annotations:
            action: "Sjekk loggene til app {{ $labels.log_app }}, for å se hvorfor det er så mye feil"
          labels:
            namespace: org
            severity: critical
    - name: nom-unit4_error_last_5min
      rules:
        - alert: Error log på nom-unit4 de siste 5 min
          expr: 'sum(increase(logd_messages_total{log_app="nom-unit4",log_level="Error"}[5m])) > 0'
          for: 1m
          annotations:
            action: "Sjekk logger til {{ $labels.log_app }} her: Link https://logs.adeo.no/app/discover#/?_g=(filters:!(),refreshInterval:(pause:!t,value:0),time:(from:now-1h,to:now))&_a=(columns:!(message,envclass,level,application,host),filters:!(),index:'96e648c0-980a-11e9-830a-e17bbd64b4db',interval:auto,query:(language:kuery,query:'application:%22{{ $labels.log_app }}%22%20and%20level:(Error)%20and%20cluster:%22prod-gcp%22'),sort:!()) "
          labels:
            namespace: org
            severity: notice