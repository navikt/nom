apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-ui-alerts
  namespace: org
  labels:
    team: org
spec:
  groups:
    - name: nom-ui_down
      rules:
        - alert: NOM-UI applikasjon nede
          expr: up{app="nom-ui2", job="kubernetes-pods"} == 0
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: org
            severity: critical
    - name: nom-ui_high_failrate
      rules:
        - alert: NOM-UI høy feilrate i logger
          expr: (sum(loki:service:loglevel:count1m{service_name="nom-ui2", detected_level="error"}) / sum(loki:service:loglevel:count1m{service_name="nom-ui2"})) > 0.05
          for: 3m
          annotations:
            action: "{{ $labels.service_name }} har {{ $value | humanizePercentage }} feilmeldinger i loggene i løpet av de siste 3 minuttene."
          labels:
            namespace: org
            severity: warning