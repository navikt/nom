apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-api-alerts
  namespace: nom
  labels:
    team: nom
spec:
  groups:
    - name: nom-api_down
      rules:
        - alert: NOM-API applikasjon nede
          expr: up{app="nom-api", job="kubernetes-pods"} == 0
          for: 3m
          annotations:
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: nom
            severity: critical
    - name: nom-api_high_failrate
      rules:
        - alert: NOM-API høy feilrate i logger
          expr: (sum(loki:service:loglevel:count1m{service_name="nom-api", detected_level="error"}) / sum(loki:service:loglevel:count1m{service_name="nom-api"})) > 0.05
          for: 10m
          annotations:
            action: "{{ $labels.service_name }} har {{ $value | humanizePercentage }} feilmeldinger i loggene i løpet av de siste 10 minuttene."
          labels:
            namespace: nom
            severity: warning
    - name: high-kafka-lag
      rules:
        - alert: NOM-API høy Kafka lag
          expr: kafka_consumergroup_group_topic_sum_lag{topic=~"org.nom.+-eventsource", group=~"org.nom.+|nom.remedy.+", group!~"org.nom-intern-orgenhet-leder-state_stream_"} > 10
          for: 5m
          annotations:
            action: "Sjekk Kafka lag dashboard: https://grafana.nav.cloud.nais.io/d/edvoasmrt7ri8a/nom-kafka-lag?orgId=1"
          labels:
            namespace: nom
            severity: warning