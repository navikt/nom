apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-api-alerts
  namespace: nom
  labels:
    team: nom
spec:
  groups:
    - name: nom-api_down
      rules:
        - alert: NOM-API applikasjon nede
          expr: up{app="nom-api", job="kubernetes-pods"} == 0
          for: 3m
          annotations:
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: nom
            severity: critical
    - name: nom-api_high_failrate
      rules:
        - alert: NOM-API høy feilrate i logger
          expr: (100 * sum by (app, namespace) (rate(log_messages_errors{app="nom-api",namespace="nom"}[3m])) / sum by (app, namespace) (rate(log_messages_total{app="nom-api",namespace="nom"}[3m]))) > 10
          for: 10m
          annotations:
            action: "Sjekk loggene til app {{ $labels.app }}, for å se hvorfor det er så mye feil"
          labels:
            namespace: nom
            severity: warning