apiVersion: "monitoring.coreos.com/v1"
kind: "PrometheusRule"
metadata:
  name: nom-proxy-alerts
  namespace: nom
  labels:
    team: nom
spec:
  groups:
    - name: nom-proxy_down
      rules:
        - alert: NOM-PROXY applikasjon nede
          expr: up{app="nom-proxy", job="kubernetes-pods"} == 0
          for: 3m
          annotations:
            consequence: Application is unavailable
            action: "`kubectl describe pod {{ $labels.pod }}` for events, og `kubectl logs {{ $labels.pod }} -c {{ $labels.app }}` for logger"
            summary: "{{ $labels.app }} er nede"
          labels:
            namespace: nom
            severity: critical
    - name: nom-proxy_high_failrate
      rules:
        - alert: NOM-PROXY høy feilrate i logger
          expr: (sum(loki:service:loglevel:count1m{service_name="nom-proxy", detected_level="error"}) / sum(loki:service:loglevel:count1m{service_name="nom-proxy"})) > 0.05
          for: 3m
          annotations:
            action: "{{ $labels.service_name }} har {{ $value | humanizePercentage }} feilmeldinger i loggene i løpet av de siste 3 minuttene."
          labels:
            namespace: nom
            severity: warning
