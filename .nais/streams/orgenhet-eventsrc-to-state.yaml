apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: nom-orgenhet-eventsrc-to-state
  namespace: org
  labels:
    team: org
spec:
  image: {{image}}
  env:
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
  port: 8080
  ingresses:
    - https://nom-orgenhet-eventsrc-to-state.dev.intern.nav.no
  replicas:
    min: 0
    max: 0
  liveness:
    path: /internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: {{kafka-pool}}
    streams: true
