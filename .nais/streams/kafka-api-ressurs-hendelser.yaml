apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-kafka-api-ressurs-hendelser
  namespace: org
  labels:
    team: org
spec:
  image: "{{image}}"
  env:
    - name: LOGGING_CONFIG
      value: 'classpath:logback-nais.xml'
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/health/liveness
    periodSeconds: 5
    failureThreshold: 3
  readiness:
    path: /internal/health/readiness
    periodSeconds: 5
    failureThreshold: 3
  startup:
    path: /internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 15
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  kafka:
    pool: {{kafka-pool}}
    streams: true