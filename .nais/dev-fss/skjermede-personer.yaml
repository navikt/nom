apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: skjermede-personer
  namespace: nom
  labels:
    team: nom
spec:
  envFrom:
    - configmap: loginservice-idporten
    - secret: skjermede-personer-secrets
  env:
    - name: ENV
      value: dev
    - name: DB_HOST
      value: b27dbvl009.preprod.local
    - name: DB_NAME
      value: skjermede-personer-dev
    - name: DB_ENV
      value: preprod-fss
    - name: NOM_RESSURSER_API
      value: https://nom-ressurser.nais.preprod.local/api/legacy/ressurs
    - name: FORESPORSEL_API
      value: https://www-q0.nav.no/person/personopplysninger/skjerming-proxy/v1/foresporsel
    - name: AAD_ISSUER_URI
      value: https://login.microsoftonline.com/966ac572-f5b7-4bbe-aa88-c76419c0f851
    - name: AAD_REDIRECT_BASE_URI
      value: https://www-q0.nav.no
    - name: STS_DISCOVERYURL
      value: http://security-token-service.default.svc.nais.local/rest/v1/sts/.well-known/openid-configuration
    - name: STS_AUDIENCE
      value: srvnom-skjermet, srvdolly, srvdolly_u, srvdatavarehus_u-u
    - name: TPS_MQ_QUEUE_MANAGER_URL
      value: mq://b27apvl175.preprod.local:1413/MQ0LSC03
    - name: TPS_MQ_QUEUE_CHANNEL
      value: Q0_SKJERMET
    - name: TPS_MQ_QUEUE_NAME
      value: QA.Q0_412.SFE_ENDRINGSMELDING
    - name: TPS_MQ_QUEUE_USERNAME
      value: srvappserver
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: b27apvl00045.preprod.local:8443,b27apvl00046.preprod.local:8443,b27apvl00047.preprod.local:8443
    - name: SPRING_KAFKA_TOPIC_RESSURS_NAME
      value: aapen-nom-ressurs-v1
    - name: VAULT_USER_SECRET_PATH
      value: serviceuser/dev/srvnom-skjermet
    - name: STACK
      value: preprod
  image: {{image}}
  port: 8080
  ingresses:
    - https://skjermede-personer.nais.preprod.local
    - https://skjermede-personer.dev.adeo.no
  webproxy: true
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  vault:
    enabled: true
    paths:
      - mountPath: /var/run/secrets/nais.io/azuread
        kvPath: /azuread/data/dev/creds/skjermede-personer
      - kvPath: /apikey/appdynamics/dev
        mountPath: /var/run/secrets/nais.io/vault
  leaderElection: true
  prometheus:
    enabled: true
    path: internal/prometheus
