apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-proxy
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: DVH_ENDPOINT_HROG_HIERARKI
      value: https://tdv-u.adeo.no/json/Hr/Nom/NOM_HRORG_HIEARKI_PARAM
  image: {{ image }}
  port: 8080
  webproxy: true
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
  ingresses:
    - https://nom-proxy.dev-fss-pub.nais.io/
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 1000m
      memory: 4096Mi