apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-dvh
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: preprod
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash,k8s,vault
    - name: VAULT_USER_SECRET_PATH
      value: serviceuser/dev/srvnom-dvh
    - name: APP_DVH_BASE_URL
      value: https://tdv-u.adeo.no
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: b27apvl00045.preprod.local:8443,b27apvl00046.preprod.local:8443,b27apvl00047.preprod.local:8443
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-dvh.nais.preprod.local
    - https://nom-dvh.dev.adeo.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  prometheus:
    enabled: true
    path: internal/prometheus
  vault:
    enabled: true
