apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-dvh
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: STACK
      value: preprod
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-dvh.nais.preprod.local
    - https://nom-dvh.dev.adeo.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  vault:
    enabled: true
    paths:
      - kvPath: /apikey/appdynamics/dev
        mountPath: /var/run/secrets/nais.io/vault
  prometheus:
    enabled: true
    path: internal/prometheus
