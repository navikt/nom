apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-ui
  namespace: nom
  labels:
    team: nom
spec:
  image: {{image}}
  port: 8080
  envFrom:
    - secret: nom-ui-secrets
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: AAD_REDIRECT_URL
      value: https://nom-ui.dev.intern.nav.no/oauth2/callback
  ingresses:
    - https://nom-ui.dev.intern.nav.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  prometheus:
    enabled: true
    path: /internal/prometheus
  azure:
    application:
      enabled: true
      replyURLs:
        - http://localhost:8080/oauth2/callback
        - http://localhost:3000/oauth2/callback
        - https://nom-ui.dev.intern.nav.no/oauth2/callback
