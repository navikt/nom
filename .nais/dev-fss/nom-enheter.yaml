apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-enheter
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: PROXY_ENDPOINT_HROG_HIERARKI
      value: https://nom-proxy.dev-fss-pub.nais.io/api/v1/proxy/NOM_HRORG_HIEARKI_PARAM
  envFrom:
    - secret: nom-enheter-secrets
  image: {{ image }}
  port: 8080
  leaderElection: true
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
  ingresses:
    - https://nom-enheter.dev.intern.nav.no
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui
    outbound:
      external:
        - host: nom-proxy.dev-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_11
        databases:
          - name: nom-enheter-dev
            envVarPrefix: DB
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 1000m
      memory: 4096Mi