apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-sandbox-ui
  namespace: nom
  labels:
    team: nom
spec:
  image: {{image}}
  port: 8080
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: NOM_API_CLIENT_ID
      value: api://dev-gcp.nom.nom-sandbox-api
    - name: NOM_API_BASE_URL
      value: http://nom-sandbox-api
  ingresses:
    - https://nom-sbx-ui.dev.intern.nav.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: 1000m
      memory: 320Mi
  prometheus:
    enabled: true
    path: /internal/prometheus
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
      replyURLs:
        - http://localhost:8080/login/oauth2/code/aad
        - http://localhost:3000/login/oauth2/code/aad
        - https://nom-sbx-ui.dev.intern.nav.no/login/oauth2/code/aad
  accessPolicy:
    outbound:
      rules:
        - application: nom-sandbox-api
