apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
    - name: PDL_BASEURL
      value: https://pdl-api.dev-fss-pub.nais.io
    - name: PDL_CLIENT_ID
      value: dev-fss.pdl.pdl-api
    - name: NOM_PROXY_BASEURL
      value: https://nom-proxy.dev-fss-pub.nais.io
    - name: NOM_PROXY_CLIENT_ID
      value: dev-fss.nom.nom-proxy
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-api.dev.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui
        - application: team-catalog-backend
          cluster: dev-fss
        - application: veilarbveileder
          namespace: pto
          cluster: dev-fss
        - application: salesforce
          namespace: teamcrm
          cluster: dev-external
        - application: journalforing-frontend-q1
          namespace: isa
          cluster: dev-fss
        - application: journalforing-frontend
          namespace: isa
          cluster: dev-fss
        - application: amt-tiltak
          namespace: amt
          cluster: dev-gcp
        - application: ida
          namespace: traktor
          cluster: prod-fss
    outbound:
      external:
        - host: nom-proxy.dev-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_12
        databases:
          - name: nom-api-db
            envVarPrefix: DATABASE