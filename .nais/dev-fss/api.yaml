apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-api
  namespace: nom
  labels:
    team: nom
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash,kafka
    - name: DVH_STILLINGER_URL
      value: https://nom-dvh.dev-fss-pub.nais.io
    - name: DVH_AAD_SCOPE
      value: 8db514b3-62dc-4ff8-895a-039067aa4a33
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-api.dev.intern.nav.no
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  prometheus:
    enabled: true
    path: /internal/prometheus
  kafka:
    pool: nav-dev
  azure:
    application:
      enabled: true
      tenant: trygdeetaten.no
  accessPolicy:
    inbound:
      rules:
        - application: nom-ui
    outbound:
      external:
        - host: nom-dvh.dev-fss-pub.nais.io
