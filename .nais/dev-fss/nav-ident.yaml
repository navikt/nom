apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-ident
  namespace: org
  labels:
    team: org
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: log-logstash
  image: {{image}}
  port: 8080
  ingresses:
    - https://nav-ident.dev.intern.nav.no
#  azure:
#    application:
#      enabled: true
#      tennant: trygdeetaten.no
  webproxy: true
  leaderElection: false
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 50
#  liveness:
#    path: internal/isAlive
#    initialDelay: 60
#    periodSeconds: 5
#    failureThreshold: 5
#  readiness:
#    path: internal/isReady
#    initialDelay: 60
#    periodSeconds: 5
#    timeout: 4
#    failureThreshold: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  prometheus:
    enabled: true
    path: internal/prometheus
