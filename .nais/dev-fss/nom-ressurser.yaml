apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nom-ressurser
  namespace: default
  labels:
    team: nom
spec:
  env:
    - name: DB_HOST
      value: b27dbvl009.preprod.local
    - name: DB_NAME
      value: nom-ressurser-dev
    - name: DB_ENV
      value: preprod-fss
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: b27apvl00045.preprod.local:8443,b27apvl00046.preprod.local:8443,b27apvl00047.preprod.local:8443
    - name: SPRING_KAFKA_TOPIC_RESSURS_NAME
      value: aapen-nom-ressurs-v1
    - name: VAULT_USER_SECRET_PATH
      value: serviceuser/dev/srvnom-ressurser
    - name: STACK
      value: preprod
    - name: DVH_ENDPOINT
      value: https://d26apvl00118.test.local:9402/json/Hr/Nom/Nom_Ansatte
  image: {{image}}
  port: 8080
  ingresses:
    - https://nom-ressurser.nais.preprod.local
  webproxy: true
  leaderElection: true
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  liveness:
    path: internal/isAlive
    initialDelay: 60
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: internal/isReady
    initialDelay: 60
    periodSeconds: 5
    timeout: 4
    failureThreshold: 5
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 1000m
      memory: 4096Mi
  vault:
    enabled: true
  prometheus:
    enabled: true
    path: internal/prometheus
