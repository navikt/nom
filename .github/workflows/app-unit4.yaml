name: Build, Deploy Nom-unit4

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/unit4/**'
      - 'libs/contract-nom-dto/**'
      - '.nais/apps/unit4/**'
      - '.github/workflows/app-unit4.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'

env:
  IMAGE: ghcr.io/${{ github.repository }}/nom-unit4:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}/nom-unit4:latest

jobs:
  build_and_push:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :unit4 --also-make --batch-mode
      - name: Build and push Docker container
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          tag: ${{ env.IMAGE }}
          push_image: true
#          pull: true # optional, default false
          dockerfile: Dockerfile
          docker_context: .
#          image_suffix: # optional, default empty
#          cache_from: type=gha # optional, default type=gha
#          cache_to: type=gha,mode=max # optional, default type=gha,mode=max
          build_args: | 
            JAR_PATH=apps/unit4/target/app.jar
          build_secrets: | 
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Deploy to NAIS dev-gcp
        runs-on: ubuntu-latest
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/unit4/unit4.yaml
          VARS: .nais/apps/unit4/unit4-dev-gcp.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
      - name: Deploy to NAIS prod-gcp
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/unit4/unit4.yaml
          VARS: .nais/apps/unit4/unit4-prod-gcp.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}














