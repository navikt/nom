name: Deploy NOM-UI alerts to NAIS
on:
  push:
    branches:
      - main
    paths:
      - '.nais/alerts/dev/ui-alerts.yaml'
      - '.nais/alerts/prod/ui-alerts.yaml'

jobs:
  apply-alerts:
    name: Apply alerts to cluster
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2.3.4

      - name: Deploy to dev
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-fss
          RESOURCE: .nais/alerts/dev/ui-alerts.yaml

      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: .nais/alerts/prod/ui-alerts.yaml
