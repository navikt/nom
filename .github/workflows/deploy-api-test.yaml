name: 'deploy: api'

on:
  push:
#    branches:
#      - 'main'
#      - 'dev/*'
#    paths:
#      - 'apps/api/**'
#      - 'libs/**'
#      - 'libs/nom-state/**'
#      - '.nais/apps/api/api*.yaml'
#      - '.github/*/deploy-api.yaml'
#      - 'apps/pom.xml'
#      - 'pom.xml'
#      - 'Dockerfile_distroless'
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        required: false
        default: false
        description: Skip tests.

jobs:
  deploy-spring-app:
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/deploy-spring-app-test.yaml
    with:
      maven-project: api
      jar-path: apps/api/target/app.jar
      image-suffix: nom-api
      nais-config-file-path-dev: .nais/apps/api/api-dev-gcp.yaml
      nais-config-file-path-prod: .nais/apps/api/api-prod-gcp.yaml
      unleash-vars-file-path: .nais/apps/api/unleash-vars.yaml
      deploy-timeout: 20m
      skip-tests: ${{ github.event.inputs.skip-tests == 'true'}}
      dockerfile: Dockerfile_distroless
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

