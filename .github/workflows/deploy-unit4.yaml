name: 'deploy: nom-unit4'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/unit4/**'
      - 'libs/contract-nom-dto/**'
      - '.nais/apps/unit4/**'
      - '.github/workflows/deploy-unit4.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
      - 'Dockerfile_distroless'
  workflow_dispatch:

jobs:
  deploy-spring-app:
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: unit4
      jar-path: apps/unit4/target/app.jar
      image-suffix: nom-unit4
      nais-config-file-path-dev: .nais/apps/unit4/unit4-dev-gcp.yaml
      nais-config-file-path-prod: .nais/apps/unit4/unit4-prod-gcp.yaml
      unleash-vars-file-path: .nais/apps/unit4/unleash-vars.yaml
      dockerfile: Dockerfile_distroless
    secrets:
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
