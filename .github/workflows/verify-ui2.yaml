name: "verify: ui-2"

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/ui2/webapp/**'
      - '.github/*/verify-ui2.yaml'

jobs:
  verify:
    name: Verify there are no lint or typescript errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui2/webapp
      - name: Install dependencies
        working-directory: apps/ui2/webapp
        run: npm ci

      - name: Cypress run e2e tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/ui2/webapp
          install: false
          browser: chrome
          component: false
          start: npm run dev

      - name: Run ESLint
        working-directory: apps/ui2/webapp
        run: npm run lint

      - name: Run stylelint
        working-directory: apps/ui2/webapp
        run: npm run stylelint

      - name: Check for typescript errors
        working-directory: apps/ui2/webapp
        run: npm run check-types

      - name: Run tests
        working-directory: apps/ui2/webapp
        run: npm run test
