name: "verify: ui-2"

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/ui2/webapp/**'
      - '.github/*/verify-ui2.yaml'

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    name: Verify there are no lint or typescript errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
          cache: 'npm'
          cache-dependency-path: apps/ui2/webapp
      - name: Install dependencies
        working-directory: apps/ui2/webapp
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Cypress run e2e tests
        if: ${{ !cancelled() }}
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/ui2/webapp
          install: false
          browser: chrome
          component: false
          start: npm run dev

      - name: Run ESLint
        if: ${{ !cancelled() }}
        working-directory: apps/ui2/webapp
        run: npm run lint

      - name: Run stylelint
        if: ${{ !cancelled() }}
        working-directory: apps/ui2/webapp
        run: npm run stylelint

      - name: Check for typescript errors
        if: ${{ !cancelled() }}
        working-directory: apps/ui2/webapp
        run: npm run check-types

      - name: Run tests
        if: ${{ !cancelled() }}
        working-directory: apps/ui2/webapp
        run: npm run test
