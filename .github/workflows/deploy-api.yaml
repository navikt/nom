name: 'deploy: api'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
      - 'qa/*'
    paths:
      - 'apps/api/**'
      - 'libs/utils-common/**'
      - '.nais/apps/api/api*.yaml'
      - '.github/*/deploy-api.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  deploy-spring-app:
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: api
      jar-path: apps/api/target/app.jar
      image-suffix: nom-api
      nais-config-file-path-dev: .nais/apps/api/api-dev-gcp.yaml
      nais-config-file-path-prod: .nais/apps/api/api-prod-gcp.yaml
      unleash-vars-file-path: .nais/apps/api/unleash-vars.yaml
      deploy-timeout: 20m
    secrets:
      NAIS_DEPLOY_APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

