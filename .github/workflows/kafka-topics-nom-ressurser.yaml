name: 'update-kafka-topics: nom-ressurser'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.nais/topics/nom-ressurser-topics.yaml'
      - '.github/workflows/kafka-topics-nom-ressurser.yaml'

jobs:
  deploy-kafka-topics-dev:
    name: Deploy to Aiven Dev
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          VAR: kafka-pool=nav-dev
          RESOURCE: .nais/topics/nom-ressurser-topics.yaml

  deploy-kafka-topics-prod:
    name: Deploy to Aiven Prod
    permissions:
      contents: "read"
      id-token: "write"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          VAR: kafka-pool=nav-prod
          RESOURCE: .nais/topics/nom-ressurser-topics.yaml
