name: 'deploy: nom-ressurser'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nom-ressurser/**'
      - '.nais/apps/nom-ressurser/nom-ressurser*.yaml'
      - '.github/workflows/deploy-nom-ressurser.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  build-app-docker:
    name: "Build app and push docker image to GAR"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build java app
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :nom-ressurser --also-make --batch-mode
      - name: Build and push Docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          image_suffix: nom-ressurser
          push_image: true
          dockerfile: Dockerfile
          docker_context: .
          build_args: |
            JAR_PATH=apps/nom-ressurser/target/app.jar
          build_secrets: |
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy-dev:
    name: Deploy to NAIS dev-gcp
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-fss
          RESOURCE: .nais/apps/nom-ressurser/nom-ressurser-dev-fss.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}

  deploy-prod:
    name: Deploy to NAIS prod-gcp
    if: github.ref == 'refs/heads/main'
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: .nais/apps/nom-ressurser/nom-ressurser-prod-fss.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}
