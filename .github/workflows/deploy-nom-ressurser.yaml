name: 'deploy: nom-ressurser'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nom-ressurser/**'
      - '.nais/apps/nom-ressurser/nom-ressurser*.yaml'
      - '.github/workflows/deploy-nom-ressurser.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
      - 'Dockerfile_distroless'
  workflow_dispatch:

jobs:
  deploy-spring-app:
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: nom-ressurser
      jar-path: apps/nom-ressurser/target/app.jar
      image-suffix: nom-ressurser
      nais-config-file-path-dev: .nais/apps/nom-ressurser/nom-ressurser-dev-fss.yaml
      nais-config-file-path-prod: .nais/apps/nom-ressurser/nom-ressurser-prod-fss.yaml
      dev-cluster: dev-fss
      prod-cluster: prod-fss
      dockerfile: Dockerfile_distroless
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
