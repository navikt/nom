name: Release NOM libs (Github Package Registry)

on:
  push:
    branches:
      - 'master'
    paths:
      - 'libs/contract-nom-dto/**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: JDK
        uses: actions/setup-java@v1
        with:
          java-version: 14
      - name: Run Maven release
        run: mvn -B --settings .mvn/settings.xml deploy -Dmaven.wagon.http.pool=false --project:contract-nom-dto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
