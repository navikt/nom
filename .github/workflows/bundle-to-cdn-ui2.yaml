name: 'bundle-to-cdn-ui2'

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps

jobs:
  build-webapp:
    name: "Build webapp"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'

      - name: Install webapp dependencies
        working-directory: apps/ui2/webapp
        run: npm install

      - name: Build webapp
        working-directory: apps/ui2/webapp
        run: npm run build

      - name: Create zip archive
        working-directory: apps/ui2/webapp
        run: zip -r dist.zip ./dist

      - name: Upload static files to CDN
        uses: nais/deploy/actions/cdn-upload/v2@master
        with:
          team: org
          source: ./apps/ui2/webapp/dist.zip
          destination: /nom-ui2/webapp-bundle/${{ github.ref_name }}
          cache_invalidation: 'true'
          no_cache_paths: '/nom-ui2/webapp-bundle/${{ github.ref_name }}/dist.zip'

      - run: echo uploaded file ${{ steps.upload.outputs.uploaded }}