name: 'bundle-to-cdn-ui2'

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps

jobs:
  build-webapp:
    name: "Build webapp"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # ratchet:actions/setup-node@v6.3.0
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'

      - name: Install webapp dependencies
        working-directory: apps/ui2/webapp
        run: npm ci

      - name: Build webapp
        working-directory: apps/ui2/webapp
        run: npm run build

      - name: Create zip archive
        working-directory: apps/ui2/webapp
        run: zip -r dist.zip ./dist

      - name: Upload static files to CDN
        uses: nais/deploy/actions/cdn-upload/v2@5fdd91aaf69bb0d6dd5e5118cdacb639f487b93b # ratchet:nais/deploy/actions/cdn-upload/v2@master
        with:
          team: org
          source: ./apps/ui2/webapp/dist.zip
          destination: /nom-ui2/webapp-bundle/${{ github.ref_name }}
          cache_invalidation: 'true'
          no_cache_paths: 'nom-ui2/webapp-bundle/${{ github.ref_name }}/dist.zip'
      - run: echo uploaded file ${{ steps.upload.outputs.uploaded }}
