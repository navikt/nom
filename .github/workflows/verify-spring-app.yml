on:
  workflow_call:
    inputs:
      maven-project:
        required: true
        type: string

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    name: "Verify app"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
      - name: Run tests
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READER_TOKEN }}
        run: mvn verify --projects :${{ inputs.maven-project }} --also-make --batch-mode