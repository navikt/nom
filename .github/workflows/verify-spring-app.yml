on:
  workflow_call:
    inputs:
      maven-project:
        required: true
        type: string

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    name: "Verify app"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - name: JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # ratchet:actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Run tests
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READER_TOKEN }}
        run: mvn clean verify -U --projects :${{ inputs.maven-project }} --also-make --batch-mode
