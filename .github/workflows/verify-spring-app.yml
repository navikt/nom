on:
  workflow_call:
    inputs:
      maven-project:
        required: true
        type: string

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    name: "Verify app"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Run tests
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READER_TOKEN }}
        run: mvn clean verify -U --projects :${{ inputs.maven-project }} --also-make --batch-mode
