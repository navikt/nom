name: 'deploy: nom-intern-orgtilknytning-state'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/streams/internal/orgtilknytning-state/**'
      - 'libs/contract-nom-dto/**'
      - '.nais/streams/intern-orgtilknytning-state.yaml'
      - '.github/*/deploy-streams-intern-orgtilknytning-state.yaml'
      - 'Dockerfile_distroless'
  workflow_dispatch:

jobs:
  deploy-spring-app:
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: orgtilknytning-state
      jar-path: apps/streams/internal/orgtilknytning-state/target/app.jar
      image-suffix: nom-intern-orgtilknytning-state
      nais-config-file-path-dev: .nais/streams/intern-orgtilknytning-state.yaml
      nais-config-file-path-prod: .nais/streams/intern-orgtilknytning-state.yaml
      additional-nais-vars-dev: ',kafka-pool=nav-dev'
      additional-nais-vars-prod: ',kafka-pool=nav-prod'
      dockerfile: Dockerfile_distroless
    secrets:
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
