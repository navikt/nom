name: 'deploy: nom-testdata'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.nais/apps/nom-testdata/*.yaml'
      - 'apps/nom-testdata/**'
      - 'libs/**'
      - '.github/workflows/deploy-nom-testdata.yaml'
      - '.github/workflows/deploy-spring-app.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
      - 'Dockerfile_chainguard'
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        required: false
        default: false
        description: Skip tests.

concurrency:
  group: deploy-nom-testdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-spring-app:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: nom-testdata
      jar-path: apps/nom-testdata/target/app.jar
      image-suffix: nom-testdata
      nais-config-file-path-dev: .nais/apps/nom-testdata/nom-testdata-dev-gcp.yaml
      unleash-vars-file-path: .nais/apps/nom-testdata/unleash-vars.yaml
      skip-tests: ${{ github.event.inputs.skip-tests == 'true' }}
      skip-prod-deploy: true
      dockerfile: Dockerfile_chainguard
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
