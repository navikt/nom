name: 'test coverage: api'

on:
  workflow_dispatch:

jobs:
  build:
    name: Test coverage mvn
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: maven
      - name: Run tests
        run: mvn clean test
      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          intervals: 100 80 70 60 50 0
          jacoco-csv-file: >
            apps/api/target/site/jacoco/jacoco.csv
          badges-directory: apps/api/target/site/jacoco/badges
      - name: Publish coverage report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/api/target/site/jacoco
          target-folder: test-coverage/apps/api
          commit-message: 'have new test coverage data'
