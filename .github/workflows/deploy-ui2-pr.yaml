name: 'deploy: nom-ui2-pr'

on:
  pull_request:
    branches:
      - 'uideploy/*'
    paths:
      - '*'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps

jobs:
  create-link-to-app:
    permissions:
      pull-requests: "write"
    name: Opprett lenke til testapplikasjon for PR
    runs-on: ubuntu-latest
    steps:
      - name: Opprett lenke til testapplikasjon
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            URL for testing av frontend: https://${{ github.event.pull_request.id }}-nom.ekstern.dev.nav.no
