name: 'update-kafka-topics: org'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.nais/topics/topics-internal.yaml'
      - '.nais/topics/topics-kafka-api.yaml'
      - '.github/workflows/kafka-topics-org.yaml'
  workflow_dispatch:

jobs:
  deploy-kafka-topics-dev:
    name: Deploy to Aiven Dev
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@2f28259ff29ea37915f5a0c9e2a8e3542c429df7 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          VAR: kafka-pool=nav-dev
          RESOURCE: .nais/topics/topics-internal.yaml,.nais/topics/topics-kafka-api.yaml

  deploy-kafka-topics-prod:
    name: Deploy to Aiven Prod
    permissions:
      contents: "read"
      id-token: "write"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@2f28259ff29ea37915f5a0c9e2a8e3542c429df7 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          VAR: kafka-pool=nav-prod
          RESOURCE: .nais/topics/topics-internal.yaml,.nais/topics/topics-kafka-api.yaml
