name: 'deploy: docs and test coverage'

on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs-test-coverage.yaml'
  workflow_dispatch:

jobs:
  build:
    name: Docs and test coverage mvn
    env:
      BADGE_INTERVALS: 80 70 60 50 50 0
    permissions:
      pages: write
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - name: Cache Depdendencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # ratchet:actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # ratchet:actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Generate docs
        run: mvn clean package --projects :docs --also-make --batch-mode -Pbuild-docs
      - name: Generate deploy folder and move docs
        run: |
          mkdir public
          mv docs/target/ekstern/index.html public/index.html
          mv docs/target/intern/index.html public/index-intern.html
          mv docs/target/intern/images public/images

