name: 'deploy: proxy'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/proxy/**'
      - '.nais/apps/proxy/proxy*.yaml'
      - '.github/workflows/deploy-proxy.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
      - 'Dockerfile_distroless'
  workflow_dispatch:

jobs:
  deploy-spring-app:
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: proxy
      jar-path: apps/proxy/target/app.jar
      image-suffix: proxy
      nais-config-file-path-dev: .nais/apps/proxy/proxy-dev-fss.yaml
      nais-config-file-path-prod: .nais/apps/proxy/proxy-prod-fss.yaml
      dev-cluster: dev-fss
      prod-cluster: prod-fss
      dockerfile: Dockerfile
    secrets:
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
