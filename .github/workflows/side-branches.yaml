name: Build Side Branch

on:
  push:
    branches:
      - '**'
      - '!dev/*'
      - '!main'
      - '!docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4
      - name: Cache Depdendencies
        uses: actions/cache@v2.1.6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn clean test --threads=4 --batch-mode -Pintegration-test
  build-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set node environment
        uses: actions/setup-node@v2.1.5
        with:
          node-version: 16
      - uses: actions/cache@v2.1.6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-cache-${{ hashFiles('apps/ui/src/main/webapp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-cache-
      - name: Run npm ci
        run: |
          cd apps/ui/src/main/webapp/
          npm ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN}}
      - name: Run npm build
        run: |
          cd apps/ui/src/main/webapp/
          npm run build