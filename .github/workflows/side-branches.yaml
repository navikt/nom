name: Build Side Branch

on:
  push:
    branches:
      - '**'
      - '!dev/*'
      - '!main'
      - '!docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn clean test --threads=4 --batch-mode -Pintegration-test

  build-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set node environment
        uses: actions/setup-node@v3
        with:
          node-version: 16
      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-cache-${{ hashFiles('apps/ui/src/main/webapp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-cache-
      - name: Install dependencies, frackend
        working-directory: apps/ui2/frackend
        run: |
          npm ci
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        working-directory: apps/ui2/webapp
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: install webapp
        working-directory: apps/ui2/webapp
        run: yarn install
      - name: build webapp
        working-directory: apps/ui2/webapp
        run: CI=false yarn run build
      - name: Run npm ci
        run: |
          cd apps/ui/src/main/webapp/
          npm ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Run npm build
        run: |
          cd apps/ui/src/main/webapp/
          npm run build