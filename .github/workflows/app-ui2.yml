name: nom-ui2

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.github/workflows/app-ui2.yml'
      - 'apps/ui2/**'
      - '.nais/apps/ui2/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/nom-ui2:${{ github.sha }}

defaults:
  run:
    working-directory: apps

jobs:
  build_and_push:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install webapp dependencies
        working-directory: apps/ui2/webapp
        run: npm install

      - name: Add version
        env:
          GITHUB_SHA: ${{ github.sha }}
        working-directory: apps/ui2/webapp
        run: echo "REACT_APP_GIT_VERSION=${GITHUB_SHA}" >> .env

      - name: Build webapp
        working-directory: apps/ui2/webapp
        run: npm run build

      - name: Copy webapp dist into public directory of frackend
        working-directory: apps/ui2/webapp
        run: cp -r dist/ ../frackend/public

      - name: Build and push Docker container
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          tag: ${{ env.IMAGE }}
          push_image: true
          dockerfile: Dockerfile
          docker_context: ./apps/ui2/frackend
          build_args: |
          build_secrets: |
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Deploy to NAIS dev-gcp
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev')
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/ui2/ui2-dev.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
      - name: Deploy to NAIS prod-gcp
        if: github.ref == 'refs/heads/main'
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/ui2/ui2-prod.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

