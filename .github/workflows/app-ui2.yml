name: nom-ui2

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.github/workflows/app-ui2.yml'
      - 'apps/ui2/**'
      - '.nais/apps/ui/ui*'
env:
  IMAGE: ghcr.io/${{ github.repository }}/nom-ui2:${{ github.sha }}

defaults:
  run:
    working-directory: apps

jobs:
  build:
    name: Build and push docker, nom-ui2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - uses: actions/cache@v3
        with:
          path: ./ui2/frackend/node_modules
          key: ${{ runner.os }}-node-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-cache-

      - name: Install dependencies, frackend
        working-directory: apps/ui2/frackend
        run: |
          npm clean-install

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        working-directory: apps/ui2/webapp
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: install webapp
        working-directory: apps/ui2/webapp
        run: yarn install

#      - name: use frackend config
#        working-directory: apps/frontend
#        run: cp ../frackend/.frontendEnv .env

      - name: add version
        env:
          GITHUB_SHA: ${{ github.sha }}
        working-directory: apps/ui2/webapp
        run: echo "REACT_APP_GIT_VERSION=${GITHUB_SHA}" >> .env

      - name: build webapp
        working-directory: apps/ui2/webapp
        run: CI=false yarn run build

      - name: copy build
        working-directory: apps/ui2/webapp
        run: cp -r dist/ ../frackend/public
      #- name: Test
      #  run: |
      #    npm test
      - name: Docker login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker container
        uses: docker/build-push-action@v3
        with:
          context: apps/ui2/frackend
          push: true
          tags: ${{ env.IMAGE }}


  deploy-dev:
    name: Deploy dev-gcp
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/ui/ui.yaml
          VARS: .nais/apps/ui/ui-dev-gcp-vars.yaml

  deploy-prod:
    name: Deploy prod-gcp
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/ui/ui.yaml
          VARS: .nais/apps/ui/ui-prod-gcp-vars.yaml
