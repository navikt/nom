name: 'update-kafka-topics: nav-ident'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.nais/topics/nav-ident-topics.yaml'
      - '.github/workflows/kafka-topics-nav-ident.yaml'

jobs:
  deploy-kafka-topics-dev:
    name: Deploy to Aiven Dev
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          VAR: kafka-pool=nav-dev
          RESOURCE: .nais/topics/nav-ident-topics.yaml

  deploy-kafka-topics-prod:
    name: Deploy to Aiven Prod
    permissions:
      contents: "read"
      id-token: "write"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          VAR: kafka-pool=nav-prod
          RESOURCE: .nais/topics/nav-ident-topics.yaml
