name: "deploy: nav-ident"

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nav-ident/**'
      - 'libs/utils-common/**'
      - '.nais/apps/nav-ident/nav-ident*.yaml'
      - '.github/*/deploy-nav-ident.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  deploy-spring-app:
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: nav-ident
      jar-path: apps/nav-ident/target/app.jar
      image-suffix: nav-ident
      nais-config-file-path-dev: .nais/apps/nav-ident/nav-ident-dev-gcp.yaml
      nais-config-file-path-prod: .nais/apps/nav-ident/nav-ident-prod-gcp.yaml
    secrets:
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
