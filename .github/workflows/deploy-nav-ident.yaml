name: "deploy: nav-ident"

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nav-ident/**'
      - 'libs/utils-common/**'
      - '.nais/apps/nav-ident/nav-ident*.yaml'
      - '.github/*/deploy-nav-ident.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'

env:
  IMAGE: ghcr.io/${{ github.repository }}/nav-ident:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}/nav-ident:latest

jobs:
  build-app-docker:
    name: "Build app and push docker image to ghcr"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build java app
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :nav-ident --also-make --batch-mode
      - name: Build and push Docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          tag: ${{ env.IMAGE }}
          push_image: true
          dockerfile: Dockerfile
          docker_context: .
          build_args: |
            JAR_PATH=apps/nav-ident/target/app.jar
          build_secrets: |
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy-dev:
    name: Deploy to NAIS dev-gcp
    uses: nais/deploy/actions/deploy@v1
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/nav-ident/nav-ident-dev-gcp.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

  deploy-prod:
    name: Deploy to NAIS prod-gcp
    if: github.ref == 'refs/heads/main'
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/nav-ident/nav-ident-prod-gcp.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}