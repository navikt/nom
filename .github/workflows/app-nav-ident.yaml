name: Build n Deploy NAV-IDENT

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nav-ident/**'
      - 'libs/utils-common/**'
      - '.nais/apps/nav-ident/nav-ident*.yaml'
      - '.github/*/app-nav-ident.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'

env:
  IMAGE: ghcr.io/${{ github.repository }}/nav-ident:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}/nav-ident:latest

jobs:
  build-jar-docker:
    name: build-jar-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :nav-ident --also-make --batch-mode
      - name: Docker login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker container
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }},${{ env.IMAGE_LATEST }}
          build-args: JAR_PATH=apps/nav-ident/target/app.jar

  deploy-dev:
    name: Deploy to NAIS dev-gcp
    needs: build-jar-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/nav-ident/nav-ident-dev-gcp.yaml

  deploy-prod:
    name: Deploy to NAIS prod-gcp
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/nav-ident/nav-ident-prod-gcp.yaml
