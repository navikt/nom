name: Build, Deploy nom-ressurser

on:
  push:
    branches:
      - master
      - 'dev/*'
    paths-ignore:
      - 'apps/skjermede-personer/**'
      - 'apps/skjermede-personer-pip/**'
      - '.nais/*/skjermede-personer.yaml'
      - '.nais/*/skjermede-personer-pip*'
      - '.github/**/skjermede-personer.yaml'
      - '.github/**/skjermede-personer-pip*'

env:
  IMAGE: docker.pkg.github.com/${{ github.repository }}/nom-ressurser:${{ github.sha }}
  IMAGE_LATEST: docker.pkg.github.com/${{ github.repository }}/nom-ressurser:latest

jobs:
  build-jar-docker:
    name: build-jar-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Cache Depdendencies
        uses: actions/cache@v1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v1
        with:
          java-version: 11
      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :nom-ressurser --also-make
      - name: Build and publish Docker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build -t ${IMAGE} -t ${IMAGE_LATEST} --build-arg JAR_PATH=apps/nom-ressurser/target/app.jar .
          docker login docker.pkg.github.com -u ${GITHUB_REPOSITORY} -p ${GITHUB_TOKEN}
          docker push ${IMAGE}
          docker push ${IMAGE_LATEST}

  deploy-dev:
    name: Deploy to NAIS dev-fss
    needs: build-jar-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-fss
          RESOURCE: .nais/dev-fss/nom-ressurser.yaml

  deploy-prod:
    name: Deploy to NAIS prod-fss
    needs: build-jar-docker
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: .nais/prod-fss/nom-ressurser.yaml
