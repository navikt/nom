name: 'verify: nom-testdata'

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/nom-testdata/**'
      - 'libs/**'
      - '.github/workflows/verify-nom-testdata.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/verify-spring-app.yml
    with:
      maven-project: nom-testdata
