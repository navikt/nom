name: 'deploy: nom-ui2'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.nais/apps/ui2/ui2-sf-test-dev.yaml'
      - '.github/workflows/deploy-ui2.yaml'
      - 'apps/ui2/**'
      - '.nais/apps/ui2/**'
  workflow_dispatch:
    inputs:
      minify:
        description: "Enable minification?"
        type: boolean
        required: true
        default: true


defaults:
  run:
    working-directory: apps

jobs:
  build-app-docker:
    name: "Build app and push docker image to GAR"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'

      - name: Install webapp dependencies
        working-directory: apps/ui2/webapp
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build webapp and decide minification yes/no
        working-directory: apps/ui2/webapp
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" || "${{ github.event.inputs.minify }}" == 'false' ]]; then
            echo "Webapp build: Skipping minification";
            npm run build -- --minify=false;
          else
            echo "Webapp build: With minification";
            npm run build;
          fi

      - name: Install graphiql (playground) dependencies
        working-directory: apps/ui2/gql-playground
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build graphiql (playground)
        working-directory: apps/ui2/gql-playground
        run: npm run build

      - name: Copy webapp dist into public directory of frackend
        working-directory: apps/ui2/webapp
        run: cp -r dist/ ../frackend/public

      - name: Copy graphiql (playground) dist into graphiql bundle directory of frackend
        working-directory: apps/ui2/gql-playground
        run: cp -r dist/ ../frackend/graphiqlbundle

      - name: Install frackend dependencies
        working-directory: apps/ui2/frackend
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build frackend
        working-directory: apps/ui2/frackend
        run: npm run build

      - name: Build and push Docker image
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: org
          image_suffix: nom-ui2
          docker_context: apps/ui2/frackend
          dockerfile: apps/ui2/frackend/Dockerfile
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy-dev:
    name: Deploy dev-gcp
    permissions:
      contents: "read"
      id-token: "write"
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@420caaa3a59af9aca910e372e5b7a85f3c7cd553 # ratchet:nais/deploy/actions/deploy@v3
        if: ${{ inputs.unleash-vars-file-path != 'skip' }}
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/unleash/unleash-token.yaml
          VAR: env=development
          VARS: .nais/apps/ui2/unleash-vars.yaml
      - uses: nais/deploy/actions/deploy@420caaa3a59af9aca910e372e5b7a85f3c7cd553 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/ui2/ui2-dev.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}

  prepare-dev-variants:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      deployments: ${{ steps.variants.outputs.deployments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - id: variants
        env:
          # Enable only after variant manifests and matching backends are ready:
          # ADDITIONAL_DEV_DEPLOYMENTS: '[{"suffix":"q0","manifest":".nais/apps/ui2/ui2-q0-dev.yaml"},{"suffix":"sf-test","manifest":".nais/apps/ui2/ui2-sf-test-dev.yaml"}]'
          ADDITIONAL_DEV_DEPLOYMENTS: '[{"suffix":"sf-test","manifest":".nais/apps/ui2/ui2-sf-test-dev.yaml"}]'
        run: python3 .github/workflows/scripts/prepare_dev_variants.py

  deploy-additional-dev:
    if: ${{ needs.prepare-dev-variants.outputs.deployments != '[]' }}
    name: Deploy nom-ui2-${{ matrix.deployment.suffix }} to dev-gcp
    permissions:
      contents: read
      id-token: write
    needs: [build-app-docker, prepare-dev-variants]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(needs.prepare-dev-variants.outputs.deployments) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Validate variant manifest
        working-directory: .
        env:
          BASE_MANIFEST: .nais/apps/ui2/ui2-dev.yaml
          VARIANT_MANIFEST: ${{ matrix.deployment.manifest }}
          SUFFIX: ${{ matrix.deployment.suffix }}
        run: python3 .github/workflows/scripts/validate_web_variant.py
      - uses: nais/deploy/actions/deploy@420caaa3a59af9aca910e372e5b7a85f3c7cd553 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ matrix.deployment.manifest }}
          VAR: image=${{ needs.build-app-docker.outputs.image }}

  deploy-prod:
    name: Deploy prod-gcp
    permissions:
      contents: "read"
      id-token: "write"
    needs: build-app-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@420caaa3a59af9aca910e372e5b7a85f3c7cd553 # ratchet:nais/deploy/actions/deploy@v3
        if: ${{ inputs.unleash-vars-file-path != 'skip' }}
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/unleash/unleash-token.yaml
          VAR: env=production
          VARS: .nais/apps/ui2/unleash-vars.yaml
      - uses: nais/deploy/actions/deploy@420caaa3a59af9aca910e372e5b7a85f3c7cd553 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/ui2/ui2-prod.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}
