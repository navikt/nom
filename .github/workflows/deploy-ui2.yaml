name: 'deploy: nom-ui2'

on:
  push:
    branches:
      - '*'
    paths:
      - '.github/workflows/deploy-ui2.yaml'
      - 'apps/ui2/**'
      - '.nais/apps/ui2/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps

jobs:
  build-app-docker:
    name: "Build app and push docker image to GAR"
    permissions:
      contents: "read"
      id-token: "write"
    if: startsWith(github.ref, 'refs/heads/uideploy') || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'

      - name: Install webapp dependencies
        working-directory: apps/ui2/webapp
        run: npm install

      - name: Build webapp
        working-directory: apps/ui2/webapp
        run: npm run build

      - name: Copy webapp dist into public directory of frackend
        working-directory: apps/ui2/webapp
        run: cp -r dist/ ../frackend/public

      - name: Install frackend dependencies
        working-directory: apps/ui2/frackend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build frackend
        working-directory: apps/ui2/frackend
        run: npm run build

      - name: Build and push Docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: org
          image_suffix: nom-ui2
          docker_context: apps/ui2/frackend
          dockerfile: apps/ui2/frackend/Dockerfile
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy-dev-branch-ingress:
    name: Deploy dev-gcp
    permissions:
      contents: "read"
      id-token: "write"
    needs: build-app-docker
    if: startsWith(github.ref, 'refs/heads/uideploy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/ui2/ui2-dev.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}};ingresses=["https://${{github.event.number}}-nom-ui2.ekstern.dev.nav.no"]

  deploy-dev:
    name: Deploy dev-gcp
    permissions:
      contents: "read"
      id-token: "write"
    needs: build-app-docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/ui2/ui2-dev.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}};ingresses=["https://nom-ui2.intern.dev.nav.no","https://nom.ekstern.dev.nav.no"]

  deploy-prod:
    name: Deploy prod-gcp
    permissions:
      contents: "read"
      id-token: "write"
    needs: build-app-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/ui2/ui2-prod.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}
