name: Deploy alerts to NAIS
on:
  push:
    branches:
      - master
    paths:
      - '.nais/prod-fss/nom-ressurser-alerts.yaml'

jobs:
  apply-alerts:
    name: Apply alerts to cluster
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2.3.4
      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: .nais/prod-fss/nom-ressurser-alerts.yaml
