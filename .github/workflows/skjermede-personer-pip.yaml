name: Build, Deploy skjermede-personer-pip

on:
  push:
    branches:
      - master
      - 'dev/*'
    paths-ignore:
      - '.github/**/delete_old_packages.yaml'
      - 'apps/nom-enheter/**'
      - 'apps/nom-proxy/**'
      - 'apps/nom-ressurser/**'
      - 'apps/skjermede-personer/**'
      - '.nais/*/nom-enheter.yaml'
      - '.nais/*/nom-proxy.yaml'
      - '.nais/*/nom-ressurser.yaml'
      - '.nais/*/skjermede-personer.yaml'
      - '.github/**/nom-enheter.yaml'
      - '.github/**/nom-proxy.yaml'
      - '.github/**/nom-ressurser.yaml'
      - '.github/**/skjermede-personer.yaml'

env:
  IMAGE: docker.pkg.github.com/${{ github.repository }}/skjermede-personer-pip:${{ github.sha }}
  IMAGE_LATEST: docker.pkg.github.com/${{ github.repository }}/skjermede-personer-pip:latest

jobs:
  build-jar-docker:
    name: build-jar-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Cache Depdendencies
        uses: actions/cache@v1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v1
        with:
          java-version: 14

      - run: docker-compose pull

      # In this step, this action saves a list of existing images,
      # the cache is created without them in the post run.
      # It also restores the cache if it exists.
      - uses: satackey/action-docker-layer-caching@v0.0.8
        # Ignore the failure of a step and avoid terminating the job.
        continue-on-error: true
        with:
          key: nom-docker-cache-{hash}
          restore-keys: nom-docker-cache-

      - run: docker-compose up --build -d

      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean verify --projects :skjermede-personer-pip --also-make -Pintegration-test



      - name: Build and publish Docker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build -t ${IMAGE} -t ${IMAGE_LATEST} --build-arg JAR_PATH=apps/skjermede-personer-pip/target/app.jar .
          docker login docker.pkg.github.com -u ${GITHUB_REPOSITORY} -p ${GITHUB_TOKEN}
          docker push ${IMAGE}
          docker push ${IMAGE_LATEST}

  deploy-dev:
    name: Deploy to NAIS dev-fss
    needs: build-jar-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-fss
          RESOURCE: .nais/dev-fss/skjermede-personer-pip.yaml

  deploy-prod:
    name: Deploy to NAIS prod-fss
    needs: build-jar-docker
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: .nais/prod-fss/skjermede-personer-pip.yaml

  security:
    runs-on: ubuntu-latest
    needs: build-jar-docker
    steps:
      - name: Run Snyk to check Docker image for vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEVERITY_TRESHOLD: high
        run: |
          sudo npm install -g snyk
          snyk auth ${SNYK_TOKEN}
          docker login docker.pkg.github.com -u ${GITHUB_REPOSITORY} -p ${GITHUB_TOKEN}
          snyk monitor --severity-threshold=${SEVERITY_TRESHOLD} --org=org-6kx --docker ${IMAGE_LATEST}
        continue-on-error: false