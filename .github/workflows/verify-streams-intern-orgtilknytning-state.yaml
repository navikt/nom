    branches:
      - 'main'
    paths:
      - 'apps/streams/internal/orgtilknytning-state/**'
      - 'libs/contract-nom-dto/**'
      - '.github/*/verify-streams-intern-orgtilknytning-state.yaml'
      - 'apps/streams/internal/pom.xml'
