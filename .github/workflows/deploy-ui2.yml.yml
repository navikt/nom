name: 'deploy: nom-ui2'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.github/workflows/deploy-ui2.yml'
      - 'apps/ui2/**'
      - '.nais/apps/ui2/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/nom-ui2:${{ github.sha }}

defaults:
  run:
    working-directory: apps

jobs:
  build-app-docker:
    name: "Build app and push docker image to ghcr"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install webapp dependencies
        working-directory: apps/ui2/webapp
        run: npm install

      - name: Add version
        env:
          GITHUB_SHA: ${{ github.sha }}
        working-directory: apps/ui2/webapp
        run: echo "REACT_APP_GIT_VERSION=${GITHUB_SHA}" >> .env

      - name: Build webapp
        working-directory: apps/ui2/webapp
        run: npm run build

      - name: Copy webapp dist into public directory of frackend
        working-directory: apps/ui2/webapp
        run: cp -r dist/ ../frackend/public

      - name: Login to GitHub Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: apps/ui2/frackend
          push: true
          tags: ${{ env.IMAGE }}

  deploy-dev:
    name: Deploy dev-gcp
    needs: build-app-docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/ui2/ui2-dev.yaml

  deploy-prod:
    name: Deploy prod-gcp
    needs: build-app-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/ui2/ui2-prod.yaml
