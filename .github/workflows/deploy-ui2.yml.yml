name: 'deploy: nom-ui2'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.github/workflows/deploy-ui2.yml'
      - 'apps/ui2/**'
      - '.nais/apps/ui2/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps

jobs:
  build-app-docker:
    name: "Build app and push docker image to GAR"
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install webapp dependencies
        working-directory: apps/ui2/webapp
        run: npm install

      - name: Add version
        env:
          GITHUB_SHA: ${{ github.sha }}
        working-directory: apps/ui2/webapp
        run: echo "REACT_APP_GIT_VERSION=${GITHUB_SHA}" >> .env

      - name: Build webapp
        working-directory: apps/ui2/webapp
        run: npm run build

      - name: Copy webapp dist into public directory of frackend
        working-directory: apps/ui2/webapp
        run: cp -r dist/ ../frackend/public

      - name: Build and push Docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          image_suffix: nom-ui2
          docker_context: apps/ui2/frackend
          dockerfile: apps/ui2/frackend/Dockerfile
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy-dev:
    name: Deploy dev-gcp
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/apps/ui2/ui2-dev.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}

  deploy-prod:
    name: Deploy prod-gcp
    needs: build-app-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/apps/ui2/ui2-prod.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}
