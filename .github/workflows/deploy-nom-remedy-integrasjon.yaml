name: 'deploy: nom-remedy-integrasjon'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nom-remedy-integrasjon/**'
      - 'libs/**'
      - '.nais/apps/nom-remedy-integrasjon/nom-remedy-integrasjon*.yaml'
      - '.github/workflows/deploy-nom-remedy-integrasjon.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'
      - 'Dockerfile_chainguard'
  workflow_dispatch:
    inputs:
      skip-tests:
        type: boolean
        required: false
        default: false
        description: Skip tests.

jobs:
  deploy-spring-app:
    permissions:
      contents: "read"
      id-token: "write"
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: nom-remedy-integrasjon
      jar-path: apps/nom-remedy-integrasjon/target/app.jar
      image-suffix: nom-remedy-integrasjon
      nais-config-file-path-dev: .nais/apps/nom-remedy-integrasjon/nom-remedy-integrasjon-dev-fss.yaml
      nais-config-file-path-prod: .nais/apps/nom-remedy-integrasjon/nom-remedy-integrasjon-prod-fss.yaml
      unleash-vars-file-path: .nais/apps/nom-remedy-integrasjon/unleash-vars.yaml
      dev-cluster: dev-fss
      prod-cluster: prod-fss
      skip-tests: ${{ github.event.inputs.skip-tests == 'true'}}
      dockerfile: Dockerfile_chainguard
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
