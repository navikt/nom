name: 'verify: nom-kafka-api-ressurs-hendelser'

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/streams/kafka-api/api-ressurs-hendelser/**'
      - 'libs/contract-nom-dto/**'
      - '.github/*/verify-streams-kafka-api-ressurs-hendelser.yaml'
      - 'apps/streams/kafka-api/pom.xml'
      - 'apps/streams/pom.xml'
      - 'apps/pom.xml'
      - 'pom.xml'

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/verify-spring-app.yml
    with:
      maven-project: api-ressurs-hendelser
