name: 'deploy: nom-intern-orgenhet-state'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/streams/internal/orgenhet-state/**'
      - 'libs/contract-nom-dto/**'
      - '.nais/streams/intern-orgenhet-state.yaml'
      - '.github/*/deploy-streams-intern-orgenhet-state.yaml'
  workflow_dispatch:

jobs:
  deploy-spring-app:
    uses: ./.github/workflows/deploy-spring-app.yaml
    with:
      maven-project: orgenhet-state
      jar-path: apps/streams/internal/orgenhet-state/target/app.jar
      image-suffix: nom-intern-orgenhet-state
      nais-config-file-path-dev: .nais/streams/intern-orgenhet-state.yaml
      nais-config-file-path-prod: .nais/streams/intern-orgenhet-state.yaml
      additional-nais-vars-dev: ',kafka-pool=nav-dev'
      additional-nais-vars-prod: ',kafka-pool=nav-prod'
    secrets:
      NAIS_DEPLOY_APIKEY: ${{ secrets.NAIS_DEPLOY_ORG_APIKEY }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
