name: "verify: admin-web"

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/admin-web/webapp/**'
      - '.github/*/verify-admin-web.yaml'

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    name: Verify there are no lint or typescript errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
          cache-dependency-path: apps/admin-web/webapp
      - name: Install dependencies
        working-directory: apps/admin-web/webapp
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}


      - name: Run ESLint
        if: ${{ !cancelled() }}
        working-directory: apps/admin-web/webapp
        run: npm run lint

      - name: Run stylelint
        if: ${{ !cancelled() }}
        working-directory: apps/admin-web/webapp
        run: npm run stylelint

      - name: Check for typescript errors
        if: ${{ !cancelled() }}
        working-directory: apps/admin-web/webapp
        run: npm run check-types
