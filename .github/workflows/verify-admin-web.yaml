name: "verify: admin-web"

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/admin-web/webapp/**'
      - '.github/*/verify-admin-web.yaml'

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: write
    name: Verify there are no lint or typescript errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
          cache-dependency-path: apps/admin-web/webapp
      - name: Install dependencies
        working-directory: apps/admin-web/webapp
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}


      - name: Run ESLint
        if: ${{ !cancelled() }}
        working-directory: apps/admin-web/webapp
        run: npm run lint

      - name: Run stylelint
        if: ${{ !cancelled() }}
        working-directory: apps/admin-web/webapp
        run: npm run stylelint

      - name: Check for typescript errors
        if: ${{ !cancelled() }}
        working-directory: apps/admin-web/webapp
        run: npm run check-types
