name: Build, Deploy nom-ressurser

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nom-ressurser/**'
      - '.nais/apps/nom-ressurser/nom-ressurser*.yaml'
      - '.github/workflows/app-nom-ressurser.yml'

env:
  IMAGE: ghcr.io/${{ github.repository }}/nom-ressurser:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}/nom-ressurser:latest

jobs:
  build-jar-docker:
    name: build-jar-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :nom-ressurser --also-make --batch-mode
      - name: Docker login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker container
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }},${{ env.IMAGE_LATEST }}
          build-args: JAR_PATH=apps/nav-ident/target/app.jar

  deploy-dev:
    name: Deploy to NAIS dev-fss
    needs: build-jar-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-fss
          RESOURCE: .nais/apps/nom-ressurser/nom-ressurser-dev-fss.yaml

  deploy-prod:
    name: Deploy to NAIS prod-fss
    needs: build-jar-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: .nais/apps/nom-ressurser/nom-ressurser-prod-fss.yaml
