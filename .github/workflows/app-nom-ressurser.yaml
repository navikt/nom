name: Build, Deploy nom-ressurser

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - 'apps/nom-ressurser/**'
      - '.nais/apps/nom-ressurser/nom-ressurser*.yaml'
      - '.github/workflows/app-nom-ressurser.yaml'
      - 'apps/pom.xml'
      - 'pom.xml'

env:
  IMAGE: ghcr.io/${{ github.repository }}/nom-ressurser:${{ github.sha }}
  IMAGE_LATEST: ghcr.io/${{ github.repository }}/nom-ressurser:latest

jobs:
  build_and_push:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :nom-ressurser --also-make --batch-mode
      - name: Build and push Docker container
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          tag: ${{ env.IMAGE }}
          push_image: true
          dockerfile: Dockerfile
          docker_context: .
          build_args: |
            JAR_PATH=apps/nom-ressurser/target/app.jar
          build_secrets: |
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Deploy to NAIS dev-gcp
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-fss
          RESOURCE: .nais/apps/nom-ressurser/nom-ressurser-dev-fss.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
      - name: Deploy to NAIS prod-gcp
        if: github.ref == 'refs/heads/main'
        uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: .nais/apps/nom-ressurser/nom-ressurser-prod-fss.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
