on:
  workflow_call:
    inputs:
      maven-project:
        required: true
        type: string
      jar-path:
        required: true
        type: string
      image-suffix:
        required: true
        type: string
      nais-config-file-path-dev:
        required: true
        type: string
      nais-config-file-path-prod:
        required: true
        type: string
      additional-dev-deployments:
        required: false
        type: string
        default: '[]'
        description: 'JSON array of {"suffix":"q0","manifest":".nais/apps/api/api-q0-dev-gcp.yaml"} entries'
      deploy-timeout:
        required: false
        type: string
        default: 10m
      dev-cluster:
        type: string
        required: false
        default: dev-gcp
      prod-cluster:
        type: string
        required: false
        default: prod-gcp
      unleash-vars-file-path:
        type: string
        required: false
        default: skip
      additional-nais-vars-dev:
        type: string
        required: false
        description: Additional template variables besides image var. Must adhere to pattern ',var1=value,var2=value'
        default: ''
      additional-nais-vars-prod:
        type: string
        required: false
        description: Additional template variables besides image var. Must adhere to pattern ',var1=value,var2=value'
        default: ''
      skip-tests:
        type: boolean
        required: false
        default: false
        description: Skip tests. This makes build faster.
      skip-prod-deploy:
        type: boolean
        required: false
        default: false
        description: Skip deployment to production.
      dockerfile:
        type: string
        required: false
        default: Dockerfile_chainguard
        description: Dockerfile to use for building the docker image
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: true

jobs:
  build-app-docker:
    permissions:
      contents: "read"
      id-token: "write"
    name: "Build app and push docker image to GAR"
    runs-on: ubuntu-latest-8-cores
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Cache local Maven build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v5
        with:
          path: ~/.m2/build-cache
          key: ${{ runner.os }}-maven-build-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-build-cache-
      - name: JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Build java app
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READER_TOKEN }}
        run: mvn clean package --projects :${{ inputs.maven-project }} --also-make -Dmaven.test.skip=true --batch-mode
      - name: Build and push Docker image
        uses: nais/docker-build-push@d3a1f7e259ecc381a50435e1d4add9059429ebd7 # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: org
          image_suffix: ${{ inputs.image-suffix }}
          dockerfile: ${{ inputs.dockerfile }}
          docker_context: .
          build_args: |
            JAR_PATH=${{ inputs.jar-path }}
          build_secrets: ""
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          salsa: false
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      telemetry: ${{ steps.docker-push.outputs.telemetry }}
      digest: ${{ steps.docker-push.outputs.digest }}

  build-test-app:
    permissions:
      contents: "read"
      id-token: "write"
    name: "Build app and test"
    runs-on: ubuntu-latest-8-cores
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Cache local Maven build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v5
        with:
          path: ~/.m2/build-cache
          key: ${{ runner.os }}-maven-build-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-build-cache-
      - name: JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Build java app
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READER_TOKEN }}
        run: mvn clean package --projects :${{ inputs.maven-project }} --also-make -Dmaven.test.skip=${{ inputs.skip-tests }} --batch-mode

  salsa:
    name: Generate SBOM, attest and sign image
    needs: [build-app-docker]
    runs-on: ubuntu-latest-8-cores
    permissions:
      id-token: "write"
    steps:
      - name: NAIS login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # ratchet:nais/login@v0
        id: login
        with:
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          team: org
      - name: Generate SBOM, attest and sign image
        id: attest-sign
        uses: nais/attest-sign@a790bd54d388327e00aed3b1eee2d2311bcce0d5 # ratchet:nais/attest-sign@v2.1.3
        with:
          image_ref: ${{needs.build-app-docker.outputs.image}}

  deploy-dev:
    permissions:
      contents: "read"
      id-token: "write"
    name: Deploy to NAIS ${{ inputs.dev-cluster }}
    needs:
      - build-app-docker
      - build-test-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@033f70f2484ddfa91dc3d878e06ced3113f996ad # ratchet:nais/deploy/actions/deploy@v3
        if: ${{ inputs.unleash-vars-file-path != 'skip' }}
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: .nais/unleash/unleash-token.yaml
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: env=development
          VARS: ${{ inputs.unleash-vars-file-path }}
          TELEMETRY: ${{ needs.build-app-docker.outputs.telemetry }}
      - uses: nais/deploy/actions/deploy@033f70f2484ddfa91dc3d878e06ced3113f996ad # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.nais-config-file-path-dev }}
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: image=${{needs.build-app-docker.outputs.image}}${{ inputs.additional-nais-vars-dev }}
          TELEMETRY: ${{ needs.build-app-docker.outputs.telemetry }}

  deploy-additional-dev:
    if: ${{ inputs.additional-dev-deployments != '[]' }}
    name: Deploy ${{ matrix.deployment.suffix }} to NAIS ${{ inputs.dev-cluster }}
    permissions:
      contents: "read"
      id-token: "write"
    needs:
      - build-app-docker
      - build-test-app
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJSON(inputs.additional-dev-deployments) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Validate variant manifest
        env:
          BASE_MANIFEST: ${{ inputs.nais-config-file-path-dev }}
          VARIANT_MANIFEST: ${{ matrix.deployment.manifest }}
          SUFFIX: ${{ matrix.deployment.suffix }}
        run: |
          # Check variant path/name; validate SQL names and HTTPS ingress hosts only when listed.
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          from urllib.parse import urlsplit

          base = pathlib.Path(os.environ['BASE_MANIFEST'])
          variant = pathlib.Path(os.environ['VARIANT_MANIFEST'])
          suffix = os.environ['SUFFIX']

          def scalar(value):
              match = re.fullmatch(r'''(?:"([^"]*)"|'([^']*)'|([^\s#'"`]+))\s*(?:#.*)?''', value.strip())
              if not match:
                  raise ValueError(f'invalid manifest scalar: {value}')
              return next(part for part in match.groups() if part is not None)

          def app_name(path):
              lines = path.read_text().splitlines()
              if not any(line.startswith('kind:') and scalar(line.partition(':')[2]) == 'Application'
                         for line in lines if line.startswith('kind:')):
                  raise ValueError(f'{path}: expected a Nais Application')
              in_metadata = False
              for line in lines:
                  if line == 'metadata:':
                      in_metadata = True
                  elif in_metadata and line and not line.startswith((' ', '#')):
                      break
                  elif in_metadata:
                      if line.startswith('  name:'):
                          name = scalar(line.partition(':')[2])
                          if re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', name):
                              return name
                          raise ValueError(f'{path}: invalid metadata.name')
              raise ValueError(f'{path}: missing metadata.name')

          def list_values(lines, heading, item_indent, prefix=''):
              indent = len(heading) - len(heading.lstrip())
              values = []
              in_section = False
              found_section = False
              for line in lines:
                  if line == heading:
                      in_section = True
                      found_section = True
                  elif in_section and line.strip() and not line.lstrip().startswith('#'):
                      if len(line) - len(line.lstrip()) <= indent:
                          break
                      if line.startswith(item_indent + '- '):
                          entry = line[len(item_indent) + 2:]
                          if prefix:
                              if not entry.startswith(prefix):
                                  raise ValueError(f'malformed entry in {heading}: {line}')
                              entry = entry[len(prefix):]
                          values.append(scalar(entry))
                      elif len(line) - len(line.lstrip()) == len(item_indent) and line.lstrip().startswith('-'):
                          raise ValueError(f'malformed entry in {heading}: {line}')
              if found_section and not values:
                  raise ValueError(f'empty or malformed {heading}')
              return values

          try:
              if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', suffix):
                  raise ValueError('invalid variant suffix')
              environment = next((end for end in ('-dev-gcp', '-dev') if base.stem.endswith(end)), '')
              expected_path = base.with_name(f'{base.stem.removesuffix(environment)}-{suffix}{environment}{base.suffix}')
              if variant != expected_path or not variant.is_file():
                  raise ValueError(f'variant manifest must be {expected_path}')
              expected_name = f'{app_name(base)}-{suffix}'
              if len(expected_name) > 63 or app_name(variant) != expected_name:
                  raise ValueError(f'{variant}: metadata.name must be {expected_name}')
              lines = variant.read_text().splitlines()
              sql_names = list_values(lines, '    sqlInstances:', '      ', 'name: ')
              if any(not re.fullmatch(r'[a-z0-9-]+', name) or not name.startswith(expected_name) for name in sql_names):
                  raise ValueError(f'{variant}: every gcp.sqlInstances.name must start with {expected_name}')
              ingresses = list_values(lines, '  ingresses:', '    ')
              if any(
                  urlsplit(ingress).scheme != 'https'
                  or not (urlsplit(ingress).hostname or '').startswith(f'{expected_name}.')
                  for ingress in ingresses
              ):
                  raise ValueError(f'{variant}: every ingress must use https://{expected_name}.<domain>')
          except (KeyError, OSError, ValueError) as error:
              sys.exit(str(error))
          PY
      - uses: nais/deploy/actions/deploy@033f70f2484ddfa91dc3d878e06ced3113f996ad # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ matrix.deployment.manifest }}
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: image=${{ needs.build-app-docker.outputs.image }}${{ inputs.additional-nais-vars-dev }}
          TELEMETRY: ${{ needs.build-app-docker.outputs.telemetry }}

  deploy-prod:
    permissions:
      contents: "read"
      id-token: "write"
    name: Deploy to NAIS ${{ inputs.prod-cluster }}
    if: ${{ github.ref == 'refs/heads/main' && !inputs.skip-tests && !inputs.skip-prod-deploy}}
    needs:
      - build-app-docker
      - build-test-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@033f70f2484ddfa91dc3d878e06ced3113f996ad # ratchet:nais/deploy/actions/deploy@v3
        if: ${{ inputs.unleash-vars-file-path != 'skip' }}
        env:
          CLUSTER: ${{ inputs.prod-cluster }}
          RESOURCE: .nais/unleash/unleash-token.yaml
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: env=production
          VARS: ${{ inputs.unleash-vars-file-path }}
          TELEMETRY: ${{ needs.build-app-docker.outputs.telemetry }}
      - uses: nais/deploy/actions/deploy@033f70f2484ddfa91dc3d878e06ced3113f996ad # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: ${{ inputs.prod-cluster }}
          RESOURCE: ${{ inputs.nais-config-file-path-prod }}
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: image=${{needs.build-app-docker.outputs.image}}${{ inputs.additional-nais-vars-prod }}
          TELEMETRY: ${{ needs.build-app-docker.outputs.telemetry }}
