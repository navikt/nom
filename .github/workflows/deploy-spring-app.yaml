on:
  workflow_call:
    inputs:
      maven-project:
        required: true
        type: string
      jar-path:
        required: true
        type: string
      image-suffix:
        required: true
        type: string
      nais-config-file-path-dev:
        required: true
        type: string
      nais-config-file-path-prod:
        required: true
        type: string
      deploy-timeout:
        required: false
        type: string
        default: 10m
      dev-cluster:
        type: string
        required: false
        default: dev-gcp
      prod-cluster:
        type: string
        required: false
        default: prod-gcp
      unleash-vars-file-path:
        type: string
        required: false
        default: skip
      additional-nais-vars-dev:
        type: string
        required: false
        description: Additional template variables besides image var. Must adhere to pattern ',var1=value,var2=value'
        default: ''
      additional-nais-vars-prod:
        type: string
        required: false
        description: Additional template variables besides image var. Must adhere to pattern ',var1=value,var2=value'
        default: ''
    secrets:
      NAIS_DEPLOY_APIKEY:
        required: true
      GITHUB_PAT:
        required: true
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: true

jobs:
  build-app-docker:
    name: "Build app and push docker image to GAR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cache Depdendencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
          cache: maven
      - name: Build java app
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: mvn clean package --projects :${{ inputs.maven-project }} --also-make --batch-mode
      - name: Build and push Docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          image_suffix: ${{ inputs.image-suffix }}
          dockerfile: Dockerfile
          docker_context: .
          build_args: |
            JAR_PATH=${{ inputs.jar-path }}
          build_secrets: |
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy-dev:
    name: Deploy to NAIS ${{ inputs.dev-cluster }}
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: nais/deploy/actions/deploy@v1
        if: ${{ inputs.unleash-vars-file-path != 'skip' }}
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: .nais/unleash/unleash-token.yaml
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: env=development
          VARS: ${{ inputs.unleash-vars-file-path }}
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: ${{ inputs.dev-cluster }}
          RESOURCE: ${{ inputs.nais-config-file-path-dev }}
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: image=${{needs.build-app-docker.outputs.image}}${{ inputs.additional-nais-vars-dev }}

  deploy-prod:
    name: Deploy to NAIS ${{ inputs.prod-cluster }}
    if: github.ref == 'refs/heads/main'
    needs: build-app-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: nais/deploy/actions/deploy@v1
        if: ${{ inputs.unleash-vars-file-path != 'skip' }}
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: ${{ inputs.prod-cluster }}
          RESOURCE: .nais/unleash/unleash-token.yaml
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: env=production
          VARS: ${{ inputs.unleash-vars-file-path }}
      - uses: nais/deploy/actions/deploy@v1
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: ${{ inputs.prod-cluster }}
          RESOURCE: ${{ inputs.nais-config-file-path-prod }}
          TIMEOUT: ${{ inputs.deploy-timeout }}
          VAR: image=${{needs.build-app-docker.outputs.image}}${{ inputs.additional-nais-vars-prod }}
