name: 'update-kafka-topics: dev-only'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.nais/topics/topics-dev-only.yaml'
      - '.github/workflows/kafka-topics-dev-only.yaml'

jobs:
  deploy-kafka-topics-dev:
    name: Deploy to Aiven Dev
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          VAR: kafka-pool=nav-dev
          RESOURCE: .nais/topics/topics-dev-only.yaml
