
spring:
  datasource:
    username: postgres
    password: password
    url: jdbc:postgresql://127.0.0.1:5432/postgres-ressurs
  flyway:
    enabled: true
  kafka:
    bootstrap.servers: localhost:9092
    topic.ressurs.name: aapen-nom-ressurs-v1

management:
  endpoints:
    enabled-by-default: true
    web:
      base-path: /internal
      exposure.include: prometheus
