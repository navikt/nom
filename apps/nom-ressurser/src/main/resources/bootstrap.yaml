spring.cloud.vault:
  host: vault.adeo.no
  port: 443
  fail-fast: true
  connection-timeout: 15000
  read-timeout: 30000
  generic:
    enabled: true
    backend: kv/${stack}/fss
    application-name: ${nais.app.name}/${nais.namespace}
    default-context: ${nais.app.name}/${nais.namespace}
  authentication: KUBERNETES
  config:
    order: -10
    lifecycle.enabled: true
  kubernetes:
    role: ${nais.app.name}
    kubernetes-path: kubernetes/${stack}/fss
    service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token