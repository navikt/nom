app:
  kafka:
    username: ${app.username}
    password: ${app.password}
    topic:
      ressurs:
        name: org.nom-ressurser
  scheduledTasks:
    dvhConsumer: 0 0 5 ? * *  # Every day 5AM
    repositoryMetrics: 0 59 * ? * *  # Every hour

dvh:
  endpoint: ${DVH_ENDPOINT}

server:
  error:
    include-message: always
    
postgres:
  mountPath: postgresql/${DB_ENV}
  jdbc:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
  user:
    role: ${DB_NAME}-admin

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /internal
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      enabled: true

spring:
  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    schemas: public
    table: schema_version

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    properties:
      security.protocol: SSL
      ssl:
        keystore:
          type: PKCS12
          location: ${KAFKA_KEYSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
        truststore:
          location: ${KAFKA_TRUSTSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 30
      properties:
        max.block.ms: 15000
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}

