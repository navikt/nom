app:
  kafka:
    username: ${app.username}
    password: ${app.password}
    topic:
      ressurs:
        name: org.nom-ressurser
  scheduledTasks:
    dvhConsumer: 0 0 5 ? * *  # Every day 5AM
    repositoryMetrics: 0 59 * ? * *  # Every hour

dvh:
  endpoint: ${DVH_ENDPOINT}

server:
  error:
    include-message: always
    
postgres:
  mountPath: postgresql/${DB_ENV}
  jdbc:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
  user:
    role: ${DB_NAME}-admin

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /internal
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      enabled: true

spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    schemas: public
    table: schema_version

  kafka:
    client-id: ${app.kafka.username}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${app.kafka.username}" password="${app.kafka.password}";
      ssl.truststore.location: ${javax.net.ssl.trustStore:}
      ssl.truststore.password: ${javax.net.ssl.trustStorePassword:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: ${kafka-transaction-uuid}-
      acks: all
      retries: 30
      properties:
        max.block.ms: 15000
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

no:
  nav:
    security:
      jwt:
        issuer:
          aad:
            discovery-url: ${AZURE_APP_WELL_KNOWN_URL:http://metadata}
            accepted-audience: ${AZURE_APP_CLIENT_ID:aud-localhost}
            proxy-url:

