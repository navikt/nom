spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    schemas: public
    table: schema_version

postgres:
  mountPath: postgresql/${DB_ENV}
  jdbc:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
  user:
    role: ${DB_NAME}-admin

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /internal
      exposure.include: prometheus


app.kafka:
  username: ${app.username}
  password: ${app.password}

spring.kafka.producer:
  client-id: srvnom-ressurser
  properties:
    security.protocol: SASL_SSL
    sasl:
      mechanism: PLAIN
      jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${app.kafka.username}" password="${app.kafka.password}";
      max.block.ms: 15000
      enable.idempotence: true
      max.in.flight.requests.per.connection: 5
  ssl:
    trust-store-location: ${javax.net.ssl.trustStore:}
    trust-store-password: ${javax.net.ssl.trustStorePassword:}
    acks: all
    retries: 2147483647