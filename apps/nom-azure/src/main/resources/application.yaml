spring.application.name: nom-azure

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: read_only
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus, info, health, metrics, loggers, mappings

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}