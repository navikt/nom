app:
  name: nom-paarorende

spring:
  datasource:
    url: ${DATABASE_JDBC_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    schemas: public
    table: schema_version

management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      exposure:
        include: prometheus,health
      base-path: /internal
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true