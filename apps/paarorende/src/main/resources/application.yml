app:
  name: nom-paarorende

spring:
  datasource:
    url: ${DATABASE_JDBC_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    schemas: public
    table: schema_version
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      exposure:
        include: prometheus,health
      base-path: /internal
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true