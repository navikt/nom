no.nav:
  security:
    jwt:
      issuer:
        selvbetjening:
          discoveryurl: http://metadata
          accepted_audience: aud-localhost

ibm:
  mq:
    queue-manager: qmtest
    channel: DEV.APP.SVRCONN
    conn-name: localhost(1414)
