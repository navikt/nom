spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    schemas: public
    table: schema_version
  kafka:
    consumer:
      groupid: skjermede-personer

maanderPlusSkjerming: 6

postgres:
  mountPath: postgresql/${DB_ENV}
  jdbc:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
  user:
    role: ${DB_NAME}-admin

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /internal
      exposure.include: prometheus
  endpoint:
    prometheus:
      enabled: true

app:
  kafka:
    username: ${app.username}
    password: ${app.password}
    group-id-prefix: ${nais.app.name}-${nais.namespace}
    topic.skjermet.name: aapen-skjermede-personer-v1
  scheduledTasks:
    repositoryMetrics: 0 59 * ? * * # Every hour

spring.kafka:
  properties:
    security.protocol: SASL_SSL
    sasl:
      mechanism: PLAIN
      jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${app.kafka.username}" password="${app.kafka.password}";
    ssl:
      truststore.location: ${javax.net.ssl.trustStore:}
      truststore.password: ${javax.net.ssl.trustStorePassword:}
  consumer:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: '*'
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    transaction-id-prefix: ${kafka-transaction-uuid}-
    acks: all
    retries: 30
    properties:
      max.block.ms: 15000
      enable.idempotence: true
      max.in.flight.requests.per.connection: 1

no.nav:
  security:
    jwt:
      issuer:
        selvbetjening:
          discoveryurl: ${AAD_B2C_DISCOVERYURL}
          accepted_audience: ${LOGINSERVICE_CLIENTID}
        reststs:
          discoveryurl: http://security-token-service.default/rest/v1/sts/.well-known/openid-configuration
          accepted_audience: srvskjermingsbrev

