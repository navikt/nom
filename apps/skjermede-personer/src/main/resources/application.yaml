spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    schemas: public
    table: schema_version

postgres:
  mountPath: postgresql/${DB_ENV}
  jdbc:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
  user:
    role: ${DB_NAME}-admin

kafka:
  consumer:
    groupid: skjermede-personer
    brokers: localhost:9092
bootstrap.servers: localhost:9092