spring:
  datasource:
    username: postgres
    password: password
    url: jdbc:postgresql://127.0.0.1:5433/postgres-skjermet
  flyway:
    enabled: true
  kafka:
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: no.nav.nom.*
    bootstrap.servers: localhost:9092

kafka:
  consumer:
    groupid: skjermede-personer

server.port: 8081

management:
  endpoints:
    enabled-by-default: true
    web:
      base-path: /internal
      exposure.include: prometheus

