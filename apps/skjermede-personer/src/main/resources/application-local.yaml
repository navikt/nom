app.kafka:
  username: NO_VALUE
  password: NO_VALUE

spring:
  datasource:
    username: postgres
    password: password
    url: jdbc:postgresql://127.0.0.1:5433/postgres-skjermet
  kafka:
    consumer:
      groupid: skjermede-personer
    bootstrap.servers: localhost:9092
    client-id: srvnav-ressurs
    properties:
      security.protocol: PLAINTEXT
      sasl:
        mechanism:
        jaas.config:
      ssl:
        truststore.location: NO_VALUE
        truststore.password: NO_VALUE

server.port: 8081

management:
  endpoints:
    enabled-by-default: true
    web:
      base-path: /internal
      exposure.include: prometheus
