spring:
  datasource:
    username: postgres
    password: password
    url: jdbc:postgresql://127.0.0.1:5433/postgres-skjermet
  flyway:
    enabled: true
  kafka:
    consumer:
      groupid: skjermede-personer
    bootstrap.servers: localhost:9092

server.port: 8081

management:
  endpoints:
    enabled-by-default: true
    web:
      base-path: /internal
      exposure.include: prometheus

