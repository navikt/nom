app:
  name: ${NAIS_APP_NAME:nom-remedy-integrasjon}
  kafka:
    ressurs:
      state-topic: org.nom.intern-ressurs-state
      dlt-topic: org.nom.intern-ressurs-state-dlt
      auto-startup: true
    orgEnhet:
      state-topic: org.nom.intern-orgenhet-state
    orgtilknytning:
      state-topic: org.nom.intern-orgtilknytning-state
      dlt-topic: org.nom.intern-orgtilknytning-state-dlt
      auto-startup: true
  kafka-topics:
    ressurs-eventsource:
      topic-name: org.nom.ressurs-eventsource
      auto-startup: true
    orgtilknytning-eventsource:
      topic-name: org.nom.orgtilknytning-eventsource
      auto-startup: true
    nom-mastered-ressurs:
      topic-name: org.nom.nom-mastered-ressurs
      auto-startup: true
  clients:
    nom-api:
      url: ${NOM_API_URL}

nom.libs.state.ressurs.enabled: true
nom.libs.state.orgenhet.enabled: true
nom.libs.state.orgtilknytning.enabled: true
nom.libs.state.mastered-ressurs.enabled: true

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus, info, health, metrics

vault:
  postgresMountPath: postgresql/${DB_ENV}

spring:
  datasource:
    remedy:
      driver-class-name: oracle.jdbc.OracleDriver
      url: ${REMEDY_DATASOURCE_URL}
      username: ${REMEDY_DB_USER} # Denne lastes også inn fra remedy-db-credentials k8s seecret. Grunnen til at vi ikke skriver den rett in her er for å unngå at brukeren blir låst, pga gjentatte påloggingsforsøk, dersom appen ikke får hentet secrets.
      password: ${REMEDY_DB_PWD} # Lastes inn fra remedy-db-credentials k8s seecret

    nom-remedy-integrasjon:
      url: jdbc:postgresql://${POSTGRES_DB_HOST}:5432/nom-remedy-integrasjon
      username: nom-remedy-integrasjon-admin

    hikari:
      data-source-properties:
        defaultRowPrefetch: 1000
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 2000000
      connection-timeout: 30000
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_DB_HOST}:5432/nom-remedy-integrasjon
    username: nom-remedy-integrasjon-admin

  flyway:
    enabled: true
    schemas: public
    table: schema_version
    baselineOnMigrate: true

  kafka:
    client-id: ${app.name}
    bootstrap-servers: ${KAFKA_BROKERS}
    security:
      protocol: SSL
    properties:
      security.protocol: SSL
      ssl:
        keystore:
          type: PKCS12
          location: ${KAFKA_KEYSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
        truststore:
          location: ${KAFKA_TRUSTSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: '*'
      isolation-level: read_committed
      group-id: ${app.name}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${azure.issuer-uri}
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
      client:
        registration:
          nom-api:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_API_SCOPE}
        provider:
          azure:
            issuer-uri: ${azure.issuer-uri}

azure:
  issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}

---
spring:
  config:
    activate:
      on-profile: dev & !prod

POSTGRES_DB_HOST: b27dbvl033.preprod.local
DB_ENV: preprod-fss

