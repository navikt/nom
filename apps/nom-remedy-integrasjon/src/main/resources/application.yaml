app:
  name: ${NAIS_APP_NAME:nom-remedy-integrasjon}
  kafka-topics:
    ressurs-eventsource: org.nom.ressurs-eventsource

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus, info, health, metrics
spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${REMEDY_DATASOURCE_URL}
    username: nom_integrasjon
    password: ${REMEDY_DB_PWD} # Lastes inn fra vault ved deploy

    hikari:
      data-source-properties:
        defaultRowPrefetch: 1000
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 2000000
      connection-timeout: 30000
  kafka:
    client-id: ${app.name}
    bootstrap-servers: ${KAFKA_BROKERS}
    security:
      protocol: SSL
    properties:
      security.protocol: SSL
      ssl:
        keystore:
          type: PKCS12
          location: ${KAFKA_KEYSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
        truststore:
          location: ${KAFKA_TRUSTSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: 'no.nav.nom.contract.nom.eventsource'
      isolation-level: read_committed
      group-id: ${app.name}

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}