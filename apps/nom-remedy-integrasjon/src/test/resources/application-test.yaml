
spring:
  cloud:
    vault:
      enabled: false
  datasource:
    remedy:
      url: jdbc:h2:mem:remedy;Mode=Oracle;INIT=RUNSCRIPT FROM 'src/test/resources/create_oracle_remedy_db.sql'
      username: sa
      password: password
      driver-class-name: org.h2.Driver

    nom-remedy-integrasjon:
      url: jdbc:tc:postgresql:14.4:///nom-remedy-integrasjon
      username: test
      password: test

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    properties:
      security.protocol: PLAINTEXT
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      group-id: test

UNLEASH_SERVER_API_URL: https://unleash.nais.io/api
UNLEASH_SERVER_API_TOKEN: some-token

azure:
  issuer-uri: ${mock-oauth2-server.baseUrl}/aad

AZURE_APP_CLIENT_ID: nom-remedy-integrasjon
AZURE_APP_CLIENT_SECRET: nom-remedy-integrasjon-client-secret

NOM_API_URL: http://localhost:${wiremock.server.port}
NOM_API_SCOPE: api://dev-gcp.nom.nom-api/.default

NOM_ADMIN_GROUP_ID: nom-admin-group # Settet i nais-config i dev og prod profiles

DB_ENV: test