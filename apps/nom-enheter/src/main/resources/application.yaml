spring:
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres-enheter}
  flyway:
    enabled: true

no.nav.security.jwt:
  client:
    registration:
      nom-proxy-client:
        well-known-url: ${AZURE_APP_WELL_KNOWN_URL}
        grant-type: client_credentials
        scope: openid ${AZURE_APP_CLIENT_ID}/.default
        authentication:
          client-id: ${AZURE_APP_CLIENT_ID}
          client-jwk: ${AZURE_APP_JWK}
          client-auth-method: private_key_jwt