app:
  name: ${NAIS_APP_NAME:nom-sf-integrasjon}
  kafka:
    evtsrc:
      group-id: nom-sf-integrasjon-evtsrc
      auto-startup: true
      retry-delay-ms: 2000
      orgenhet:
        topic: org.nom.orgenhet-eventsource
      orgenhet-leder:
        topic: org.nom.orgenhet-leder-eventsource
      organisering:
        topic: org.nom.organisering-eventsource
  sf:
    api-url: ${SF_API_URL:https://sf.api.example.com}
    client-id: ${SF_CLIENT_ID:sf-client-id}
    private-key: ${SF_PRIVATE_KEY:sf-private-key}
    tenant: ${SF_TENANT:sf-tenant}
    user-id: ${SF_USER_ID:sf-user-id}
    cpi-api-url: https://cloud-platform-integration-test-02d6jg6h.it-cpi050-rt.cfapps.eu20-002.hana.ondemand.com
    historicalCutoffDate: 2026-09-28
    nav-toppnode-id: ${SF_NAV_TOPPNODE_ID:sf-nav-topnode-id}
  nik:
    base-url: ${NIK_BASEURL}
    aad-scope: ${NIK_API_SCOPE}


nom.libs.state.ressurs.enabled: true
nom.libs.state.orgenhet.enabled: true
nom.libs.state.orgtilknytning.enabled: true
nom.libs.state.organisering.enabled: true
nom.libs.state.mastered-ressurs.enabled: true
nom.libs.state.delegert-leder.enabled: true
nom.libs.state.orgenhet-leder.enabled: true

management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus, info, health, metrics, loggers, mappings
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

spring:
  main:
    banner-mode: "log"
    cloud-platform: kubernetes

  datasource:
    url: ${DATABASE_JDBC_URL}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  flyway:
    enabled: true
    schemas: public
    table: schema_version
    baselineOnMigrate: true

  kafka:
    security.protocol: SSL
    ssl:
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    bootstrap-servers: ${KAFKA_BROKERS}
    admin:
      client-id: ${app.name}
    consumer:
      max-poll-records: 1000
      auto-offset-reset: earliest
      group-id: ${app.name}
    listener:
      missing-topics-fatal: true
    client-id: ${app.name}
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
    mapper:
      sort-properties-alphabetically: false

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}

---
spring:
  config:
    activate:
      on-profile: "!local"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
      client:
        registration:
          nik:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NIK_API_SCOPE}
          sap-cpi:
            provider: sap-cpi
            client-id:  ${SF_CPI_CLIENT_ID:sf-cpi-client-id}
            client-secret:  ${SF_CPI_CLIENT_SECRET:sf-cpi-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: client_credentials
        provider:
          azure:
            issuer-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
          sap-cpi:
            token-uri: ${SF_CPI_OAUTH_URL:https://sf-cpi-oauth.example.com}