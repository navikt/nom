app:
  dvh:
    topic: nom.dvhsource-v1
    tdvUsername: ${tdvuser}
    tdvPassword: ${tdvpass}
    enhet:
      url: ${app.dvh.base-url}/json/Hr/Nom/NOM_HRORG_HIEARKI_PARAM
    ressurs:
      url: ${app.dvh.base-url}/json/Hr/Nom/Nom_Ansatte
      chunkSize: 5000
    stilling:
      url: ${app.dvh.base-url}/json/Hr/NOM2/stilling2nom

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_APP_WELL_KNOWN_URL}
          accepted-audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}