app:
  kafka:
    stateTopic: org.nom.intern-organisering-state
    eventsourceTopic: org.nom.organisering-eventsource

spring:
  kafka:
    security:
      protocol: SSL
    ssl:
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    streams:
      application-id: ${KAFKA_STREAMS_APPLICATION_ID}
      properties:
        commit.interval.ms: 0
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.springframework.kafka.support.serializer.JacksonJsonSerde
    bootstrap-servers: ${KAFKA_BROKERS}
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
    mapper:
      sort-properties-alphabetically: false

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus, info, health, metrics
  metrics:
    web:
      server:
        request:
          autotime:
            enabled: true