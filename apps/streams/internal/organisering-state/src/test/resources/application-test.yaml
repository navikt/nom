KAFKA_BROKERS: ${spring.embedded.kafka.brokers}
KAFKA_STREAMS_APPLICATION_ID: organisering-state
spring:
  kafka:
    security:
      protocol: PLAINTEXT
    streams:
      cleanup:
        on-shutdown: true
        on-startup: true

unleash:
  endpoint:
    url: http://localhost:43223/api/unleashapi
  api-key: some-unleash-token