app:
  name: ${NAIS_APP_NAME:nom-unit4}
  kafka:
    listener:
      block-seconds-on-bail: PT20S
  ressurs:
    topic: org.ressurs-eventsource
  unit4:
    base-url: ${UNIT4_BASEURL}
    employees-path: /agrt01-web-api/v1/employees
    api-username: ${NOM_UNIT4_API_USERNAME}
    api-password: ${NOM_UNIT4_API_PASSWORD}
  proxy:
    base-url: ${NOM_PROXY_BASEURL}
    aad-client-id: api://${NOM_PROXY_CLIENT_ID}/.default

authentication:
  aad:
    issuer-base-url: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    client-id: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}

spring:
  application:
    name: ${app.name}
  main:
    cloud-platform: kubernetes
    banner-mode: off

  kafka:
    client-id: ${app.name}
    bootstrap-servers: ${KAFKA_BROKERS}
    properties:
      security.protocol: SSL
      ssl:
        keystore:
          type: PKCS12
          location: ${KAFKA_KEYSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
        truststore:
          location: ${KAFKA_TRUSTSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: 'no.nav.nom.contract.nom.eventsource'
      isolation-level: read_committed
      group-id: ${app.name}
  jackson:
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}

server:
  shutdown: graceful

management:
  metrics:
    tags:
      app: ${app.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus,health,heapdump,scheduledtasks,threaddump

unleash:
  endpoint:
    url: https://unleash.nais.io/api