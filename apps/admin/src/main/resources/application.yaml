app:
  name: ${NAIS_APP_NAME:nom-admin}
  kafka:
    ressurs:
      eventsourceTopic: org.nom.ressurs-eventsource
      apiEventTopic: org.nom.api-ressurs-state-v4
      eventsource-listener-id: nom-admin_ressursEvtsrcListener_${HOSTNAME}
      apiEventTopic-listener-id: nom-admin_apiRessursListener_v4_${HOSTNAME}
    orgenhet:
      eventsourceTopic: org.nom.orgenhet-eventsource
      apiEventTopic: org.nom.api-orgenhet-state-v3
      eventsource-listener-id: nom-admin_orgenhetEvtsrcListener_${HOSTNAME}
      apiEventTopic-listener-id: nom-admin_apiOrgenhetListener_${HOSTNAME}
    organisering:
      eventsourceTopic: org.nom.organisering-eventsource
      eventsource-listener-id: nom-admin_organiseringEvtsrcListener_${HOSTNAME}
    orgEnhetLeder:
      eventsourceTopic: org.nom.orgenhet-leder-eventsource
      eventsource-listener-id: nom-admin_orgenhetLederEvtsrcListener_${HOSTNAME}
    orgtilknytning:
      eventsourceTopic: org.nom.orgtilknytning-eventsource
      eventsource-listener-id: nom-admin_orgtilknytningEvtsrcListener_${HOSTNAME}
    authorize:
      eventsourceTopic: org.nom.nom-authorize-eventsource
      eventsource-listener-id: nom-admin_authorizeEvtsrcListener_${HOSTNAME}
    hendelser:
      apiEventTopic: org.nom.api-hendelser-v1
      apiEventTopic-listener-id: nom-admin_apiHendelserListener_${HOSTNAME}
    ressurs-hendelser:
      apiEventTopic: org.nom.api-ressurs-hendelse-v1
      apiEventTopic-listener-id: nom-admin_apiRessursHendelserListener_${HOSTNAME}
    dead-letter:
      orgtilknytning-topic: org.nom.intern-orgtilknytning-state-dlt
      ressurs-topic: org.nom.intern-ressurs-state-dlt
      listener-id: nom-admin_deadLetterListener_${HOSTNAME}
  clients:
    nom-api:
      url: ${NOM_API_URL}
    nom-remedy-integrasjon:
      url: ${NOM_REMEDY_INTEGRASJON_BASE_URL}

nom.libs.state.ressurs.enabled: true
nom.libs.state.orgenhet.enabled: true
nom.libs.state.orgtilknytning.enabled: true
nom.libs.state.organisering.enabled: true
nom.libs.state.mastered-ressurs.enabled: true
nom.libs.state.delegert-leder.enabled: true
nom.libs.state.orgenhet-leder.enabled: true

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}
  groups:
    nomAdmin: ${NOM_ADMIN_GROUPID:nomAdminGroup}
    readOnly: ${READONLY_GROUPID:readOnlyGroup}
    extendedReadOnly: ${EXTENDED_READONLY_GROUPID:readOnlyGroup}

management:
  metrics:
    tags:
      app: ${app.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus, info, health, metrics, loggers, mappings

spring:
  kafka:
    security.protocol: SSL
    ssl:
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    bootstrap-servers: ${KAFKA_BROKERS}
    admin:
      client-id: ${HOSTNAME}
    consumer:
      max-poll-records: 1000
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: ${HOSTNAME}
    listener:
      missing-topics-fatal: true
    client-id: ${HOSTNAME}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
      client:
        registration:
          nom-api:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_API_SCOPE}
          nom-remedy-integrasjon:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_REMEDY_API_SCOPE}
        provider:
          azure:
            issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
    mapper:
      sort-properties-alphabetically: false

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}

logging:
  level:
    no.nav.nom.apps.admin.sanitycheck: DEBUG

--- # This is the same as having an application-dev.yaml file
spring:
  config:
    activate:
      on-profile: dev && !prod

app:
  granted-authorities:
    groups:
      nom-admin:
        group-id: "${NOM_ADMIN_GROUPID}"
        scopes: ["ADMIN"]
      readonly:
        group-id: "${READONLY_GROUPID}"
        scopes:
          - READONLY
      extended-readonly:
        group-id: "${EXTENDED_READONLY_GROUPID}"
        scopes:
          - READONLY
          - EXTENDED_READONLY

  google-storage-bucket:
    name: no-nav-org-dev-nom-admin-storage-bucket
    remedy-data: IR_export.csv

NOM_ADMIN_GROUPID:          "9e0e2958-df7a-4376-83f3-9bcbec1f2650" # nom-admin
READONLY_GROUPID:           "76611d10-876b-4df1-8425-dfe61e6990d1" # 0000-CA-NOM-ADMIN-Lesetilgang
EXTENDED_READONLY_GROUPID:  "a0c8eddc-2435-4fea-a642-58b2b16dd8e0" # 0000-CA-NOM-ADMIN-Utvidet-Lesetilgang

--- # This is the same as having an application-prod.yaml file
