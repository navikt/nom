      nom-admin:
        group-id: "${NOM_ADMIN_GROUPID}"
        scopes: ["ADMIN"]
      readonly:
        group-id: "${READONLY_GROUPID}"
        scopes:
          - READONLY
      extended-readonly:
        group-id: "${EXTENDED_READONLY_GROUPID}"
        scopes:
          - READONLY
          - EXTENDED_READONLY

  google-storage-bucket:
    name: no-nav-org-prod-nom-admin-storage-bucket
    remedy-data: IR_export.csv

