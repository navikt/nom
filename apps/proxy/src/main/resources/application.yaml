app:
  dvh:
    tdvUsername: ${tdvuser}
    tdvPassword: ${tdvpass}
    ressurs:
      url: ${app.dvh.base-url}/json/Hr/Nom/Nom_Ansatte
      chunkSize: 5000
    stilling:
      url: ${app.dvh.base-url}/json/Hr/NOM2/stilling2nom
    ressurser:
      url: ${app.dvh.base-url}/json/Hr/NOM2/NOM_ANSATTE_BUCKETS_v1
      bucketCount: 32
    enheter:
      url: ${app.dvh.base-url}/json/Hr/NOM2/NOM_HRORG_HIERARKI_v1
      urlV2: ${app.dvh.base-url}/json/Hr/NOM2/NOM_HRORG_HIERARKI2_v2
authentication:
  sts:
    issuerBaseUrl: ${STS_BASEURL}
    username: ${SERVICEUSER_USERNAME}
    password: ${SERVICEUSER_PASSWORD}
    grantType: client_credentials
    scope: openid

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
          accepted-audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
          subjects: ${ACCEPTED_SUBJECTS}
  ldap:
    urls: ${LDAP_URL}
    username: ${app.ldap.username}
    password: ${app.ldap.password}
    base: ${LDAP_BASE}
    template:
      ignore-partial-result-exception: true

nom:
  libs:
    utils:
      common:
        app:
          load-properties: true