app:
  unit4:
    unit4Username: ${NOM_UNIT4_API_USERNAME}
    unit4Password: ${NOM_UNIT4_API_PASSWORD}
    baseUrl: ${UNIT4_BASE_URL}
    employeesPath: ${UNIT4_EMPLOYEES_PATH}
    apiPath: ${UNIT4_API_PATH}
  webClientMaxBytesInMemorySize: 370_000_000  # 350+ GB

spring:
  application:
    name: ${NAIS_APP_NAME:nom-proxy}
  main:
    banner-mode: off
    cloud-platform: kubernetes
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${azure.issuer-uri}
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
  ldap:
    urls: ${LDAP_URL}
    username: ${app.ldap.username}
    password: ${app.ldap.password}
    base: ${LDAP_BASE}
    template:
      ignore-partial-result-exception: true

azure:
  issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0

server:
  shutdown: graceful

management:
  metrics:
    tags:
      app: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus,health

unleash:
  endpoint:
    url: https://unleash.nais.io/api

---
spring:
  config:
    activate:
      on-profile: dev & !prod

LDAP_URL: ldaps://ldapgw.preprod.local:636
LDAP_BASE: DC=preprod,DC=local
UNIT4_BASE_URL: https://agresso.test.local
UNIT4_EMPLOYEES_PATH: '/agrt01-web-api/v1/employees'
UNIT4_API_PATH: '/agrt01-web-api/v1'

---
spring:
  config:
    activate:
      on-profile: prod & !dev

LDAP_URL: ldaps://ldapgw.adeo.no:636
LDAP_BASE: DC=adeo,DC=no
UNIT4_BASE_URL: https://agresso.adeo.no
UNIT4_EMPLOYEES_PATH: '/AgressoWebApi/v1/employees'
UNIT4_API_PATH: '/AgressoWebApi/v1'
