DVH_BASE_URL: http://localhost:${wiremock.server.port}

app:
  pdl:
    baseUrl: http://localhost:${wiremock.server.port}/
  dvh:
    tdvUsername: test-stilling-user
    tdvPassword: test-stilling-pass
    ressurs:
      chunkSize: 3
  ldap:
    username: ldapuser
    password: ldappwd
  tel:
    telUsername: test-tel-user
    telPassword: test-tel-pass
    url: http://localhost:${wiremock.server.port}/tel

authentication:
  sts:
    issuerBaseUrl: http://localhost:${wiremock.server.port}/
    username: test
    password: test

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${wiremock.server.port}/aad
          accepted-audience: test
          subjects: testSubject
  ldap:
    base: DC=adeo,DC=no
    urls: ""
    embedded:
      base-dn: ${spring.ldap.base}
      credential:
        username: uid=${app.ldap.username}
        password: ${app.ldap.password}
      validation:
        enabled: false