UNIT4_BASE_URL: http://localhost:${wiremock.server.port}
UNIT4_EMPLOYEES_PATH: '/agrt01-web-api/v1/employees'
UNIT4_API_PATH: '/agrt01-web-api/v1'
AZURE_APP_CLIENT_ID: valid-audience

app:
  ldap:
    username: ldapuser
    password: ldappwd

spring:
  ldap:
    base: DC=adeo,DC=no
    urls: ""
    embedded:
      base-dn: ${spring.ldap.base}
      credential:
        username: uid=${app.ldap.username}
        password: ${app.ldap.password}
      validation:
        enabled: false

azure:
  issuer-uri: ${mock-oauth2-server.baseUrl}/issuer1