spring:
  kafka:
    bootstrap-servers: "localhost:9092"
    properties:
      security.protocol: PLAINTEXT
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      group-id: test

  flyway:
    enabled: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${wiremock.server.port}/aad
          accepted-audience: test

test:
  topic: embedded-test-topic
  rnr-topic: embedded-rnr-test-topic

app:
  kafka:
    topic.eventsource.name: ${test.topic}
    topic.rnr.name: ${test.rnr-topic}

  pdl:
    tema: GEN
    baseUrl: ${PDL_BASEURL}
    aadClientId: api://${PDL_CLIENT_ID}/.default

