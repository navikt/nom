app:
  name: ${NAIS_APP_NAME:nav-ident}
  kafka:
    topic:
      eventsource:
        name: org.nav-ident
      rnr:
        name: org.nav-ident-rnr
    identServiceListenerName: IdentService_${HOSTNAME}  # Ønsker unik consumer group per pod for å lese alle meldinger (For asynk koble rnr need.respons til selve requesten)
    eventSourceListenerName: EventSourceListener_${HOSTNAME}  # Ønsker unik consumer group per pod for å lese alle meldinger (Domain model er in memory, å skal være komplett i hver pod), også fra start av stream
    eventSourceIdleTimeout: 10000 # Millis før idle event - brukes for å trigge når lesing av eventsource køen er ferdig.
  pdl:
    tema: GEN
    behandlingsnummer: B348
    baseUrl: ${PDL_BASE_URL}
    aadClientId: api://${PDL_CLIENT_ID}/.default
    timeoutInMillis: 2500
  redis:
    rnrClientTokenCacheName: rnrClientTokenCache
  navident:
    sequence:  ${NAVIDENT_SEQUENCE:168000}

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}

spring:
  application:
    name: ${app.name}
  main:
    banner-mode: "log"
    cloud-platform: kubernetes

  datasource:
    url: ${DATABASE_JDBC_URL}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5

  jpa:
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    security.protocol: SSL
    ssl:
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 30
      properties:
        max.block.ms: 15000
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "no.nav.nom.apps.navident.eventsource, no.nav.nom.apps.navident.rnrservices"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${azure.issuer-uri}
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
      client:
        registration:
          pdl:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${PDL_API_SCOPE}
        provider:
          azure:
            issuer-uri: ${azure.issuer-uri}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
    mapper:
      sort-properties-alphabetically: false

azure:
  issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0

management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      exposure:
        include: prometheus,health,mappings,flyway,info,loggers,metrics
      base-path: /internal
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

server:
  shutdown: graceful

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}

---
spring:
  config:
    activate:
      on-profile: (dev || test) && !prod
  flyway:
    locations: classpath:/db/migration,classpath:/db/dev/migration

app:
  gs-bucket-name: no-nav-org-dev-nav-ident-storage-bucket

PDL_CLIENT_ID: dev-fss.pdl.pdl-api
PDL_BASE_URL: https://pdl-api.dev-fss-pub.nais.io
PDL_API_SCOPE: api://dev-fss.pdl.pdl-api/.default
REDIS_HOST: nav-ident-redis.org.svc.cluster.local

logging:
  level:
    no.nav.nom.apps.navident: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod && !dev
  flyway:
    locations: classpath:/db/migration,classpath:/db/prod/migration

app:
  gs-bucket-name: no-nav-org-prod-nav-ident-storage-bucket

PDL_CLIENT_ID: prod-fss.pdl.pdl-api
PDL_BASE_URL: https://pdl-api.prod-fss-pub.nais.io
PDL_API_SCOPE: api://prod-fss.pdl.pdl-api/.default

REDIS_HOST: nav-ident-redis.org.svc.cluster.local
NAVIDENT_SEQUENCE: 168000
