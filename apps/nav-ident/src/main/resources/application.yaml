app:
  name: ${NAIS_APP_NAME:nav-ident}
  kafka:
    topic.eventsource.name: org.nav-ident
    topic.rnr.name: org.nav-ident-rnr
    identServiceListenerName: IdentService_${HOSTNAME}  # Ønsker unik consumer group per pod for å lese alle meldinger (For asynk koble rnr need.respons til selve requesten)
    eventSourceListenerName: EventSourceListener_${HOSTNAME}  # Ønsker unik consumer group per pod for å lese alle meldinger (Domain model er in memory, å skal være komplett i hver pod), også fra start av stream
    eventSourceIdleTimeout: 10000 # Millis før idle event - brukes for å trigge når lesing av eventsource køen er ferdig.
  pdl:
    tema: GEN
    baseUrl: ${PDL_BASE_URL}
    aadClientId: api://${PDL_CLIENT_ID}/.default
  redis:
    rnrClientTokenCacheName: rnrClientTokenCache

logging:
  level:
    no.nav.nom: DEBUG

nom:
  libs:
    utils:
      common:
        kafka:
          load-properties: false
        app:
          load-properties: true

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}

management.endpoints.web.exposure.include: prometheus,health,mappings,flyway,info,loggers,metrics

spring:
  main:
    banner-mode: "log"

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 2

  jpa:
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    properties:
      security.protocol: SSL
      ssl:
        keystore:
          type: PKCS12
          location: ${KAFKA_KEYSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
        truststore:
          location: ${KAFKA_TRUSTSTORE_PATH}
          password: ${KAFKA_CREDSTORE_PASSWORD}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 30
      properties:
        max.block.ms: 15000
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties.spring.json.trusted.packages: "no.nav.nom.apps.navident.eventsource, no.nav.nom.apps.navident.rnrservices"

  redis:
    host: ${REDIS_HOST}
    port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          accepted-audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}

  flyway:
    locations: classpath:/db/migration,classpath:/prod/db/migration
  config:
    activate:
      on-profile:
spring:
  profiles: dev
  flyway:
    locations: classpath:/db/migration,classpath:/dev/db/migration