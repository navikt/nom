query {
    organisasjonsenhet(where: {agressoId: "testId1", orgNiv: "ORGENHET"}) {
        agressoId
        leder{
            ressurs{
                navIdent
                personIdent
                fornavn
                etternavn
            }
        }
        koblinger{
            ressurs{
                fornavn
                etternavn
            }
        }
    }
}