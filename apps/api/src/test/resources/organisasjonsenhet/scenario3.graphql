query {
    organisasjonsenhet(where: {agressoId: "testId3", orgNiv: "ORGNIV3"}) {
        agressoId
        navn
        organiseringer{
            retning
            orgEnhet{
                id
                agressoId
                navn
                gyldigFom
                gyldigTom
            }
            gyldigFom
            gyldigTom
        }
    }
}