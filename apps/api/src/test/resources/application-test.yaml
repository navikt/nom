spring:
  kafka:
    security:
      protocol: PLAINTEXT
    bootstrap-servers: ${KAFKA_BROKERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${mock-oauth2-server.baseUrl}/aad
          audiences: test
      client:
        registration:
          email:
            provider: azure
            client-id: TEST
            client-secret: TEST
            authorization-grant-type: client_credentials
            scope:
              - https://graph.microsoft.com/.default
        provider:
          azure:
            issuer-uri: ${mock-oauth2-server.baseUrl}/aad

  # Testcontainers automagikk. Med jdbc:tc: driver kjøres basen automatisk opp i en test container
# https://www.testcontainers.org/modules/databases/jdbc/
  datasource:
    url: jdbc:tc:postgresql:12:///postgres-api

