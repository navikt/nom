app:
  kafka:
    ressurs:
      stateTopic: org.nom.intern-ressurs-state
    orgEnhet:
      stateTopic: org.nom.intern-orgenhet-state
  clients:
    nom-paarorende:
      base-url: http://localhost:${wiremock.server.port}
      max-attempts: 3
      backoff-duration-millis: 2000
    nom-proxy:
      base-url: http://localhost:${wiremock.server.port}
    nik:
      base-url: http://localhost:${wiremock.server.port}
    pdl:
      tema: GEN
      base-url: http://localhost:${wiremock.server.port}
    microsoft-graph:
      base-url: http://localhost:${wiremock.server.port}
      max-attempts: 1
      groups:
        nom-delegert: "42d11885-1e29-4fc4-9eed-1b339c2c8e36"
        nom-leder: "e9cd9267-9baf-4078-abb8-7251c4313d32"
    nom-remedy-integrasjon:
      base-url: http://localhost:${wiremock.server.port}
    main-manager:
      base-url: http://localhost:${wiremock.server.port}
    dvh-ords:
      base-url: http://localhost:${wiremock.server.port}
  granted-authorities:
    clients:
      mutateRessursClient:
        client-id: mutateRessursClient
        scopes: ["MUTATE_RESSURS"]
      queryPersonClient:
        client-id: queryPersonClient
        scopes: ["QUERY_PERSON"]
      teamcatClient:
        client-id: teamcatClient
        scopes: ["TEAMCAT"]
      nomUiClient:
        client-id: nomUiClient
        scopes: ["QUERY_PERSON", "NOM_UI_APP"]
      nomRemedyIntegrasjonClient:
        client-id: nomRemedyIntegrasjonClient
        scopes: ["NOM_REMEDY_INTEGRASJON_APP"]
      dolly:
        client-id: dollyClient
        scopes: ["MUTATE_RESSURS", "DOLLY"]
    groups:
      nomWriteGroup:
        group-id: nomWriteGroup
        scopes: ["MUTATE_RESSURS"]
      nomAdminGroup:
        group-id: nomAdminGroup
        scopes: ["MUTATE_RESSURS", "ADMIN"]
      readOnlyGroup:
        group-id: readOnlyGroup
        scopes: ["READONLY"]
      nom-write-utl-konsulent:
        group-id: nomWriteUtlKonsulentGroup
        scopes: ["NOM_WRITE_UTL_KONSULENT", "MUTATE_RESSURS"]
      nom-write-vikafossen:
        group-id: nomWriteVikafossenGroup
        scopes: ["NOM_WRITE_VIKAFOSSEN", "MUTATE_RESSURS"]
      nom-write-robot:
        group-id: nomWriteRobotGroup
        scopes: ["NOM_WRITE_ROBOT", "MUTATE_RESSURS"]
  email:
    servicetorget-email: ${SERVICETORGET_EPOST_ADDR}
  orgenhet:
    nav-id: dummyNavId
    helfo-id: dummyHelfoId
    skatt-id: dummySkattId
    riksrevisjonen-id: dummyRiksrevId
    vikafossen-id: dummyVikafossenId
    linjeenhetene: linje-enhet,en-annen-linjeenhet
  dolly-ressurs:
    fysisk-brukersted-nr: dummyDollyFysiskBrukerstedNr
    orgenhet-id: dummyDollyOrgenhetId
  google-storage-bucket-name:
    missing-ot: none
      
