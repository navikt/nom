query {
    search(term: "forna") {
        __typename
        ... on Ressurs {
            navIdent
            personIdent
            visningsnavn
            fornavn
            etternavn
        }
        __typename
        ... on OrgEnhet {
            agressoId
            navn
            gyldigFom
            gyldigTom
            type {
                kode
                navn
            }
        }
    }
}