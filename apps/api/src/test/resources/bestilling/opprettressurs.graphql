mutation opprettRessurs($requestSetId: ID, $aktivering: Bestillingsaktiving) {
    opprettRessurs(request: {metadata: {requestSetId: $requestSetId, aktivering: $aktivering} personIdent: "12312312312", visningsnavn: "Navn Navnesen"}) {
        nomId
        navIdent
        bestilling {
            requestId
            requestSetId
        }
    }
}