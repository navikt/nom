mutation opprettRessurs($bestillingSetId: ID, $aktivering: Bestillingsaktiving) {
    opprettRessurs(request: {metadata: {bestillingSetId: $bestillingSetId, aktivering: $aktivering} personIdent: "12312312312", visningsnavn: "Navn Navnesen"}) {
        nomId
        navIdent
        bestilling {
            bestillingId
            bestillingSetId
        }
    }
}