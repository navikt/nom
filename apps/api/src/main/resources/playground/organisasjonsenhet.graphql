# Henter alle organisasjonsenheter
query HentAlleOrganisasjonsenheter {
    organisasjonsenhet {
        agressoId
        navn
        gyldigFom
        gyldigTom
    }
}

# Henter organisasjonsenhet med gitt id:
query HentOrganisasjonsenhetMedId {
    organisasjonsenhet(where: {agressoId: "test"}) {
        agressoId
        navn
        gyldigFom
        gyldigTom
    }
}

# Henter organisasjonsenhet med organiseringer:
query HentOrganisasjonsenhetOgOrganisering {
    organisasjonsenhet(where: {agressoId: "test"}) {
        agressoId
        navn
        gyldigFom
        gyldigTom
        organiseringer{
            retning
            organisasjonsenhet{
                agressoId
                navn
                gyldigFom
                gyldigTom
                organiseringer{
                    retning
                    organisasjonsenhet{
                        agressoId
                        navn
                    }
                }
            }
            gyldigFom
            gyldigTom
        }
        leder{
            ressurs{
                navIdent
                personIdent
            }
        }
    }
}

# Henter organisasjonsenhet med leder:
query HentOrganisasjonsenhetOgLeder {
    organisasjonsenhet(where: {agressoId: "test"}) {
        agressoId
        navn
        gyldigFom
        gyldigTom
        leder{
            ressurs{
                navIdent
                personIdent
            }
        }
    }
}

query HentAlleOrganisasjonsenhetOgKoblinger {
    organisasjonsenhet {
        agressoId
        navn
        gyldigFom
        gyldigTom
        koblinger{
            ressurs{
                navIdent
                personIdent
            }
            gyldigFom
            gyldigTom
        }
    }
}
