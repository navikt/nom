# Henter alle organisasjonsenheter
query HentAlleOrganisasjonsenheter {
    organisasjonsenheter {
        id
        orgNiv
        organisasjonsenhet{
            orgNiv
            agressoId
            navn
        }
        code
    }
}

# Henter organisasjonsenhet med gitt id:
query HentOrganisasjonsenhetMedId($agressoId: String!, $orgNiv: String!) {
    organisasjonsenhet(where: {agressoId: $agressoId, orgNiv: $orgNiv}) {
        agressoId
        navn
        gyldigFom
        gyldigTom
    }
}

# Henter organisasjonsenhet med organiseringer:
query HentOrganisasjonsenhetOgOrganisering($agressoId: String!, $orgNiv: String!) {
    organisasjonsenhet(where: {agressoId: $agressoId, orgNiv: $orgNiv}) {
        agressoId
        navn
        gyldigFom
        gyldigTom
        organiseringer{
            retning
            organisasjonsenhet{
                agressoId
                navn
                gyldigFom
                gyldigTom
                organiseringer{
                    retning
                    organisasjonsenhet{
                        agressoId
                        navn
                    }
                }
            }
            gyldigFom
            gyldigTom
        }
        leder{
            ressurs{
                navIdent
                personIdent
            }
        }
    }
}

# Henter organisasjonsenhet med leder:
query HentOrganisasjonsenhetOgLeder($agressoId: String!, $orgNiv: String!) {
    organisasjonsenhet(where: {agressoId: $agressoId, orgNiv: $orgNiv}) {
        agressoId
        navn
        gyldigFom
        gyldigTom
        leder{
            ressurs{
                navIdent
                personIdent
            }
        }
    }
}

query HentAlleOrganisasjonsenhetOgKoblinger {
    organisasjonsenhet {
        agressoId
        navn
        gyldigFom
        gyldigTom
        koblinger{
            ressurs{
                navIdent
                personIdent
            }
            gyldigFom
            gyldigTom
        }
    }
}
