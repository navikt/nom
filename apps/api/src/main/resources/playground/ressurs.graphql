# Query som henter alle ressurser:
query HentAlleRessurser{
    ressurser {
        id
        ressurs{
            navIdent
            personIdent
        }
        code
    }
}

# Query som henter ressurser med navIdent som parameter:
query HentRessursMedNavIdent($navIdent: String!) {
    ressurs(where: {navIdent: $navIdent}) {
        navIdent
        personIdent
        person{
            navn{
                fornavn
                mellomnavn
                etternavn
            }
        }
    }
}

# Query som henter ressurser med personIdent som parameter:
query HentRessursMedPersonIdent($personIdent: String!){
    ressurs(where: {personIdent: $personIdent}) {
        navIdent
        personIdent
        person{
            navn{
                fornavn
                mellomnavn
                etternavn
            }
        }
    }
}

query HentRessursFullpakke($navIdent: String!) {
    ressurs(where: {navIdent: $navIdent}) {
        nomId
        navIdent
        personIdent
        koblinger{
            organisasjonsenhet{
                agressoId
                navn
                gyldigFom
                gyldigTom
                organiseringer{
                    retning
                    organisasjonsenhet{
                        agressoId
                        navn
                        koblinger{
                            ressurs{
                                navIdent
                                personIdent
                            }
                        }
                    }
                }
            }
            gyldigFom
            gyldigTom
        }
        lederFor{
            organisasjonsenhet{
                agressoId
                orgNiv
            }
        }
        ledere{
            ressurs{
                navIdent
            }
        }
        person{
            navn{
                fornavn
                mellomnavn
                etternavn
            }
        }
        epost
        visningsNavn
        fornavn
        etternavn
    }
}

mutation opprettRessurs($personIdent: String!) {
    opprettRessurs(personIdent: $personIdent) {
        nomId
        navIdent
        personIdent
        person{
            navn{
                fornavn
                mellomnavn
                etternavn
            }
        }
    }
}