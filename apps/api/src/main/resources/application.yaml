app:
  name: ${NAIS_APP_NAME:nom-api}
  kafka:
    authorize:
      eventsource-topic: org.nom.nom-authorize-eventsource
    ressurs:
      eventsourceTopic: org.nom.ressurs-eventsource
      nomMasteredRessursTopic: org.nom.nom-mastered-ressurs
    orgEnhet:
      eventsourceTopic: org.nom.orgenhet-eventsource
    orgtilknytning:
      eventsource-topic: org.nom.orgtilknytning-eventsource
      dvhLastResultTopic: org.nom.intern-dvh-last-result
    organisering:
      eventsourceTopic: org.nom.organisering-eventsource
  clients:
    nom-proxy:
      base-url: ${NOM_PROXY_BASEURL}
    nik:
      base-url: ${NIK_BASEURL}
      aad-scope: ${NIK_API_SCOPE}
    pdl:
      tema: GEN
      behandlingsnummer: B348
      base-url: ${PDL_BASEURL}
      aad-scope: ${PDL_API_SCOPE}
    microsoft-graph:
      base-url: https://graph.microsoft.com/v1.0
      max-attempts: 3
      backoff-duration-millis: 2000
      send-email: true
      groups:
        nom-delegert: ${NOM_DELEGERT_GROUPID:nomDelegertGroup}
        nom-leder: ${NOM_LEDER_GROUPID:nomLederGroup}
    
    nom-remedy-integrasjon:
      base-url: ${NOM_REMEDY_INTEGRASJON_BASEURL}
    dvh-ords:
      client_-id: ${DVH_ORDS_CLIENT_ID:dvh_client_id}
      client-secret: ${DVH_ORDS_CLIENT_SECRET:dvh_client_secret}
      token-uri: https://dvh.adeo.no/ords/dvh/oauth/token
      base-url: https://dvh.adeo.no/ords/dvh
      enhet-path: /dvh_nom/nom_ords_hrorg_orgenhet.json
      ressurs-stillinger-path: /dvh_nom/nom_ords_ressurs_stillinger.json
      eksterne-ressurser-path: /dvh_nom/nom_ords_eksterne.json
      kommunale-ressurser-path: /dvh_nom/nom_ords_kommunale.json
      ansatte-buckets-path: /dvh_nom/nom_ords_ansatte_buckets.json
      tlf-path: /dvh_nom/nom_ords_tlf.json
      org-hierarki-path: /dvh_nom/nom_ords_hrorg_hierarki.json
      nom-ressurser-path: /dvh_nom/nom_ords_ansatte_historikk.json


  manuelle-ressurser-og-ledere:
    enabled: false

nom.libs.state.ressurs.enabled: true
nom.libs.state.orgenhet.enabled: true
nom.libs.state.orgtilknytning.enabled: true
nom.libs.state.organisering.enabled: true
nom.libs.state.mastered-ressurs.enabled: true
nom.libs.state.delegert-leder.enabled: true

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}
  groups:
    nomDelegert: ${NOM_DELEGERT_GROUPID:nomDelegertGroup} # Den nye 0000-GA-NOM-WRITE-DELEGERT
    nomLeder: ${NOM_LEDER_GROUPID:nomLederGroup}          # Den nye 0000-GA-NOM-WRITE-LEDER
    nomWrite: ${NOM_WRITE_GROUPID:nomWriteGroup}      # Gamle nom-write gruppen
    nomAdmin: ${NOM_ADMIN_GROUPID:nomAdminGroup}      #gamle nom-admin gruppen
    nomPilot: ${NOM_PILOT_GROUPID:nomPilotGroup}      #gamle nom-admin gruppen
server:
  shutdown: graceful

spring:
  application:
    name: "nom-api"
  main:
    banner-mode: off
    cloud-platform: kubernetes
  datasource:
    url: ${DATABASE_JDBC_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
      client:
        registration:
          email:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - https://graph.microsoft.com/.default
          nom-proxy:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_PROXY_API_SCOPE}
          nik:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NIK_API_SCOPE}
          pdl:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${PDL_API_SCOPE}
          nom-remedy-integrasjon:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_REMEDY_INTEGRASJON_API_SCOPE}
          dvh-ords:
            provider: dvh-ords
            client-id:  ${DVH_ORDS_CLIENT_ID:dvh_client_id}
            client-secret:  ${DVH_ORDS_CLIENT_SECRET:dvh_client_secret}
            authorization-grant-type: client_credentials
        provider:
          azure:
            issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          dvh-ords:
            token-uri: ${app.clients.dvh-ords.token-uri}
  graphql:
    graphiql:
      enabled: true # Enable playground
    cors:
      allowed-origins: "*" # Allow all origins
    schema:
      printer:
        enabled: true #
  kafka:
    security.protocol: SSL
    ssl:
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    bootstrap-servers: ${KAFKA_BROKERS}
    admin:
      client-id: ${HOSTNAME}
    consumer:
      max-poll-records: 1000
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: ${HOSTNAME}
    listener:
      missing-topics-fatal: true
    client-id: ${HOSTNAME}

management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus,health
  endpoint:
    health:
      group:
        readiness:
          include: "readinessState,customCheck"
      show-details: always
      probes:
        enabled: true

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}

springdoc:
  writer-with-order-by-keys: true

