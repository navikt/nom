app:
  appName: ${NAIS_APP_NAME:nom-api}
  proxy:
    baseUrl: ${NOM_PROXY_BASEURL}
    enhetPath: /proxy/dvh/json/Hr/NOM3/NOM_HRORG_ORGENHET
    aadClientId: api://${NOM_PROXY_CLIENT_ID}/.default
  pdl:
    tema: GEN
    baseUrl: ${PDL_BASEURL}
    aadClientId: api://${PDL_CLIENT_ID}/.default
  graphql:
    preauth:
      query:
        person: ${GRAPHQL_PREAUTH_QUERY_PERSON}
      mutation:
        ressurs: ${GRAPHQL_PREAUTH_MUTATION_RESSURS}

nom:
  libs:
    utils:
      common:
        kafka:
          load-properties: false
        app:
          load-properties: true

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}

graphql:
  playground:
    tabs:
      - name: Enhet
        query: classpath:playground/organisasjonsenhet.graphql
      - name: Ressurs
        query: classpath:playground/ressurs.graphql
      - name: Person
        query: classpath:playground/person.graphql
    enabled: true
  voyager:
    enabled: true
  servlet:
    mapping: /graphql
    enabled: true
    corsEnabled: true
    cors:
      allowed-origins: "*"
    actuator-metrics: true
    tracing-enabled: false

# Av en eller annen grunn, så vil ikke dette feltet være satt ved lasting i GCP, fungerer on-prem så får se litt mer på det senere, men spring boot oppgradering burde gå først siden de endrer litt på lasting av properties.
management.endpoints.web.exposure.include: health,prometheus

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          accepted-audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}