app:
  name: ${NAIS_APP_NAME:nom-api}
  kafka:
    authorize:
      eventsource-topic: org.nom.nom-authorize-eventsource
    ressurs:
      eventsourceTopic: org.nom.ressurs-eventsource
      nomMasteredRessursTopic: org.nom.nom-mastered-ressurs
    orgEnhet:
      eventsourceTopic: org.nom.orgenhet-eventsource
    orgEnhetLeder:
      eventsource-topic: org.nom.orgenhet-leder-eventsource
    orgtilknytning:
      eventsource-topic: org.nom.orgtilknytning-eventsource
      dvhLastResultTopic: org.nom.intern-dvh-last-result
    organisering:
      eventsourceTopic: org.nom.organisering-eventsource
      stateTopic: org.nom.intern-organisering-state
  clients:
    nom-paarorende:
      base-url: ${PAARORENDE_BASEURL}
      max-attempts: 3
      backoff-duration-millis: 2000
      aad-scope: ${PAARORENDE_API_SCOPE}
    nom-proxy:
      base-url: ${NOM_PROXY_BASEURL}
    nik:
      base-url: ${NIK_BASEURL}
      aad-scope: ${NIK_API_SCOPE}
    pdl:
      tema: GEN
      behandlingsnummer: B348
      base-url: ${PDL_BASEURL}
      aad-scope: ${PDL_API_SCOPE}
    microsoft-graph:
      base-url: https://graph.microsoft.com/v1.0
      max-attempts: 3
      backoff-duration-millis: 2000
      send-email: true
      groups:
        nom-delegert: ${NOM_DELEGERT_GROUPID:nomDelegertGroup}
        nom-leder: ${NOM_LEDER_GROUPID:nomLederGroup}
    nom-remedy-integrasjon:
      base-url: ${NOM_REMEDY_INTEGRASJON_BASEURL}
    main-manager:
      base-url: ${MAIN_MANAGER_BASEURL}
      username: ${MAIN_MANAGER_USERNAME}
      password: ${MAIN_MANAGER_PASSWORD}
      grant-type: password
      token-path: /restapi/token
    dvh-ords:
      client_-id: ${DVH_ORDS_CLIENT_ID:dvh_client_id}
      client-secret: ${DVH_ORDS_CLIENT_SECRET:dvh_client_secret}
      token-uri: https://dvh.adeo.no/ords/dvh/oauth/token
      base-url: https://dvh.adeo.no/ords/dvh
      enhet-path: /dvh_nom/nom_ords_hrorg_orgenhet.json
      ressurs-stillinger-path: /dvh_nom/nom_ords_ressurs_stillinger.json
      eksterne-ressurser-path: /dvh_nom/nom_ords_eksterne.json
      ansatte-buckets-path: /dvh_nom/nom_ords_ansatte_buckets.json
      tlf-path: /dvh_nom/nom_ords_tlf.json
      org-hierarki-path: /dvh_nom/nom_ords_hrorg_hierarki.json
      nom-ressurser-path: /dvh_nom/nom_ords_ansatte_historikk.json
    slack:
      token: ${SLACK_TOKEN}
      channel-id-primary: "G01F99D2AHX"
      channel-id-secondary: "C040RV7KCH5"
    org-enhet-kostnadssted-mapping:
      aad-scope: ${ORGENHET_KOSTNADSSTED_MAPPING_API_SCOPE}
      base-url: ${ORGENHET_KOSTNADSSTED_MAPPING_API_URL}
  epost-varsel-for-enhet-navnendring:
    max-evt-alder-dager-for-varsel: 60
  email:
    servicetorget-email: ${SERVICETORGET_EPOST_ADDR}
  dolly-ressurs:
    fysisk-brukersted-nr: none
    orgenhet-id: none
  google-storage-bucket-name:
    ressurs-endringer: no-nav-nom-dev-ressurs-syntetisering-storage-bucket

nom.libs.state.ressurs.enabled: true
nom.libs.state.orgenhet.enabled: true
nom.libs.state.orgtilknytning.enabled: true
nom.libs.state.organisering.enabled: true
nom.libs.state.mastered-ressurs.enabled: true
nom.libs.state.delegert-leder.enabled: true
nom.libs.state.orgenhet-leder.enabled: true

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}
  groups:
    nomDelegert: ${NOM_DELEGERT_GROUPID:nomDelegertGroup} # Den nye 0000-GA-NOM-WRITE-DELEGERT
    nomLeder: ${NOM_LEDER_GROUPID:nomLederGroup}          # Den nye 0000-GA-NOM-WRITE-LEDER
    nomWrite: ${NOM_WRITE_GROUPID:nomWriteGroup}      # Gamle nom-write gruppen
    nomAdmin: ${NOM_ADMIN_GROUPID:nomAdminGroup}      #gamle nom-admin gruppen
    nomPilot: ${NOM_PILOT_GROUPID:nomPilotGroup}      #gamle nom-pilot gruppen
    nomWriteUtlKonsulent: ${NOM_WRITE_UTL_KONSULENT_GROUPID:nomWriteUtlKonsulentGroup}  # 0000-CA-NOM-Write-Utl-Konsulent
    nomWriteVikafossen: ${NOM_WRITE_VIKAFOSSEN_GROUPID:nomWriteVikafossenGroup}         # 0000-CA-NOM-Write-Vikafossen
    nomWriteRobot: ${NOM_WRITE_ROBOT_GROUPID:nomWriteRobotGroup}                        # 0000-CA-NOM-Write-Robot
    readOnly: ${READONLY_GROUPID:readOnlyGroup}          # 0000-CA-NOM-ADMIN-Lesetilgang
    extendedReadOnly: ${EXTENDED_READONLY_GROUPID:extendedReadOnlyGroup} # 0000-CA-NOM-ADMIN-Utvidet-Lesetilgang
    kostnadsstedsAdmin: ${KOSTNADSSTEDSADMIN_GROUPID:kostnadsstedsadminGroup} # orgenhet-kostnadssted-mapping-admin
    nomWriteExternalFundsRecipient: ${NOM_WRITE_EXTERNAL_FUNDS_RECIPIENT_GROUPID:nomWriteExternalFundsRecipient} # 0000-CA-NomApi_Opprette_ekstern_utbetalings_mottaker
server:
  shutdown: graceful

spring:
  application:
    name: "nom-api"
  main:
    banner-mode: off
    cloud-platform: kubernetes
  datasource:
    url: ${DATABASE_JDBC_URL}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
      client:
        registration:
          nom-paarorende:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${PAARORENDE_API_SCOPE}
          email:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - https://graph.microsoft.com/.default
          nom-proxy:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_PROXY_API_SCOPE}
          nik:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NIK_API_SCOPE}
          pdl:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${PDL_API_SCOPE}
          nom-remedy-integrasjon:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_REMEDY_INTEGRASJON_API_SCOPE}
          orgenhet-kostnadssted-mapping:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${ORGENHET_KOSTNADSSTED_MAPPING_API_SCOPE}
          dvh-ords:
            provider: dvh-ords
            client-id:  ${DVH_ORDS_CLIENT_ID:dvh_client_id}
            client-secret:  ${DVH_ORDS_CLIENT_SECRET:dvh_client_secret}
            authorization-grant-type: client_credentials
        provider:
          azure:
            issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          dvh-ords:
            token-uri: ${app.clients.dvh-ords.token-uri}
  graphql:
    graphiql:
      enabled: true # Enable playground
    cors:
      allowed-origins: "*" # Allow all origins
    schema:
      printer:
        enabled: true #
  kafka:
    security.protocol: SSL
    ssl:
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    bootstrap-servers: ${KAFKA_BROKERS}
    admin:
      client-id: ${HOSTNAME}
    consumer:
      max-poll-records: 1000
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: ${HOSTNAME}
    listener:
      missing-topics-fatal: true
    client-id: ${HOSTNAME}
  http:
    codecs:
      max-in-memory-size: 400MB
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
    mapper:
      sort-properties-alphabetically: false

management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus,health
  endpoint:
    health:
      group:
        readiness:
          include: "readinessState,customCheck"
      show-details: always
      probes:
        enabled: true

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}

springdoc:
  writer-with-order-by-keys: true

server.tomcat.mbeanregistry.enabled: true