app:
  appName: ${NAIS_APP_NAME:nom-api}
  proxy:
    baseUrl: ${NOM_PROXY_BASEURL}
    enhetPath: /proxy/dvh/json/Hr/NOM3/NOM_HRORG_ORGENHET
    aadClientId: api://${NOM_PROXY_CLIENT_ID}/.default
  nik:
    baseUrl: ${NIK_BASEURL}
    aadClientId: api://${NIK_CLIENT_ID}/.default
  pdl:
    tema: GEN
    baseUrl: ${PDL_BASEURL}
    aadClientId: api://${PDL_CLIENT_ID}/.default
  graphql:
    preauth:
      query:
        person:
          client-id: ${GRAPHQL_PREAUTH_QUERY_PERSON:NO_ONE}
          scopes: QUERY_PERSON
      mutation:
        ressurs:
          client-id: ${GRAPHQL_PREAUTH_MUTATION_RESSURS:NO_ONE}
          scopes: MUTATE_RESSURS

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}
  groups:
    nomWrite: ${NOM_WRITE_GROUPID:nomWriteGroup}

server:
  shutdown: graceful

spring:
  application:
    name: "nom-api"
  main:
    banner-mode: off
    cloud-platform: kubernetes
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          accepted-audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
  graphql:
    graphiql:
      enabled: true # Enable playground
    cors:
      allowed-origins: "*" # Allow all origins
    schema:
      printer:
        enabled: true #

management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus,health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

unleash:
  endpoint:
    url: https://unleash.nais.io/api
