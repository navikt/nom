app:
  dvh:
    topic: nom.dvhsource-v1
    baseUrl: ${DVH_STILLINGER_URL}

aad:
  issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
  clientId: ${AZURE_APP_CLIENT_ID}
  clientAssertionType: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
  jwk: ${AZURE_APP_JWK}
  grantType: client_credentials
  dvhScope: ${DVH_AAD_SCOPE}/.default

graphql:
  playground:
    tabs:
      - name: HentEnhet
        query: classpath:playground/organisasjonsenhet.graphql
      - name: HentRessurs
        query: classpath:playground/ressurs.graphql
  servlet:
    mapping: /graphql
    enabled: true
    corsEnabled: true
    cors:
      allowed-origins: "*"


spring.kafka.consumer.max-poll-records: 1000

# Av en eller annen grunn, så vil ikke dette feltet være satt ved lasting i GCP, fungerer on-prem så får se litt mer på det senere, men spring boot oppgradering burde gå først siden de endrer litt på lasting av properties.
management.endpoints.web.exposure.include: health,prometheus

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${aad.issuerBaseUrl}/v2.0
          accepted-audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}