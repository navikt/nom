app:
  name: ${NAIS_APP_NAME:nom-api}
  kafka:
    ressurs:
      stateTopic: org.nom.intern-ressurs-state
      eventsourceTopic: org.nom.ressurs-eventsource
    orgEnhet:
      stateTopic: org.nom.intern-orgenhet-state
      eventsourceTopic: org.nom.orgenhet-eventsource
    orgtilknytning:
      state-topic: org.nom.intern-orgtilknytning-state
      eventsource-topic: org.nom.orgtilknytning-eventsource
  clients:
    nom-proxy:
      base-url: ${NOM_PROXY_BASEURL}
      enhet-path: /proxy/dvh/json/Hr/NOM3/NOM_HRORG_ORGENHET
      orgtilknytning-path: /proxy/dvh/json/Hr/NOM2/stilling2nom
      ressurs-stillinger-path: /proxy/dvh/json/Hr/Nom/NOM_RESSURS_STILLINGER
    nik:
      base-url: ${NIK_BASEURL}
      aad-scope: ${NIK_API_SCOPE}
    pdl:
      tema: GEN
      behandlingsnummer: B348
      base-url: ${PDL_BASEURL}
    email:
      url: https://graph.microsoft.com/v1.0/users/ikke.svar.nom@nav.no/sendMail
      is-enabled: false
      max-attempts: 3
      backoff-duration-millis: 2000
  dvh-load:
    nom-ressurser-stillinger-respons-navn: "NOM_RESSURS_STILLINGERResponse"

authentication:
  aad:
    issuerBaseUrl: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}
    clientId: ${AZURE_APP_CLIENT_ID}
    jwk: ${AZURE_APP_JWK}
  groups:
    nomWrite: ${NOM_WRITE_GROUPID:nomWriteGroup}
    nomAdmin: ${NOM_ADMIN_GROUPID:nomAdminGroup}

server:
  shutdown: graceful

spring:
  application:
    name: "nom-api"
  main:
    banner-mode: off
    cloud-platform: kubernetes
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
          audiences: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
      client:
        registration:
          email:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - https://graph.microsoft.com/.default
          nom-proxy:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NOM_PROXY_API_SCOPE}
          nik:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${NIK_API_SCOPE}
          pdl:
            provider: azure
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${PDL_API_SCOPE}
        provider:
          azure:
            issuer-uri: ${authentication.aad.issuerBaseUrl}/v2.0
  graphql:
    graphiql:
      enabled: true # Enable playground
    cors:
      allowed-origins: "*" # Allow all origins
    schema:
      printer:
        enabled: true #
  kafka:
    security.protocol: SSL
    ssl:
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    bootstrap-servers: ${KAFKA_BROKERS}
    admin:
      client-id: ${HOSTNAME}
    consumer:
      max-poll-records: 1000
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: ${HOSTNAME}
    listener:
      missing-topics-fatal: true
    client-id: ${HOSTNAME}

management:
  metrics:
    tags:
      app: ${app.name}
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: prometheus,health
  endpoint:
    health:
      group:
        readiness:
          include: "readinessState,customCheck"
      show-details: always
      probes:
        enabled: true

unleash:
  endpoint:
    url: ${UNLEASH_SERVER_API_URL}/api
  api-key: ${UNLEASH_SERVER_API_TOKEN}

