
query hentOrganiasjonsEnheterMedHierarki($aid: String, $oniv: String) {
  organisasjonsenhet(where: {agressoId: $aid, orgNiv: $oniv}) {
    agressoId
    orgNiv
    navn
    gyldigFom
    gyldigTom
    underenheter: organiseringer(retning: under) {
      organisasjonsenhet{
        navn
        agressoId
        orgNiv
        type {
          kode
          navn
        }
      }
    }
    overenheter: organiseringer(retning: over) {
      retning
      organisasjonsenhet{
        navn
        agressoId
        orgNiv
        organiseringer(retning: over) {
          retning
          organisasjonsenhet{
            navn
            agressoId
            orgNiv
            organiseringer(retning: over) {
              retning
              organisasjonsenhet{
                navn
                agressoId
                orgNiv
                organiseringer(retning: over) {
                  retning
                  organisasjonsenhet{
                    navn
                    agressoId
                    orgNiv
                    organiseringer(retning: over) {
                      retning
                      organisasjonsenhet{
                        navn
                        agressoId
                        orgNiv
                        organiseringer(retning: over) {
                          retning
                          organisasjonsenhet{
                            navn
                            agressoId
                            orgNiv
                            organiseringer(retning: over) {
                              retning
                              organisasjonsenhet{
                                navn
                                agressoId
                                orgNiv
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
    leder{
      ressurs{
        navIdent
        personIdent
        person {
          navn {
            fornavn
            mellomnavn
            etternavn
          }
        }
      }
    }
    koblinger {
      ressurs {
        navIdent
        personIdent
        person {
          navn {
            fornavn
            mellomnavn
            etternavn
          }
        }
      }
    }
    type {
      kode
      navn
    }
  }
}

query HentAlleRessurser{
    ressurser {
      ressurs{
        navIdent
      }
    }
}

query hentRessurs($navIdent: String) {
  ressurs(where: {navIdent: $navIdent}){
    fornavn
    etternavn
  }
}

query HentRessursMedNavIdent($navIdent: String) {
    ressurs(where: {navIdent: $navIdent}) {
        navIdent
        personIdent
        fornavn
        etternavn
    		epost
        visningsNavn
    		ledere{
            ressurs{
                navIdent
                visningsNavn
            }
        }
        koblinger{
            organisasjonsenhet{
                agressoId
                navn
            }
        }
    }
}

query HentAlleOrganisasjonsenheter {
  organisasjonsenheter {
    id
    orgNiv
    organisasjonsenhet{
      orgNiv
      agressoId
      navn
      leder{
          ressurs{
              navIdent
              personIdent
          }
      }
    }
    code
  }
}

query hentPerson($personIdent: String!){
    person(where: {personIdent: $personIdent}) {
        navIdent
        personIdent
        person{
            navn{
                fornavn
                mellomnavn
                etternavn
            }
        }
    }
}

query searchRessurs($term: String!) {
    search(term: $term) {
        ...on Ressurs {
          navIdent
          visningsNavn
        }
    }
}