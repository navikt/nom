query HentRessursMedNavident($navident: String) {
    ressurs(where: { navident: $navident }) {
        navident
        fornavn
        etternavn
        epost
        sektor
        visningsnavn
        sluttdato
        startdato
        telefon {
            beskrivelse
            nummer
            type
        }
        ledere {
            erDagligOppfolging
            ressurs {
                navident
                visningsnavn
                fornavn
                etternavn
                orgTilknytning {
                    orgEnhet {
                        navn
                        id
                    }
                }
            }
        }
        lederFor {
            orgEnhet {
                id
                navn
            }
        }
        orgTilknytning {
            gyldigFom
            gyldigTom
            erDagligOppfolging
            orgEnhet {
                navn
                id
                remedyEnhetId
                leder {
                    ressurs {
                        navident
                        fornavn
                        etternavn
                        visningsnavn
                    }
                }
            }
        }
    }
}

query hentPerson($personident: String!) {
    person(where: { personident: $personident }) {
        navident
        personident
        person {
            navn {
                fornavn
                mellomnavn
                etternavn
            }
        }
    }
}

fragment RessursStandalone on Ressurs {
    navident
    fornavn
    etternavn
    visningsnavn
    epost
    sektor
    telefon {
        beskrivelse
        nummer
        type
    }
    startdato
}

fragment RessursWithLeder on Ressurs {
    ...RessursStandalone
    ledere {
        ressurs {
            navident
        }
    }
}

fragment RessursWithKobling on Ressurs {
    ...RessursStandalone
    koblinger {
        organisasjonsenhet {
            id
            navn
        }
    }
}

fragment RessursWithLederAndKobling on Ressurs {
    ...RessursWithLeder
    ...RessursWithKobling
}

fragment OrgenhetStandaloneWithLeder on OrgEnhet {
    id
    navn
    gyldigFom
    gyldigTom
    leder {
        ressurs {
            ...RessursStandalone
            koblinger {
                organisasjonsenhet {
                    id
                    navn
                }
            }
        }
    }
}

query HentHierarki($id: String!) {
    enhet: orgEnhet(where: { id: $id }) {
        id
        remedyEnhetId
        navn
        gyldigFom
        gyldigTom
        type {
            kode
        }
        leder {
            ressurs {
                ...RessursStandalone
                orgTilknytning {
                    orgEnhet {
                        id
                        navn
                    }
                }
            }
        }
    }

    ressursKoblinger: organisasjonsenhet(
        where: { id: $id }
    ) {
        koblinger {
            gyldigFom
            gyldigTom
            ressurs {
                ...RessursStandalone
                ledere {
                    ressurs {
                        ...RessursStandalone
                    }
                }
            }
        }
    }

    enhetsKoblinger: organisasjonsenhet(
        where: { id: $id }
    ) {
        underenheter: organiseringer(retning: under) {
            organisasjonsenhet {
                ...OrgenhetStandaloneWithLeder
            }
        }

        overenheter: organiseringer(retning: over) {
            organisasjonsenhet {
                ...OrgenhetStandaloneWithLeder
                organiseringer(retning: over) {
                    organisasjonsenhet {
                        ...OrgenhetStandaloneWithLeder
                        organiseringer(retning: over) {
                            organisasjonsenhet {
                                ...OrgenhetStandaloneWithLeder
                                organiseringer(retning: over) {
                                    organisasjonsenhet {
                                        ...OrgenhetStandaloneWithLeder
                                        organiseringer(retning: over) {
                                            organisasjonsenhet {
                                                ...OrgenhetStandaloneWithLeder
                                                organiseringer(retning: over) {
                                                    organisasjonsenhet {
                                                        ...OrgenhetStandaloneWithLeder
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

query HentRessurs($navident: String) {
    ressurs(where: { navident: $navident }) {
        ...RessursWithKobling
        sektor
        ledere {
            ressurs {
                ...RessursStandalone
                orgTilknytning {
                    orgEnhet {
                        navn
                        id
                    }
                }
            }
        }
    }
}

query SearchOrgenheter($term: String!, $filter: OrgEnhetSearchFilter) {
    searchOrgEnhet(term: $term, filter: $filter) {
        id,
        navn
        remedyEnhetId
        leder {
            ressurs {
                visningsnavn
            }
        }
    }
}

fragment OrgEnhetAdmin on OrgEnhet {
    id
    agressoId
    orgNiv
    agressoOrgenhetType
    navn
    gyldigFom
    gyldigTom
    nomNivaa
    orgEnhetsType
    remedyEnhetId
    leder {
        ressurs {
            navident
        }
    }
}

query GetAllOrgenheterAdmin {
    orgEnheter(where: {}) {
        nomId
        orgEnhet {
            ...OrgEnhetAdmin
        }
    }
}

query GetOrgEnhet($id: String!) {
    orgEnhet(where: {id: $id}) {
        id
        navn
        remedyEnhetId
        leder {
            ressurs {
                navident
                visningsnavn
            }
        }
    }
}