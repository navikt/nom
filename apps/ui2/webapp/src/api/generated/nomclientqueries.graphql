query hentOrganiasjonsEnheterMedHierarki($aid: String, $oniv: String) {
  organisasjonsenhet(where: { agressoId: $aid, orgNiv: $oniv }) {
    agressoId
    orgNiv
    navn
    gyldigFom
    gyldigTom
    underenheter: organiseringer(retning: under) {
      organisasjonsenhet {
        navn
        agressoId
        orgNiv
        type {
          kode
          navn
        }
      }
    }
    overenheter: organiseringer(retning: over) {
      retning
      organisasjonsenhet {
        navn
        agressoId
        orgNiv
        organiseringer(retning: over) {
          retning
          organisasjonsenhet {
            navn
            agressoId
            orgNiv
            organiseringer(retning: over) {
              retning
              organisasjonsenhet {
                navn
                agressoId
                orgNiv
                organiseringer(retning: over) {
                  retning
                  organisasjonsenhet {
                    navn
                    agressoId
                    orgNiv
                    organiseringer(retning: over) {
                      retning
                      organisasjonsenhet {
                        navn
                        agressoId
                        orgNiv
                        organiseringer(retning: over) {
                          retning
                          organisasjonsenhet {
                            navn
                            agressoId
                            orgNiv
                            organiseringer(retning: over) {
                              retning
                              organisasjonsenhet {
                                navn
                                agressoId
                                orgNiv
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
    leder {
      ressurs {
        navident
        personident
        person {
          navn {
            fornavn
            mellomnavn
            etternavn
          }
        }
      }
    }
    koblinger {
      ressurs {
        navident
        personident
        person {
          navn {
            fornavn
            mellomnavn
            etternavn
          }
        }
      }
    }
    type {
      kode
      navn
    }
  }
}

query HentAlleRessurser {
  ressurser(where: {}) {
    ressurs {
      navident
    }
  }
}

query HentRessursMedNavident($navident: String) {
  ressurs(where: { navident: $navident }) {
    navident
    fornavn
    etternavn
    epost
    sektor
    visningsnavn
    telefon {
      beskrivelse
      nummer
      type
    }
    ledere {
      ressurs {
        navident
        visningsNavn
        fornavn
        etternavn
        orgTilknytning {
          orgEnhet {
            navn
            orgNiv
            agressoId
          }
        }
      }
    }
    orgTilknytning {
      orgEnhet {
        agressoId
        navn
        orgNiv
        leder {
          ressurs {
            navident
            fornavn
            etternavn
          }
        }
      }
    }
  }
}

query HentAlleOrganisasjonsenheter {
  organisasjonsenheter(where: {}) {
    id
    orgNiv
    organisasjonsenhet {
      orgNiv
      agressoId
      navn
      leder {
        ressurs {
          navident
          personident
        }
      }
    }
    code
  }
}

query hentPerson($personident: String!) {
  person(where: { personident: $personident }) {
    navident
    personident
    person {
      navn {
        fornavn
        mellomnavn
        etternavn
      }
    }
  }
}

query searchRessurs($term: String!) {
  search(term: $term) {
    ... on Ressurs {
      navident
      visningsnavn
    }
  }
}

query HentOrganisasjonsenhetOgOrganisering(
  $agressoId: String!
  $orgNiv: String!
) {
  organisasjonsenhet(where: { agressoId: $agressoId, orgNiv: $orgNiv }) {
    agressoId
    orgNiv
    navn
    gyldigFom
    gyldigTom
    organiseringer {
      retning
      organisasjonsenhet {
        agressoId
        orgNiv
        navn
        gyldigFom
        gyldigTom
      }
      gyldigFom
      gyldigTom
    }
    leder {
      ressurs {
        navident
        personident
      }
    }
  }
}

query HentOrganisasjonsenhetMedOverenhet(
  $agressoId: String!
  $orgNiv: String!
) {
  organisasjonsenhet(where: { agressoId: $agressoId, orgNiv: $orgNiv }) {
    organiseringer(retning: over) {
      organisasjonsenhet {
        navn
        agressoId
        orgNiv
        leder {
          ressurs {
            navident
          }
        }
      }
    }
    agressoId
    navn
    gyldigFom
    gyldigTom
  }
}

query HentOrganisasjonsEnheterHierarki($agressoId: String!, $orgNiv: String!) {
  organisasjonsenhet(where: { agressoId: $agressoId, orgNiv: $orgNiv }) {
    underenheter: organiseringer(retning: under) {
      organisasjonsenhet {
        navn
        agressoId
        orgNiv
        leder {
          ressurs {
            navident
            visningsNavn
            fornavn
            etternavn
            koblinger {
              organisasjonsenhet {
                agressoId
                orgNiv
                navn
              }
            }
          }
        }
      }
    }

    overenheter: organiseringer(retning: over) {
      organisasjonsenhet {
        navn
        agressoId
        orgNiv
        leder {
          ressurs {
            navident
            visningsNavn
            fornavn
            etternavn
          }
        }
        organiseringer(retning: over) {
          organisasjonsenhet {
            navn
            agressoId
            orgNiv
            leder {
              ressurs {
                navident
                visningsNavn
                fornavn
                etternavn
              }
            }
            organiseringer(retning: over) {
              organisasjonsenhet {
                navn
                agressoId
                orgNiv
                leder {
                  ressurs {
                    navident
                    visningsNavn
                    fornavn
                    etternavn
                  }
                }
                organiseringer(retning: over) {
                  organisasjonsenhet {
                    navn
                    agressoId
                    orgNiv
                    leder {
                      ressurs {
                        navident
                        visningsNavn
                        fornavn
                        etternavn
                      }
                    }
                    organiseringer(retning: over) {
                      organisasjonsenhet {
                        navn
                        agressoId
                        orgNiv
                        leder {
                          ressurs {
                            navident
                            visningsNavn
                            fornavn
                            etternavn
                          }
                        }
                        organiseringer(retning: over) {
                          organisasjonsenhet {
                            navn
                            agressoId
                            orgNiv
                            leder {
                              ressurs {
                                navident
                                visningsNavn
                                fornavn
                                etternavn
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
    agressoId
    orgNiv
    navn
    gyldigFom
    gyldigTom
    leder {
      ressurs {
        navident
        visningsNavn
        fornavn
        etternavn
        koblinger {
          organisasjonsenhet {
            agressoId
            orgNiv
            navn
          }
        }
      }
    }
    koblinger {
      ressurs {
        navident
        personident
        visningsNavn
        fornavn
        etternavn
        ledere {
          ressurs {
            visningsNavn
            fornavn
            etternavn
            koblinger {
              organisasjonsenhet {
                navn
                orgNiv
                agressoId
              }
            }
          }
        }
      }
    }
  }
}

fragment RessursStandalone on Ressurs {
  navident
  fornavn
  etternavn
  visningsnavn
  epost
  telefon {
    beskrivelse
    nummer
    type
  }
}

fragment RessursWithLeder on Ressurs {
  ...RessursStandalone
  ledere {
    ressurs {
      navident
    }
  }
}

fragment OrgenhetAgressoIds on OrgEnhet {
  agressoId
  orgNiv
  navn
}

fragment RessursWithKobling on Ressurs {
  ...RessursStandalone
  koblinger {
    organisasjonsenhet {
      ...OrgenhetAgressoIds
    }
  }
}

fragment RessursWithLederAndKobling on Ressurs {
  ...RessursWithLeder
  ...RessursWithKobling
}

fragment OrgenhetStandaloneWithLeder on OrgEnhet {
  ...OrgenhetAgressoIds
  gyldigFom
  gyldigTom
  leder {
    ressurs {
      ...RessursStandalone
      koblinger {
        organisasjonsenhet {
          ...OrgenhetAgressoIds
        }
      }
    }
  }
}

query HentMedFragmentEnhet($agressoId: String!, $orgNiv: String!) {
  enhet: orgEnhet(where: { agressoId: $agressoId, orgNiv: $orgNiv }) {
    ...OrgenhetAgressoIds
    gyldigFom
    gyldigTom
  }
}

query HentHierarki($agressoId: String!, $orgNiv: String!) {
  enhet: orgEnhet(where: { agressoId: $agressoId, orgNiv: $orgNiv }) {
    ...OrgenhetAgressoIds
    gyldigFom
    gyldigTom
    type {
      kode
    }
    leder {
      ressurs {
        ...RessursStandalone
        orgTilknytning {
          orgEnhet {
            ...OrgenhetAgressoIds
            id
          }
        }
      }
    }
  }

  ressursKoblinger: organisasjonsenhet(
    where: { agressoId: $agressoId, orgNiv: $orgNiv }
  ) {
    koblinger {
      ressurs {
        ...RessursStandalone
        ledere {
          ressurs {
            ...RessursStandalone
          }
        }
      }
    }
  }

  enhetsKoblinger: organisasjonsenhet(
    where: { agressoId: $agressoId, orgNiv: $orgNiv }
  ) {
    underenheter: organiseringer(retning: under) {
      organisasjonsenhet {
        ...OrgenhetStandaloneWithLeder
      }
    }

    overenheter: organiseringer(retning: over) {
      organisasjonsenhet {
        ...OrgenhetStandaloneWithLeder
        organiseringer(retning: over) {
          organisasjonsenhet {
            ...OrgenhetStandaloneWithLeder
            organiseringer(retning: over) {
              organisasjonsenhet {
                ...OrgenhetStandaloneWithLeder
                organiseringer(retning: over) {
                  organisasjonsenhet {
                    ...OrgenhetStandaloneWithLeder
                    organiseringer(retning: over) {
                      organisasjonsenhet {
                        ...OrgenhetStandaloneWithLeder
                        organiseringer(retning: over) {
                          organisasjonsenhet {
                            ...OrgenhetStandaloneWithLeder
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

query HentLederFornavident($navident: String) {
  ressurs(where: { navident: $navident }) {
    navident
    ledere {
      ressurs {
        navident
        visningsNavn
        fornavn
        etternavn
        koblinger {
          organisasjonsenhet {
            navn
            orgNiv
            agressoId
          }
        }
      }
    }
  }
}

query HentRessurs($navident: String) {
  ressurs(where: { navident: $navident }) {
    ...RessursWithKobling
    sektor
    ledere {
      ressurs {
        ...RessursStandalone
        orgTilknytning {
          orgEnhet {
            agressoId
            orgNiv
            navn
            id
          }
        }
      }
    }
  }
}