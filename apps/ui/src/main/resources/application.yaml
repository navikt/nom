management.endpoints.web.exposure.include: health,prometheus

app:
  api:
    base-url: http://nom-api
    graphQL-url: ${app.api.base-url}/graphql

spring:
  security:
    oauth2:
      client:
        registration:
          aad:
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          aad:
            authorization-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/discovery/v2.0/keys
