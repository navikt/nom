management.endpoints.web.exposure.include: health,prometheus

app:
  aad:
    issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
  nom-api:
    client-id: ${NOM_API_CLIENT_ID}
    base-url: ${NOM_API_BASE_URL}
    graphQL-url: ${app.nom-api.base-url}/graphql

spring:
  security:
    oauth2:
      client:
        registration:
          aad:
            provider: aad
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # ClientId/.default er for å få accessToken som går for denne appen, offline_access er for å få refresh token.
            # Profile er for å få med mer opplysninger (e.g. navn)
            # Note: Siden vi setter scope til denne appen, så får man ikke user-info/details endpoint og dermed hentes ikke bruker opplysninger via OidcUserService.
            scope: openid,offline_access,${AZURE_APP_CLIENT_ID}/.default,profile
        provider:
          aad:
            issuer-uri: ${app.aad.issuer-uri}

# Refresh token er valid i 30 dager, men anbefalt å bruke noe mindre enn dette.
server.servlet.session.timeout: 7d

server.servlet.session.cookie.name: JSESSIONID_NOMUI

nom:
  libs:
    utils:
      common:
        app:
          load-properties: true
          
