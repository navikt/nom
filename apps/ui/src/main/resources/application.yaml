management.endpoints.web.exposure.include: health,prometheus

app:
  aad:
    issuer-uri: https://login.microsoftonline.com/${AZURE_APP_TENANT_ID}/v2.0
  api:
    base-url: http://nom-api
    graphQL-url: ${app.api.base-url}/graphql

spring:
  security:
    oauth2:
      client:
        registration:
          aad:
            client-id: ${AZURE_APP_CLIENT_ID}
            client-secret: ${AZURE_APP_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          aad:
            issuer-uri: ${app.aad.issuer-uri}

# Refresh token er valid i 30 dager, men anbefalt å bruke noe mindre enn dette.
server.servlet.session.timeout: 7d
